; Phantom Wake - purchase roster for Task Force Builder.
; Point costs come from campaigns/PhantomWake/FleetScoring/fleet.csv.
;
; Syntax: <unit_type>=<VariantReference>,<VariantReference>|<point_cost>
; If the |cost is omitted the unit's own [TaskForce] TaskForceCost is used.
;
; Variant references verified against docs/glossary/units.csv (generated from
; share/vessels). Re-check with:  python3 tools/units.py show <alias>
; Variants are cosmetic - hull number, flag, livery, service date. Every unit
; also has a Default variant, but vanilla rosters never list it, so this file
; does not either.
;
; TaskForceModeAllowedRosterUnits in campaign.ini can only narrow this list.
; Keep the two in sync when adding a hull.

[AllowedVessels]

; --- expendables and scouts ---
wp_pt_p4=Variant1|10                                    ; Soviet, 1 variant only
wp_pt_p6=Variant1,Variant2,Variant3|15                  ; Soviet, 89 available
wp_pt_stenka=Variant1,Variant2,Variant3|20              ; Soviet, 40 available
wp_msc_T43K=Variant1|25                                 ; Soviet, 1 variant only

; --- torpedo boats ---
wp_pt_shershen=Variant1,Variant2,Variant3|30            ; Soviet, 71 available
wp_pt_shershen-er=Variant1|35                           ; Egypt, 1 variant only
wp_pt_turya=Variant1,Variant2,Variant3|45               ; Soviet, 28 available

; --- escorts ---
knm_fs_sleipner=Variant1,Variant2|40                    ; Norway, both (F310, F311)
ir_pf_bayandor=Variant1,Variant2,Variant3,Variant4|50   ; Iran, all 4
knm_ptg_snogg=Variant1,Variant2,Variant3|90             ; Norway, 6 available

; --- surplus gun destroyers, sold on and sold on again ---
rn_dd_z-class=Variant1,Variant2,Variant3|80             ; Israel, Israel, Egypt
rn_dd_c-class=Variant1,Variant2,Variant3|80             ; Pakistan x3
rn_dd_battle=Variant1,Variant2,Variant3|90              ; Pakistan, Pakistan, UK

; --- the prize hull ---
usn_dd_gearing=Variant1,Variant2,Variant3|130           ; US, 73 available

; --- Contract 02 tier unlock (Pandora's Box) ---
; Purchasable starting Mission5 only - see TaskForceModeAllowedRosterUnits on
; that [MissionN] block in campaign.ini. Missions 1-4 keep the original
; early-roster subset unchanged; this block is additive on top of it.
; wp_mpk_grisha3 carries the SA-N-4 - the first and only SAM-capable hull in
; the roster. Mission5's flavour text and builder-situation text were
; rewritten to account for it; if this entry is ever pulled back out, revert
; those texts too (git blame the Mission5 [Language_en]/[Language_ru] block).
ins_pt_saar=Variant1,Variant2,Variant3|40               ; Israel, 13 available - gunboat, no missiles
ins_ptg_saar_2=Variant1,Variant2,Variant3|85            ; Israel, 7 available - 3x Gabriel ASCM
ins_ptg_aliya=Variant1,Variant2|100                     ; Israel, 3 available - 2x Harpoon, 4x Gabriel, no gun
ins_ptg_hetz=Variant1,Variant2|110                      ; Israel, 3 available - 2x Harpoon, 6x Gabriel, 76mm, Phalanx
wp_mpk_grisha3=Variant1,Variant2,Variant3|145           ; Soviet, 35 available - SA-N-4 SAM, RBU, ASW torpedoes

; --- awarded, never purchasable ---
; MV Pandora, the converted RO-RO awarded by contract 02 (Pandora's Box).
; Listed here for exactly the same reason as wp_ss_foxtrot below: so the
; awarded hull has a roster entry to live in, can be repaired between
; contracts, and shows a sane price if it is ever dismissed. It is
; deliberately absent from every TaskForceModeAllowedRosterUnits line in
; campaign.ini, so it never appears for purchase in Task Force Builder.
; Variant2 matches the hull authored in the mission file - the CampaignTag
; there is wp_ms_roro_b_Variant2 and the two must agree.
wp_ms_roro_b=Variant2|120                               ; Soviet, 5 available

[AllowedSubmarines]
; Phantom Wake cannot afford to buy a submarine. The Foxtrot is listed only
; so the boat awarded by contract 01-C (Rusted Spear) has a roster entry to
; live in, can be repaired, and shows a sane price if it is ever dismissed.
; It is deliberately absent from every TaskForceModeAllowedRosterUnits line
; in campaign.ini, so it never appears for purchase in Task Force Builder.
; Add it to that line in a later mission only if the player is meant to be
; able to buy a second one.
; Variant66-71 are the Libyan-flagged variants, matching the regime the
; defecting crew stole her from.
wp_ss_foxtrot=Variant66|110

; =====================================================================
; ORGANIC AIR - MV PANDORA'S DECK PARK
;
; Syntax for air units is: <unit_type>=<SquadronN>,<SquadronN>|<cost_per_airframe>
; Note the key is a SQUADRON reference, not a Variant - aircraft, VTOLs and
; helicopters use SquadronReference=, vessels and submarines use
; VariantReference=. Mixing them fails silently.
;
; These eight airframes are the eight sitting on MV Pandora's deck in
; contract 02 (Pandora's Box). They are awarded by
; TaskForceModeCompletionRewardedUnits on [Mission5] in campaign.ini - the
; one field that DOES file its payload as aircraft, which is exactly right
; here and exactly wrong for a hull. Without an entry in this file an
; awarded airframe has nowhere in the roster to live and is dropped between
; contracts, which is why the air wing did not carry past contract 02.
;
; Squadron references are Squadron1 throughout and must stay in step with
; the CustomAirGroup block on [Taskforce1Vessel3] in
; missions/02_pandoras_box.ini, so the airframes the player flies in that
; contract are the same ones that turn up in the hangar afterwards.
;
; Deliberately absent from every TaskForceModeAllowedRosterUnits line in
; campaign.ini for now, same as wp_ss_foxtrot and wp_ms_roro_b: owned and
; deployable, not purchasable. Add them to that line in a later contract to
; open the aviation purchase tier.
;
; Deck capacity for reference: wp_ms_roro_b has AircraftCapacity=10 and
; DeckParkSlots=8, so eight airframes fill the park with two hangar spaces
; spare.
; =====================================================================

[AllowedHelicopters]
iriaf_ah-1j=Squadron1|30                                ; Iran, 3 squadrons - ASuW, CAS/AntiArmor
iqaf_md500=Squadron1|20                                 ; Iraq, 4 squadrons - Attack/SAR, CAS/AntiArmor/Recon
fr_as-350=Squadron1|15                                  ; Squadron1 is the Australian scheme - Transport only

[AllowedAircraft]
; Both of these are VTOL, not conventional fixed wing - they are the only
; thing on this roster that can operate off a welded-on flight deck with one
; launch point and no catapult.
usmc_av-8a=Squadron1|55                                 ; US, 5 squadrons - Fighter/Bomber
usn_v-19a=Squadron1|45                                  ; US, 3 squadrons - ASW/Bomber

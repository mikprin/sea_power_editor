; Phantom Wake - purchase roster for Task Force Builder.
; Point costs come from campaigns/PhantomWake/FleetScoring/fleet.csv.
;
; Syntax: <unit_type>=<VariantReference>,<VariantReference>|<point_cost>
; If the |cost is omitted the unit's own [TaskForce] TaskForceCost is used.
;
; !! VARIANT REFERENCES BELOW ARE UNVERIFIED !!
; fleet.csv only lists unit aliases, not variant references. Variant1 is a
; placeholder for every unit except usn_dd_gearing, whose variants are
; confirmed from the vanilla Pacific Strike roster. Open each unit .ini under
; StreamingAssets\original\vessels\ and replace with the real variant list
; before shipping, otherwise those hulls will not appear in Task Force Builder.

[AllowedVessels]

; --- expendables and scouts ---
wp_pt_p4=Variant1|10
wp_pt_p6=Variant1|15
wp_pt_stenka=Variant1|20
wp_msc_T43K=Variant1|25

; --- torpedo boats ---
wp_pt_shershen=Variant1|30
wp_pt_shershen-er=Variant1|35
wp_pt_turya=Variant1|45

; --- escorts ---
ir_pf_bayandor=Variant1|50
knm_ptg_snogg=Variant1|90

; --- surplus gun destroyers ---
rn_dd_z-class=Variant1|80
rn_dd_c-class=Variant1|80
rn_dd_battle=Variant1|90

; --- the prize hull ---
usn_dd_gearing=Variant9,Variant10,Variant18|130

[AllowedSubmarines]
; Phantom Wake cannot afford a submarine yet.

[AllowedHelicopters]
; No organic air until the company earns it.

[AllowedAircraft]
; No fixed wing until the company earns it.

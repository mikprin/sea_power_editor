; Phantom Wake - purchase roster for Task Force Builder.
; Point costs come from campaigns/PhantomWake/FleetScoring/fleet.csv.
;
; Syntax: <unit_type>=<VariantReference>,<VariantReference>|<point_cost>
; If the |cost is omitted the unit's own [TaskForce] TaskForceCost is used.
;
; Variant references verified against docs/glossary/units.csv (generated from
; share/vessels). Re-check with:  python3 tools/units.py show <alias>
; Variants are cosmetic - hull number, flag, livery, service date. Every unit
; also has a Default variant, but vanilla rosters never list it, so this file
; does not either.
;
; TaskForceModeAllowedRosterUnits in campaign.ini can only narrow this list.
; Keep the two in sync when adding a hull.

[AllowedVessels]

; --- expendables and scouts ---
wp_pt_p4=Variant1|10                                    ; Soviet, 1 variant only
wp_pt_p6=Variant1,Variant2,Variant3|15                  ; Soviet, 89 available
wp_pt_stenka=Variant1,Variant2,Variant3|20              ; Soviet, 40 available
wp_msc_T43K=Variant1|25                                 ; Soviet, 1 variant only

; --- torpedo boats ---
wp_pt_shershen=Variant1,Variant2,Variant3|30            ; Soviet, 71 available
wp_pt_shershen-er=Variant1|35                           ; Egypt, 1 variant only
wp_pt_turya=Variant1,Variant2,Variant3|45               ; Soviet, 28 available

; --- escorts ---
knm_fs_sleipner=Variant1,Variant2|40                    ; Norway, both (F310, F311)
ir_pf_bayandor=Variant1,Variant2,Variant3,Variant4|50   ; Iran, all 4
knm_ptg_snogg=Variant1,Variant2,Variant3|90             ; Norway, 6 available

; --- surplus gun destroyers, sold on and sold on again ---
rn_dd_z-class=Variant1,Variant2,Variant3|80             ; Israel, Israel, Egypt
rn_dd_c-class=Variant1,Variant2,Variant3|80             ; Pakistan x3
rn_dd_battle=Variant1,Variant2,Variant3|90              ; Pakistan, Pakistan, UK

; --- the prize hull ---
usn_dd_gearing=Variant1,Variant2,Variant3|130           ; US, 73 available

; --- awarded, never purchasable ---
; MV Pandora, the converted RO-RO awarded by contract 02 (Pandora's Box).
; Listed here for exactly the same reason as wp_ss_foxtrot below: so the
; awarded hull has a roster entry to live in, can be repaired between
; contracts, and shows a sane price if it is ever dismissed. It is
; deliberately absent from every TaskForceModeAllowedRosterUnits line in
; campaign.ini, so it never appears for purchase in Task Force Builder.
; Variant2 matches the hull authored in the mission file - the CampaignTag
; there is wp_ms_roro_b_Variant2 and the two must agree.
wp_ms_roro_b=Variant2|120                               ; Soviet, 5 available

[AllowedSubmarines]
; Phantom Wake cannot afford to buy a submarine. The Foxtrot is listed only
; so the boat awarded by contract 01-C (Rusted Spear) has a roster entry to
; live in, can be repaired, and shows a sane price if it is ever dismissed.
; It is deliberately absent from every TaskForceModeAllowedRosterUnits line
; in campaign.ini, so it never appears for purchase in Task Force Builder.
; Add it to that line in a later mission only if the player is meant to be
; able to buy a second one.
; Variant66-71 are the Libyan-flagged variants, matching the regime the
; defecting crew stole her from.
wp_ss_foxtrot=Variant66|110

[AllowedHelicopters]
; No organic air until the company earns it.

[AllowedAircraft]
; No fixed wing until the company earns it.

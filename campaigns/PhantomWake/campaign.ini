[File]
Base=campaigns/PhantomWake/campaign.ini

[Campaign]
Type=Linear
Difficulty=2
Length=2
DisplayFormat=MapView

[TaskForceMode]
Enabled=True

; The PMC has no flagship doctrine - losing any single hull is painful but not an instant loss
TaskForceRequireFlagship=False

DefaultTaskForceName=Obsidian Orcas

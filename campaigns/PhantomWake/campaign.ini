Name_en=SAFE HAVEN
MissionSequenceName_en=CONTRACT 01-B (OPTIONAL)
MapShortName_en=01B
Description_en=Mascarene Basin, territorial waters west of Mauritius
MissionIntro_en=An anonymous corporate client is sitting on a chartered expedition yacht with a very convenient engine failure, three briefcases of unmarked bearer bonds, and a Coast Guard sweeping the water around him. No fee for sinking anything. The whole fee for never having been there. Slip through the patrol screen in the dark, take him off the yacht, and withdraw to NavPoint Sanctuary. Take as long as you need - nothing about this contract rewards hurrying.
MissionResupplyRules_en=The company can rearm and repair between contracts, but only with points you have actually earned. Nothing fired on this contract, nothing to replace.
TaskForceModeBuilderSituation_en=A single hull deploys on this contract. Small and quiet beats big and armed - nothing out here needs shooting, and everything out here can see you.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Weapons hold. Sinking a Coast Guard vessel voids the contract instantly, and so does letting one get a radar lock on you. Marked radar coverage is a no-go zone, not a hazard - run dark, run slow, and steer the seams.

Name_ru=ТИХАЯ ГАВАНЬ
MissionSequenceName_ru=КОНТРАКТ 01-B (ОПЦИОНАЛЬНЫЙ)
MapShortName_ru=01B
Description_ru=Маскаренская котловина, территориальные воды западнее Маврикия
MissionIntro_ru=Анонимный корпоративный заказчик сидит на зафрахтованной экспедиционной яхте с очень своевременной поломкой двигателя, тремя чемоданами предъявительских облигаций без пометок и береговой охраной, прочёсывающей воду вокруг. За потопленное не платят ничего. Весь гонорар - за то, что вас там никогда не было. Пройдите сквозь патрульную завесу в темноте, снимите его с яхты и отойдите к точке Санктуарий. Времени можете взять сколько нужно - в этом контракте спешка не вознаграждается ничем.
MissionResupplyRules_ru=Компания может пополнять боекомплект и ремонтироваться между контрактами, но только за реально заработанные очки. На этом контракте стрелять не придётся, восполнять будет нечего.
TaskForceModeBuilderSituation_ru=На этот контракт разворачивается один корпус. Малый и тихий лучше крупного и вооружённого - стрелять здесь не в кого, а видит вас здесь всё.
MissionSpecialNote_ru=Оружие в положении запрета. Потопление корабля береговой охраны аннулирует контракт мгновенно - равно как и позволить хоть одному взять вас на радиолокационное сопровождение. Обозначенные зоны радиолокационного покрытия - запретные районы, а не просто опасность: идите тёмными, идите малым ходом и держитесь швов между ними.

[Mission4]
Type=Mission
MissionFile=campaigns/PhantomWake/missions/01C_rusted_spear.ini
TaskForceModeMissionGenerationType=Generated
TaskForceModeDeploymentOptions=True
TaskForceModeDefaultDisposition=Formation
IsUnlocked=False
IsComplete=False
RequiredResult=Victory
Parents=1

; IncludesSubmarine is back to False, and this time it is not load-bearing.
;
; History, so nobody re-runs this experiment: S-311 Nyoka was authored as
; [Taskforce1Submarine1] and did not appear in the mission with this field
; False, then still did not appear with it True. The field was never the
; cause. In Generated mode the generator owns every Taskforce1 slot and
; rewrites the NumberOfTaskforce1* counts from the purchased task force, and
; the player owns no submarine here - the Foxtrot IS the fee - so the slot
; was dropped either way. TaskForceModeIgnoreUnit=True does not protect a
; submarine slot; vanilla only uses that field on Vessel slots.
;
; She is now [NeutralSubmarine1] in the mission file, outside the
; generator's namespace, and Trigger4 transfers her to Taskforce1 on
; contact. See the long comment on that section in 01C_rusted_spear.ini.
;
; So False is simply correct: the player deploys no submarine of their own
; in this contract.
TaskForceModeIncludesTaskForce=True
TaskForceModeIncludesAirwing=False
TaskForceModeIncludesSubmarine=False
TaskForceModeThreatProfileShip=True,3
TaskForceModeThreatProfileAir=True,2
TaskForceModeThreatProfileSub=False
TaskForceModeThreatProfileLand=False

TaskForceModeRearm=True
TaskForceModeRepair=True

; No unit cap on this one - unlike 01B this contract wants every hull the
; company can float. Nine gun-armed patrol craft and a helicopter, and a
; sixteen-knot surfaced submarine to keep alive in the middle of it.
TaskForceModeEnableTaskForceBuilder=True
; Same early-roster subset as Missions 1-3 - keep the four in sync. Note that
; wp_ss_foxtrot is intentionally NOT here: it exists in the roster file only
; to hold the boat this contract awards, and must never be purchasable.
TaskForceModeAllowedRosterUnits=wp_pt_p4,Variant1|wp_pt_p6,Variant1,Variant2,Variant3|wp_pt_stenka,Variant1,Variant2,Variant3|wp_msc_T43K,Variant1|wp_pt_shershen,Variant1,Variant2,Variant3|wp_pt_shershen-er,Variant1|wp_pt_turya,Variant1,Variant2,Variant3|knm_fs_sleipner,Variant1,Variant2|ir_pf_bayandor,Variant1,Variant2,Variant3,Variant4|knm_ptg_snogg,Variant1,Variant2,Variant3|rn_dd_z-class,Variant1,Variant2,Variant3|rn_dd_c-class,Variant1,Variant2,Variant3|rn_dd_battle,Variant1,Variant2,Variant3|usn_dd_gearing,Variant1,Variant2,Variant3

; The pay is the boat, so the cash reward is thin on purpose.
TaskForceModeCompletionPoints=15
TaskForceModeCompletionCapPoints=25

; NO TaskForceModeCompletionRewardedUnits HERE - ON PURPOSE.
; The fee is S-311 Nyoka, and she is awarded by JoinTaskForce=True on the
; [Taskforce1Submarine1] section of the mission file instead.
;
; A first version did use TaskForceModeCompletionRewardedUnits=wp_ss_foxtrot,
; Variant66,1 and the boat arrived in the player's task force under the
; FIXED WING tab. Every occurrence of that field in the vanilla Pacific
; Strike campaign is an aircraft with a SquadronReference, so the field
; appears to assume aircraft and files whatever it is given accordingly.
; Do not use it for vessels or submarines.

TaskForceModeDebriefNoticeTitle_en=Submarine Operations Unlocked
TaskForceModeDebriefNoticeText_en=S-311 Nyoka, Project 641 diesel electric, has joined the company roster with her defecting crew. She is slow, noisy and thirty years old, and she is the first hull Phantom Wake did not have to pay cash for.

TaskForceModeDebriefNoticeTitle_ru=Открыты операции подводных лодок
TaskForceModeDebriefNoticeText_ru=С-311 «Ньока», дизель-электрическая подводная лодка проекта 641, вошла в состав компании вместе со своим экипажем-перебежчиком. Она медленная, шумная, ей тридцать лет - и это первый корпус, за который Phantom Wake не пришлось платить наличными.

Name_en=RUSTED SPEAR
MissionSequenceName_en=CONTRACT 01-C (OPTIONAL)
MapShortName_en=01C
Description_en=Zanzibar Channel, Tanzanian coast, East Africa
MissionIntro_en=A faction of defecting officers from the local regimes navy has hijacked its own submarine - an aging Project 641 diesel electric - and got as far as the Zanzibar Channel before the dictator bottled them up behind a picket line of patrol boats. Forty metres of water means she cannot dive, which means she crosses on the surface at sixteen knots in broad daylight. Punch a hole in the blockade, make contact, and walk her out to the deep water shelf at NavPoint Zulu. The crew is the fee.
MissionResupplyRules_en=The company can rearm and repair between contracts, but only with points you have actually earned. This client is paying in hardware, not cash, so anything you fire here comes out of your own pocket.
TaskForceModeBuilderSituation_en=No political strings and no ROE at all. Bring guns, bring hulls, and bring something that can put rounds on a helicopter - the payoff is a submarine you could never afford to buy.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Stealth is not an option and the noise is the point - drawing fire away from the submarine is half the job. Nyoka must survive. She cannot dive in this channel, she cannot outrun anything, and her torpedoes are set to hold. Put your hull between her and the guns.

Name_ru=РЖАВОЕ КОПЬЁ
MissionSequenceName_ru=КОНТРАКТ 01-C (ОПЦИОНАЛЬНЫЙ)
MapShortName_ru=01C
Description_ru=Занзибарский пролив, побережье Танзании, Восточная Африка
MissionIntro_ru=Группа офицеров-перебежчиков из флота местного режима захватила собственную подводную лодку - старую дизель-электрическую проекта 641 - и дошла до Занзибарского пролива прежде, чем диктатор запер их за дозорной линией патрульных катеров. Сорок метров под килем означают, что погрузиться она не может, а значит идёт в надводном положении на шестнадцати узлах средь бела дня. Пробейте дыру в блокаде, установите контакт и выведите её на глубоководный свал в точке Зулу. Гонорар - экипаж.
MissionResupplyRules_ru=Компания может пополнять боекомплект и ремонтироваться между контрактами, но только за реально заработанные очки. Этот заказчик платит железом, а не деньгами, так что всё выпущенное здесь оплачиваете вы сами.
TaskForceModeBuilderSituation_ru=Никаких политических обязательств и вообще никаких правил применения оружия. Берите стволы, берите корпуса и берите что-нибудь, способное положить снаряды в вертолёт - платой будет подводная лодка, которую вы никогда не смогли бы купить.
MissionSpecialNote_ru=Скрытность здесь не вариант, и шум - это и есть замысел: оттянуть огонь от подводной лодки составляет половину работы. «Ньока» должна уцелеть. В этом проливе она не может погрузиться, она ни от кого не убежит, а её торпеды переведены в режим запрета. Держите свой корпус между ней и стволами.


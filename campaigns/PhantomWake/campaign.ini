[Language_en]
Name=Phantom Wake (PMC - Task Force Mode)
Description=You are the ripples of a storm they never saw coming.<LineBreak/><LineBreak/>Phantom Wake is a persistent Task Force Mode campaign in which you command a rogue maritime private military company. You start with a shoestring budget and a single tired hull, and you take the contracts nobody with a flag will touch.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: Losses, damage and weapon expenditure carry forward between contracts. Every missile fired is money burned.

[Language_ru]
Name=Phantom Wake (ЧВК - режим оперативного соединения)
Description=Вы - рябь от шторма, которого они не заметили.<LineBreak/><LineBreak/>Phantom Wake - это сквозная кампания в режиме оперативного соединения, в которой вы командуете частной военной компанией на море. Вы начинаете с бюджетом на верёвочках и одним усталым корпусом и берёте контракты, за которые не возьмётся никто, у кого есть флаг.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">ВНИМАНИЕ</Span>: Потери, повреждения и расход боезапаса переносятся между контрактами. Каждая выпущенная ракета - сожжённые деньги.


Name_en=HEAVY SEAS
MissionSequenceName_en=CONTRACT 02-B (OPTIONAL)
MapShortName_en=02B
Description_en=Central Arabian Sea, monsoon depression on the transit lane
MissionIntro_en=Halcyon Freight Lines has four loaded bulk carriers crossing the Arabian Sea and an underwriter who will not sign off the passage without an armed escort riding with them. The weather is the reason. A monsoon depression is sitting directly on the lane - sea state 7, driving rain, no moon, visibility under half a mile. Nobody is hunting this convoy. Nothing out here is interested in Phantom Wake at all. The company is being paid a flat escort fee to make sure four heavily laden merchants come out of the other side of a storm still afloat and still together. Take station, keep them on the plot, and walk them out to NavPoint Halcyon.
MissionResupplyRules_en=The company can rearm and repair between contracts, but only with points you have actually earned. Nothing on this contract needs shooting, so anything you do fire is money you chose to burn.
TaskForceModeBuilderSituation_en=A paid escort in filthy weather. Bring hulls that can hold a station in a heavy sea rather than hulls that can win a fight - there is no fight. Bring more than one if you can afford it, because a single escort covering a four ship column has nothing left over for anything unexpected.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Sea state 7 and near zero visibility. Passive sonar is useless in this much sea noise and surface search is degraded by clutter out to six miles, so the convoy has to be held visually and on the plot rather than on a scope. The merchants make fifteen knots and will not stop, slow, or answer a signal you cannot get to them. This is a night of seamanship, not gunnery.

Name_ru=КОНВОЙ В ШТОРМ
MissionSequenceName_ru=КОНТРАКТ 02-B (ОПЦИОНАЛЬНЫЙ)
MapShortName_ru=02B
Description_ru=Центральная часть Аравийского моря, муссонная депрессия на маршруте перехода
MissionIntro_ru=У Halcyon Freight Lines четыре гружёных балкера идут через Аравийское море, и страховщик не подпишет переход без вооружённого эскорта рядом. Причина - погода. Муссонная депрессия стоит точно на маршруте: волнение 7 баллов, ливень, полная темнота, видимость менее полумили. За этим конвоем никто не охотится. Здесь вообще никому нет дела до Phantom Wake. Компании платят фиксированную ставку за то, чтобы четыре тяжело гружёных судна вышли с другой стороны шторма на плаву и вместе. Займите позиции, держите их на планшете и доведите до точки NavPoint Halcyon.
MissionResupplyRules_ru=Компания может пополнять боекомплект и ремонтироваться между контрактами, но только за реально заработанные очки. Стрелять здесь не в кого, так что всё выпущенное - деньги, которые вы сожгли по собственному выбору.
TaskForceModeBuilderSituation_ru=Оплачиваемый эскорт в мерзкую погоду. Берите корпуса, способные держать позицию на крупной волне, а не выигрывать бой - боя не будет. Берите больше одного, если можете себе позволить: одинокий эскорт при колонне из четырёх судов не оставляет ничего в резерве на непредвиденное.
MissionSpecialNote_ru=Волнение 7 баллов и практически нулевая видимость. Пассивная гидроакустика в таком шуме моря бесполезна, обзор надводной обстановки забит помехами до шести миль - конвой придётся держать глазами и на планшете, а не на экране. Судовая колонна идёт пятнадцать узлов и не остановится, не сбавит ход и не ответит на сигнал, который до неё не дойдёт. Это ночь морской практики, а не артиллерии.

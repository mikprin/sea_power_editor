[Language_en]
Name=Phantom Wake (PMC - Task Force Mode)
Description=You are the ripples of a storm they never saw coming.<LineBreak/><LineBreak/>Phantom Wake is a persistent Task Force Mode campaign in which you command a rogue maritime private military company. You start with a shoestring budget and a single tired hull, and you take the contracts nobody with a flag will touch.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: Losses, damage and weapon expenditure carry forward between contracts. Every missile fired is money burned.


; Deck prep. Contract 02 made a plot point of the fifteen minute spin up
; time and then gave the player no way to beat it; this is that way. One
; flight can be sitting ready on the deck at mission start and one more can
; be half way through its prep. Keep both numbers small - the whole texture
; of a Pandora contract is that the deck is slow and the commander has to
; decide what to spend it on before anything has happened.
;
; UNVERIFIED: vanilla only ever pairs these three with land airbases, and
; its own debrief text talks about land based airbases. Whether the engine
; applies airbase prep to a ship flight deck has not been tested. If the
; prep panel does not appear in the Task Force Builder for this contract,
; this block is the reason and it can be deleted without affecting anything
; else - the air wing still deploys, it just starts cold.
TaskForceModeAirbasePrepAvailable=True
TaskForceModeAirbasePrepReadySlots=1

TaskForceModeDebriefNoticeTitle_en=Mobile Air Base Acquired
TaskForceModeDebriefNoticeText_en=MV Pandora, a converted RO-RO with a welded on flight deck, has joined the company roster in settlement of the clients debt, and the eight airframes parked on her deck came with the paperwork. She carries no weapons of any kind and she is worth more than everything else Phantom Wake owns put together. Assign the air wing to her hangar in Task Force Builder before the next contract.

TaskForceModeDebriefNoticeTitle_ru=Получена мобильная авиабаза
TaskForceModeDebriefNoticeText_ru=MV Pandora, переоборудованный ролкер с приваренной полётной палубой, вошла в состав компании в счёт долга заказчика, и восемь машин на её палубе перешли вместе с документами. У неё нет никакого вооружения, и она стоит больше, чем всё остальное имущество Phantom Wake вместе взятое. Распределите авиакрыло по ангару в Планировщике группы до следующего контракта.

Name_en=PANDORAS BOX
MissionSequenceName_en=CONTRACT 02
MapShortName_en=02
Description_en=Central Arabian Sea, deep water transit lane
MissionIntro_en=Meridian Naval Systems went bankrupt building an idea - a container ship with a flight deck welded on, cheap enough to be disposable and anonymous enough to be anywhere. They cannot pay our fee in money, so they are paying it in the ship. All Phantom Wake has to do is walk her across the Arabian Sea to the handover point, and she is ours. The Syndicate came to the same conclusion about her value some months ago and sent a force to take her intact. Meridian's lawyers signed the title over an hour ahead of schedule, which means we reached her first, and which means the force already at sea to collect her is now working from a hastily reissued order that reads destroy rather than capture. Three packs of fast attack craft are under way and converging on the passage. There is no route around them.
MissionResupplyRules_en=The company can rearm and repair between contracts, but only with points you have actually earned. This client is insolvent and paying in hardware, so every round fired here comes out of your own pocket.
TaskForceModeBuilderSituation_en=A heavy escort action against a swarm. Bring hulls with guns that elevate - the closing phase comes in low, and a Soviet Grisha III with a working Osa-M is the only hull in the roster that answers it with a missile instead of a gun, if the company can stretch to one. The escorted ship has a flight deck and eight aircraft on it, and using them is not optional.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Your radar will lie to you. A standoff jammer is up before you sail and unmanned decoy craft are mixed in among real torpedo boats, identical on a scope. Speed is the only remote tell. Launch aircraft from the container ship early - airframes need fifteen minutes on deck before they can fly, and by the time you need them it is too late to start. This is a long passage and nothing about it can be outrun.

Name_ru=ЯЩИК ПАНДОРЫ
MissionSequenceName_ru=КОНТРАКТ 02
MapShortName_ru=02
Description_ru=Центральная часть Аравийского моря, глубоководный транзитный коридор
MissionIntro_ru=Meridian Naval Systems обанкротились, строя идею - контейнеровоз с приваренной полётной палубой, достаточно дешёвый, чтобы быть расходным, и достаточно неприметный, чтобы быть где угодно. Расплатиться деньгами они не могут и отдают долг самим судном. Phantom Wake остаётся лишь провести его через Аравийское море до точки передачи - и оно наше. Синдикат пришёл к тем же выводам о его ценности несколько месяцев назад и выслал силы, чтобы взять судно целым. Юристы Meridian подписали передачу на час раньше срока - значит, мы успели первыми, и значит, силы, уже вышедшие за ней в море, работают теперь по наспех переизданному приказу, в котором вместо захвата стоит уничтожение. Три стаи быстроходных катеров на ходу и сходятся на маршруте перехода. Обойти их негде.
MissionResupplyRules_ru=Компания может пополнять боекомплект и ремонтироваться между контрактами, но только за реально заработанные очки. Этот заказчик неплатёжеспособен и платит железом, так что каждый выстрел здесь оплачиваете вы сами.
TaskForceModeBuilderSituation_ru=Тяжёлый эскортный бой против стаи. Берите корпуса с орудиями, которые поднимаются - завершающая фаза приходит на предельно малой высоте, а советский Гриша III с рабочей Осой-М - единственный корабль в реестре, способный ответить на неё ракетой, а не только стволом, если компания сможет на него наскрести. У сопровождаемого судна есть полётная палуба и восемь машин на ней, и пользоваться ими придётся.
MissionSpecialNote_ru=Радар сегодня будет вам врать. Самолёт РЭБ работает ещё до вашего выхода, а беспилотные катера-ложные цели идут вперемешку с настоящими торпедными катерами и на экране неотличимы. Единственный дистанционный признак - скорость. Поднимайте авиацию с контейнеровоза заранее: машине нужно пятнадцать минут на палубе, а когда она понадобится, начинать будет уже поздно. Переход длинный, и убежать от него нельзя.


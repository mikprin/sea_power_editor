Name_en=SWEEPING NET
MissionSequenceName_en=CONTRACT 01-A (OPTIONAL)
MapShortName_en=01A
Description_en=Pemba Channel, Tanzanian coast, East Africa
MissionIntro_en=A regional fishing conglomerate is losing its harvest and its crews to a localised pirate ring working the channel. The local coast guard is either too underfunded or too corrupt to handle it, so the job came to us. Flat bounty to clear the sector - find the skiffs hiding among the fishing fleet and sink them.
MissionResupplyRules_en=The company can rearm and repair between contracts, but only with points you have actually earned.
TaskForceModeBuilderSituation_en=A straightforward bounty sweep, ideal for building capital early. No client riding along, no political strings - just dont shoot the fishermen.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Conserve heavy ordnance - the bounty will not cover a spent anti-ship missile. Visual identification is required before engaging; sinking a neutral fishing vessel voids the contract immediately.

Name_ru=НЕВОД
MissionSequenceName_ru=КОНТРАКТ 01-A (ОПЦИОНАЛЬНЫЙ)
MapShortName_ru=01A
Description_ru=Пролив Пемба, побережье Танзании, Восточная Африка
MissionIntro_ru=Региональный рыболовный концерн теряет улов и экипажи из-за местной пиратской группы, работающей в проливе. Береговая охрана либо слишком бедна, либо слишком продажна, чтобы этим заняться, поэтому работа досталась нам. Фиксированная премия за зачистку сектора - найти лодки, прячущиеся среди рыболовного флота, и потопить их.
MissionResupplyRules_ru=Компания может пополнять боекомплект и ремонтироваться между контрактами, но только за реально заработанные очки.
TaskForceModeBuilderSituation_ru=Простая премиальная зачистка, идеально для раннего накопления капитала. Заказчика рядом нет, политических обязательств нет - просто не стреляйте по рыбакам.
MissionSpecialNote_ru=Берегите тяжёлый боезапас - премия не покроет израсходованную противокорабельную ракету. До открытия огня требуется визуальное опознавание; потопление нейтрального рыболовного судна аннулирует контракт немедленно.


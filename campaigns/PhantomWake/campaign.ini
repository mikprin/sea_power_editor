Name_en=RUSTED WATERS
MissionSequenceName_en=CONTRACT 01
MapShortName_en=01
Description_en=Bab-el-Mandeb approaches, Gulf of Aden
MissionIntro_en=A corporate proxy with no name has hired Phantom Wake to escort the container ship MV Vagabond out of the Bab-el-Mandeb approaches and into international water. The client paid a premium to keep the transit off the books, which means no local authorities and no help. The grounds ahead are fogbound and crowded with fishing craft, smugglers and skiffs that are none of those things. Link up with the client, take station, and walk her out to NavPoint Alpha.
MissionResupplyRules_en=The company can rearm and repair between contracts, but only with points you have actually earned. Spend ordnance like it is your own money, because it is.
TaskForceModeBuilderSituation_en=Phantom Wake owns almost nothing. Buy the largest hull you can afford and accept that you will be outgunned by anything with a real navy behind it.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Restrictive ROE. Lethal force is authorised only to defend the client vessel or your own hulls, and radar alone will not tell a fisherman from a pirate in this visibility. Identify visually before you engage.

Name_ru=РЖАВЫЕ ВОДЫ
MissionSequenceName_ru=КОНТРАКТ 01
MapShortName_ru=01
Description_ru=Подходы к Баб-эль-Мандебу, Аденский залив
MissionIntro_ru=Безымянный корпоративный посредник нанял Phantom Wake, чтобы вывести контейнеровоз MV Vagabond с подходов к Баб-эль-Мандебу в международные воды. Заказчик доплатил за то, чтобы переход не попал ни в какие бумаги, а значит - ни местных властей, ни помощи. Впереди туман и вода, забитая рыбацкими судами, контрабандистами и лодками, которые не являются ни тем, ни другим. Соединитесь с заказчиком, займите позицию и доведите судно до точки Альфа.
MissionResupplyRules_ru=Компания может пополнять боекомплект и ремонтироваться между контрактами, но только за реально заработанные очки. Тратьте боезапас как собственные деньги - это они и есть.
TaskForceModeBuilderSituation_ru=У Phantom Wake почти ничего нет. Купите самый крупный корпус, какой можете себе позволить, и смиритесь с тем, что любой, за кем стоит настоящий флот, вас перестреляет.
MissionSpecialNote_ru=Жёсткие правила применения оружия. Огонь на поражение разрешён только для защиты судна заказчика или собственных корпусов, а радар при такой видимости не отличит рыбака от пирата. Опознавайте визуально до открытия огня.


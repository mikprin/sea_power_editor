[File]
Base=campaigns/PhantomWake/campaign.ini

[Campaign]
Type=Linear
Difficulty=2
Length=2
DisplayFormat=MapView

[TaskForceMode]
Enabled=True

; The PMC has no flagship doctrine - losing any single hull is painful but not an instant loss
TaskForceRequireFlagship=False

DefaultTaskForceName=Obsidian Orcas
TaskForceNameOptions=Obsidian Orcas|Phantom Wake Actual|Grey Company|Salvage Group One

CommanderSettingsFile=commander_settings.ini
RosterFile=player_task_force_roster.ini

TaskForceDifficultyPresets=Easy|Moderate|Difficult
DefaultTaskForceDifficultyPreset=Moderate

; Shoestring budget - the underdog opening from IDEA.md. One escort plus a boat or two.
StartingPoints=80
PointCap=80

ShipIncludesAirwing=True
PurchaseLoadouts=True
BasicShipLoadoutVariants=Default
LockedShipLoadoutVariants=Late

CSARPointModifier=5

CrewSkillInitial=Green
CrewSkillThresholds=Trained:1|Seasoned:3|Veterans:5|Ultra:10

; Mercenaries sell hulls off cheap and buy them back dear
UnitDecommissionPointReturnModifier=0.25
UnitDismissPointReturnModifier=0.5

DamageToAllowRepair=Light,Moderate
DamageToDisallowRepair=Heavy
RepairPointsCost=Light,0.15|Moderate,0.35

[TaskForceModeDifficulty_Easy]
Name=Easy
StartingPoints=105
PointCap=105
ShipIncludesAirwing=True
PurchaseLoadouts=False
InitialUnlockedLoadouts=Default|Late
RepairCostModifier=0.75
UnitDecommissionPointReturnModifier=0.35
UnitDismissPointReturnModifier=0.65
CrewSkillInitial=Trained

[TaskForceModeDifficulty_Moderate]
Name=Moderate
StartingPoints=80
PointCap=80
ShipIncludesAirwing=True
PurchaseLoadouts=True
InitialUnlockedLoadouts=Default
RepairCostModifier=1
UnitDecommissionPointReturnModifier=0.25
UnitDismissPointReturnModifier=0.5
CrewSkillInitial=Green

[TaskForceModeDifficulty_Difficult]
Name=Difficult
StartingPoints=60
PointCap=60
ShipIncludesAirwing=False
PurchaseLoadouts=True
InitialUnlockedLoadouts=Default
RepairCostModifier=1.25
UnitDecommissionPointReturnModifier=0.15
UnitDismissPointReturnModifier=0.35
CrewSkillInitial=Green

[Language_en]
Name=Phantom Wake (PMC - Task Force Mode)
Description=You are the ripples of a storm they never saw coming.<LineBreak/><LineBreak/>Phantom Wake is a persistent Task Force Mode campaign in which you command a rogue maritime private military company. You start with a shoestring budget and a single tired hull, and you take the contracts nobody with a flag will touch.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: Losses, damage and weapon expenditure carry forward between contracts. Every missile fired is money burned.

[Missions]
NumberOfMissions=4

[Mission1]
Type=Mission
MissionType=Main
MissionFile=campaigns/PhantomWake/missions/01_rusted_sea.ini
TaskForceModeMissionGenerationType=Generated
IsUnlocked=True
IsComplete=False
RequiredResult=CostlyVictory

; Opening this event runs commander Service Record setup
Onboarding=True
TaskForceModeServiceRecordOnboarding=True

; Display only - what deploys and what the threat looks like
TaskForceModeIncludesTaskForce=True
TaskForceModeIncludesAirwing=False
TaskForceModeIncludesSubmarine=False
TaskForceModeThreatProfileShip=True,1
TaskForceModeThreatProfileAir=True,2
TaskForceModeThreatProfileSub=False
TaskForceModeThreatProfileLand=False

TaskForceModeRearm=True
TaskForceModeRepair=True

TaskForceModeEnableTaskForceBuilder=True
; Must be a subset of player_task_force_roster.ini - this line can only narrow that
; list, never widen it. Anything missing here is invisible in Task Force Builder even
; if the roster file has it. Keep the two in sync when adding hulls.
TaskForceModeAllowedRosterUnits=wp_pt_p4,Variant1|wp_pt_p6,Variant1,Variant2,Variant3|wp_pt_stenka,Variant1,Variant2,Variant3|wp_msc_T43K,Variant1|wp_pt_shershen,Variant1,Variant2,Variant3|wp_pt_shershen-er,Variant1|wp_pt_turya,Variant1,Variant2,Variant3|knm_fs_sleipner,Variant1,Variant2|ir_pf_bayandor,Variant1,Variant2,Variant3,Variant4|knm_ptg_snogg,Variant1,Variant2,Variant3|rn_dd_z-class,Variant1,Variant2,Variant3|rn_dd_c-class,Variant1,Variant2,Variant3|rn_dd_battle,Variant1,Variant2,Variant3|usn_dd_gearing,Variant1,Variant2,Variant3

TaskForceModeCompletionPoints=70
TaskForceModeCompletionCapPoints=40

Name_en=RUSTED WATERS
MissionSequenceName_en=CONTRACT 01
MapShortName_en=01
Description_en=Bab-el-Mandeb approaches, Gulf of Aden
MissionIntro_en=A corporate proxy with no name has hired Phantom Wake to escort the container ship MV Vagabond out of the Bab-el-Mandeb approaches and into international water. The client paid a premium to keep the transit off the books, which means no local authorities and no help. The grounds ahead are fogbound and crowded with fishing craft, smugglers and skiffs that are none of those things. Link up with the client, take station, and walk her out to NavPoint Alpha.
MissionResupplyRules_en=The company can rearm and repair between contracts, but only with points you have actually earned. Spend ordnance like it is your own money, because it is.
TaskForceModeBuilderSituation_en=Phantom Wake owns almost nothing. Buy the largest hull you can afford and accept that you will be outgunned by anything with a real navy behind it.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Restrictive ROE. Lethal force is authorised only to defend the client vessel or your own hulls, and radar alone will not tell a fisherman from a pirate in this visibility. Identify visually before you engage.


TaskForceModeDebriefNoticeTitle_en=Mobile Air Base Acquired
TaskForceModeDebriefNoticeText_en=MV Pandora, a converted RO-RO with a welded on flight deck, has joined the company roster in settlement of the client's debt. She carries no weapons of any kind and she is worth more than everything else Phantom Wake owns put together.

TaskForceModeDebriefNoticeTitle_ru=Получена мобильная авиабаза
TaskForceModeDebriefNoticeText_ru=MV Pandora, переоборудованный ролкер с приваренной полётной палубой, вошла в состав компании в счёт долга заказчика. У неё нет никакого вооружения, и она стоит больше, чем всё остальное имущество Phantom Wake вместе взятое.

Name_en=PANDORAS BOX
MissionSequenceName_en=CONTRACT 02
MapShortName_en=02
Description_en=Central Arabian Sea, deep water transit lane
MissionIntro_en=Meridian Naval Systems went bankrupt building an idea - a container ship with a flight deck welded on, cheap enough to be disposable and anonymous enough to be anywhere. They cannot pay our fee in money, so they are paying it in the ship. All Phantom Wake has to do is walk her out of the transit lane to NavPoint Keystone in international water, and she is ours. The Syndicate came to the same conclusion about her value some months ago and sent a force to take her intact. Meridian's lawyers signed the title over an hour ahead of schedule, which means we reached her first, and which means the men waiting out in the lane are now working from a hastily reissued order that reads destroy rather than capture.
MissionResupplyRules_en=The company can rearm and repair between contracts, but only with points you have actually earned. This client is insolvent and paying in hardware, so every round fired here comes out of your own pocket.
TaskForceModeBuilderSituation_en=A heavy escort action against a swarm. Bring hulls with guns that elevate - the closing phase comes in low and nothing in the roster carries a surface to air missile. The escorted ship has a flight deck and eight aircraft on it, and using them is not optional.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Your radar will lie to you. The attack opens with heavy jamming and a swarm of unmanned decoy craft mixed in among real torpedo boats, and the two look identical on a scope. Launch aircraft from the container ship early - airframes need fifteen minutes on deck before they can fly, and by the time you need them it is too late to start.

Name_ru=ЯЩИК ПАНДОРЫ
MissionSequenceName_ru=КОНТРАКТ 02
MapShortName_ru=02
Description_ru=Центральная часть Аравийского моря, глубоководный транзитный коридор
MissionIntro_ru=Meridian Naval Systems обанкротились, строя идею - контейнеровоз с приваренной полётной палубой, достаточно дешёвый, чтобы быть расходным, и достаточно неприметный, чтобы быть где угодно. Расплатиться деньгами они не могут и отдают долг самим судном. Phantom Wake остаётся лишь вывести его из транзитного коридора в точку NavPoint Keystone в международных водах - и оно наше. Синдикат пришёл к тем же выводам о его ценности несколько месяцев назад и выслал силы, чтобы взять судно целым. Юристы Meridian подписали передачу на час раньше срока - значит, мы успели первыми, и значит, те, кто ждёт нас в коридоре, работают теперь по наспех переизданному приказу, в котором вместо захвата стоит уничтожение.
MissionResupplyRules_ru=Компания может пополнять боекомплект и ремонтироваться между контрактами, но только за реально заработанные очки. Этот заказчик неплатёжеспособен и платит железом, так что каждый выстрел здесь оплачиваете вы сами.
TaskForceModeBuilderSituation_ru=Тяжёлый эскортный бой против стаи. Берите корпуса с орудиями, которые поднимаются - завершающая фаза приходит на предельно малой высоте, а зенитных ракет нет ни у одного корабля в реестре. У сопровождаемого судна есть полётная палуба и восемь машин на ней, и пользоваться ими придётся.
MissionSpecialNote_ru=Радар сегодня будет вам врать. Атака начинается с мощных помех и роя беспилотных катеров-ложных целей вперемешку с настоящими торпедными катерами, и на экране они неотличимы. Поднимайте авиацию с контейнеровоза заранее: машине нужно пятнадцать минут на палубе, а когда она понадобится, начинать будет уже поздно.

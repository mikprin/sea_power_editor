; Phantom Wake - commander setup.
;
; The company recruits from wherever officers get thrown out. Nation keys below
; reuse the vanilla name pools, rank ladders and rank insignia art that ship
; with the base game, so no custom art is required to launch the campaign.
;
; TODO before public release: swap NavyEmblem paths for Phantom Wake art and
; add a [TaskForceRibbons] block once ribbon and medal PNGs exist under
; campaigns/PhantomWake/art/. No ribbons are awarded yet - awarding a ribbon ID
; that has no definition here will break the debrief.

[CommanderSettings]
CommanderNations=US|Australia
CommanderDefaultNation=US
CommanderNameDefaultUS=Ray Callaghan
CommanderNameDefaultAustralia=Grant Morrison
CommanderNamePoolUS=Names_USA
CommanderNamePoolAustralia=Names_Australia

; Everyone here was busted down or walked away. You start low.
CommanderStartingRankLevel=4

; Nobody gives a mercenary a discount
SameNationUnitDiscount=0.1

NavyNameUS=Phantom Wake Maritime Solutions
NavyEmblemUS=ui/campaign/navy_emblems/usn_emblem.png
NavyNameAustralia=Phantom Wake Maritime Solutions
NavyEmblemAustralia=ui/campaign/navy_emblems/ran_emblem.png


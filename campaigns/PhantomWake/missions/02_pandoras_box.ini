; =====================================================================
; HOSTILE - THE STANDOFF JAMMER
;
; usn_eka-3b on the hand-placed start position and the hand-drawn
; waypoint list from the editor build, with Loop appended so it keeps
; working the sector instead of flying off on the last leg.
;
; PATROL MOVED 25 NM SOUTH. Measured across the convoy corridor, every
; waypoint of the editor route sat 22 to 31 NM north of the axis - the
; jammer never once overflew the lane it was supposed to be covering.
; The whole loop is shifted so it now straddles the corridor (cross -3
; to +6 NM). Same shape, same nine legs, same Loop.
;
; THIS IS THE SYNDICATE'S EYES, and the only unit on the hostile side
; that has any. Five sensor systems, of which two matter:
;   SensorSystem2  Radar  AN/ASB-1B      - active, RadarsActive=True
;   SensorSystem5  ESM    AircraftELINT  - passive, hears the player's
;                                          own radars at long range
; At 20,000 ft its radar horizon is roughly 170 NM, so with the patrol
; on the corridor it holds the convoy for most of the passage. The two
; ECM sets (AN/ALT-28 offensive, AircraftDECM_Med defensive) are what
; Trigger2 models as the Pandora losing her sensors.
;
; What that detection does NOT do is re-task the boats - Sea Power has
; no fleet-level AI, so a shared contact never makes a surface group
; change course. What it does do is feed units that can already shoot at
; range: the Baleares' 16 RIM-66B (25 NM) in the support group, and the
; two Frelons once they launch.
;
; PRESENT FROM T=0. The jamming is the mission's ambient condition, not
; an event - Trigger2 only reports it. Nation=us is kept from the
; backbone and deliberately unexplained.
;
; It is reachable: a Harrier on AirToAir can get to 20,000 ft, and
; killing it restores the Pandora's own sensors through Trigger8. That
; is why the air wing has two AV-8As, and why this is a hidden objective
; rather than scenery.
; =====================================================================

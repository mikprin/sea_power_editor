; =====================================================================
; HOSTILE - THE STANDOFF JAMMER
;
; The script's "American EW reconnaissance aircraft". usn_eka-3b flying
; a racetrack at 25,000 ft, 40 to 50 NM east of the lane, with an empty
; loadout and its own radars off. Same idea as the EA-6B in Mission 01,
; but this one is reachable: a Harrier on AirToAir can get to it, and
; doing so restores the Pandora's sensor suite through Trigger6. That
; is the reason the air wing has two AV-8As, and the reason the jammer
; is a hidden objective rather than scenery.
;
; UnlimitedFuel because there is no airbase in the mission for it to
; recover to. Nation=us is deliberate - nobody in the company can
; explain what a US electronic warfare aircraft is doing out here, and
; this contract does not answer it.
; =====================================================================

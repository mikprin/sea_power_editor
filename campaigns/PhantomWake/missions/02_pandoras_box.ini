; =====================================================================
; THE PRIZE - MV PANDORA
;
; Converted RO-RO with a welded on flight deck, the game's stand in for
; an ARAPAHO container carrier. wp_ms_roro_b has Role=CVL and
; AircraftCapacity=10 in its unit file, so the eight airframe wing from
; the script fits with two slots spare.
;
; She is the fee for this contract and she is awarded the same way the
; Foxtrot was in 01C - JoinTaskForce=True on a properly named
; Taskforce1VesselN section, NOT TaskForceModeCompletionRewardedUnits
; in campaign.ini. See 01C BUILD_NOTES: that field files everything it
; is handed as an aircraft and put the submarine under the FIXED WING
; tab in Task Force Builder. Do not use it for hulls.
;
; TaskForceModeIgnoreUnit=True keeps the generator's hands off her.
; CampaignTag is required for persistence tracking, CampaignRepair lets
; her be repaired between contracts.
;
; WeaponStatus=Hold and OverrideWeaponStatus=Hold because she has no
; weapons at all. IsValuableUnit=True makes friendly AI screen her,
; which matters when the Exocets arrive in Phase 3.
; =====================================================================
[Taskforce1Vessel3]
Type=wp_ms_roro_b
VariantReference=Variant2
LoadoutVariant=Default
TaskForceModeIgnoreUnit=True
JoinTaskForce=True
CampaignRepair=True

; =====================================================================
; HOSTILE - DECOY CRAFT
;
; usn_septar_qst-35 is the game's SEPTAR, a real US Navy Seaborne
; Powered Target: an 18 metre unmanned radio controlled boat.
; tools-units.py reports "carries no ammunition" - it has no weapon
; systems at all, so unlike the empty-magazine Boghammars in Mission 01
; these cannot fire under any circumstance and need no magazine
; override. WeaponStatus is set to Hold anyway, belt and braces.
;
; Sixteen of them against twelve real Hounds. On radar that is 28 small
; fast returns inside a jamming envelope. Their only tell before visual
; identification is speed - SEPTAR tops out at 20 kt against the
; Libelle's 48 - which is exactly the discriminator E.C.H.O. offers the
; player in the Phase 2 popup. Getting an aircraft overhead is the
; other way, and it is the one the script wants.

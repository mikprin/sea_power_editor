; The jammer is airborne from t=0, so this is a report, not an event.
; Ninety seconds in, after the player has read the intro.
[Trigger2]
Name=EW environment reported - Pandora sensors down
Condition_Settled_Type=Time
Condition_Settled_Time=90
ConditionsCompleted=<Settled>
Action_Taskforce1_Message=Taskforce1JammingMessage

; =====================================================================
; DESIGN NOTE - WHY THERE ARE ALMOST NO SCRIPTED SPAWNS
;
; The first build gated every event on a circle drawn across the convoy
; lane. Playtest killed it outright: those circles are RENDERED TO THE
; PLAYER on the tactical map, so the player simply steered ten miles
; south of all three, sailed past them and completed the contract
; without firing a shot or seeing a single popup.
;
; Fixed here in three ways, none of which is a bigger circle.
;
; 1. EVERY HOSTILE UNIT EXISTS AT T=0 AND MOVES ON ITS OWN ROUTE.
;    Nothing is Disabled=True except the two strike helicopters. The
;    three Hound packs, the support group and the jammer are on the
;    positions and headings laid out by hand in the editor, compressed
;    toward the player along the corridor axis. Each pack Loops a
;    cross-corridor lane of its own, so the three of them screen the
;    whole crossing rather than converging on one line. See the ABYSSAL
;    HOUNDS block for the geometry and the three defects it fixes.
;
; 2. NARRATIVE TRIGGERS USE UnitDetected, NOT UnitsInTheArea.
;    A radio call fires when the player's sensors actually acquire the
;    thing being talked about, wherever that happens. It cannot be
;    walked around because it is not a place. Verified pattern, already
;    used in 01A_sweeping_net Trigger3 and Trigger7.
;
; 3. THE ONLY POSITIONAL CONDITION LEFT IS THE WIN CIRCLE.
;    That one is the objective, so the player is supposed to steer to
;    it. No other condition in this file has a position at all, so
;    there is nothing else on the plot to route around.
;
; The single sanctioned clock is Trigger6, which launches the two strike
; helicopters from off the player's plot. It is ORed with "a pack leader
; has been detected", so it lands relative to the fight for any player
; who has made contact, and still lands for one who somehow has not.
; =====================================================================

[Mission]
Difficulty=0
PlayerTaskforce=Taskforce1
EnemyTaskforce=Taskforce2
NumberOfTaskforce1Vessels=3
NumberOfTaskforce2Vessels=37
NumberOfTaskforce2Aircraft=1
NumberOfTaskforce2Helicopters=2
NumberOfNeutralVessels=3
Taskforce2_NumberOfFormations=6
Taskforce2_Formation1=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3,Taskforce2Vessel4|Abyssal Hounds - Pack One|Circle|1.5|OverrideSpawnPositions
Taskforce2_Formation2=Taskforce2Vessel5,Taskforce2Vessel6,Taskforce2Vessel7,Taskforce2Vessel8|Abyssal Hounds - Pack Two|Circle|1.5|OverrideSpawnPositions
Taskforce2_Formation3=Taskforce2Vessel9,Taskforce2Vessel10,Taskforce2Vessel11,Taskforce2Vessel12|Abyssal Hounds - Pack Three|Circle|1.5|OverrideSpawnPositions
Taskforce2_Formation4=Taskforce2Vessel13,Taskforce2Vessel14,Taskforce2Vessel15|Syndicate Support Group|Circle|1.5|OverrideSpawnPositions
Taskforce2_Formation5=Taskforce2Vessel28,Taskforce2Vessel29,Taskforce2Vessel30,Taskforce2Vessel31,Taskforce2Vessel32|SindicateDecoy|LineAbreast|1.5|OverrideSpawnPositions
Taskforce2_Formation6=Taskforce2Vessel33,Taskforce2Vessel34,Taskforce2Vessel35,Taskforce2Vessel36,Taskforce2Vessel37|SindicateDecoy (Copy)|LineAbreast|1.5|OverrideSpawnPositions

; =====================================================================
; HOSTILE - THE IMPROVISED STRIKE
;
; The only Disabled units in the file. They fly in from off the player's
; plot, so a launch event is honest here - and Trigger6 fires on "a pack
; leader has been detected OR ninety minutes", so it lands relative to
; the fight for any player who has made contact.
;
; They are deliberately NOT carrying the same thing. The Syndicate came
; to SEIZE the Pandora before her title transferred, not to sink her -
; anti-ship missiles were prohibited under the original tasking. The
; title moved an hour early, the plan collapsed, and these two airframes
; launched rigged for a boarding escort now carry whatever could be hung
; on them in the time available:
;
;   Helicopter1  AntiShipPrecision  2 x fr_am-39 Exocet   35 NM
;   Helicopter2  AntiShip           2 x fr_e15 torpedo    6.5 NM
;
; Two anti-ship missiles in the whole mission, and it is a story reason
; rather than a difficulty slider. The second airframe has to run inside
; 6.5 NM of the ship it is trying to kill, in front of the escorts.
;
; They start on the support group and close at 134 kt, so the player has
; minutes of warning and the Harriers have a window. Attack= is
; community-guide only and appears nowhere in Pacific Strike; if it is
; ignored they engage freely on the same approach.

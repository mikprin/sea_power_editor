Action_Taskforce1_VoiceMessage=NewIntelReceived
Action_Units=Taskforce1Vessel3
Action_EnableDisableSensorSystems=Disable
Action_ObjectivesUnHide=KillJammer

; Fires the moment the player's sensors acquire any two decoys, wherever
; that happens. No circle, nothing to steer around.
[Trigger3]
Name=Decoy craft detected - the picture does not add up
Condition_DecoysSeen_Type=UnitDetected
Condition_DecoysSeen_Taskforce=Taskforce2

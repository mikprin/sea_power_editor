; ---------- forecast ----------
StartForecast=ПОГОДНАЯ СВОДКА ПО КОНТРАКТУ - ЦЕНТРАЛЬНАЯ ЧАСТЬ АРАВИЙСКОГО МОРЯ\nДЕЙСТВИТЕЛЬНА: 061400-062200Z АВГ 85\nСплошная облачность, нижняя кромка две тысячи футов, юго-западный муссонный поток. Волнение 4 балла, длинная западная зыбь. В течение периода заход солнца, так что свет уйдёт от плохого до нулевого прямо на переходе. Дальность визуального опознавания после сумерек резко падает. Погода не ограничивает работу РЛС надводной обстановки. Значит, всё, что сегодня не так с вашей радиолокационной картинкой, погодой не объясняется.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - КОНТРАКТ 02</size>\nЯЩИК ПАНДОРЫ\n<size=24>6 августа 1985 - Центральная часть Аравийского моря</size>\nBody=[СИРЕНА]: Командир, мы в нейтральных водах, бумаги закрыты. Передача прав собственности на судно ARAPAHO подтверждена. Meridian Naval Systems подписали час назад, их инженеры сошли на берег в последнем порту и получили расчёт наличными.\n\n[АТЛАС]: Это хорошая новость. Заказчик обанкротился, пока строил её, деньгами расплатиться не смог и отдал долг корпусом. Контейнеровоз с приваренной полётной палубой. Он наш в ту секунду, когда дойдёт до точки передачи. А до тех пор это самая большая, самая медленная и самая дорогая мишень в Аравийском море.\n\nУ неё нет вооружения. Совсем. Ни ствола, ни пусковой. У неё есть палуба и восемь машин, и именно поэтому её хотят утопить.\n\n[E.C.H.O.]: ПРЕДУПРЕЖДЕНИЕ ПО ПАЛУБЕ. ВРЕМЯ ПОДГОТОВКИ МАШИНЫ К ВЫЛЕТУ - МИНИМУМ ОДИН ПЯТЬ МИНУТ. РЕКОМЕНДУЮ ПОДНЯТЬ РАЗВЕДЫВАТЕЛЬНЫЙ ВЕРТОЛЁТ ДО ПЕРВОГО КОНТАКТА, А НЕ ПОСЛЕ. МАШИНА НА ПАЛУБЕ - ЭТО ПАССАЖИР.\n\n[СИРЕНА]: Переход длинный, и безопасного маршрута через него нет. Что бы здесь ни было, оно найдёт нас, куда бы мы ни повернули.\n\n[АТЛАС]: Экономьте боекомплект. Каждый выстрел сегодня вычитается из гонорара, который нам платят металлоломом.\nButtonText=Начать движение\nPopupStyle=Intro

Taskforce1StartIntel=Контракт 02 - Провести MV Pandora через Аравийское море до точки передачи. Судно без вооружения, полный ход двадцать узлов. Поднимайте авиацию заранее, подготовка машины занимает пятнадцать минут.

Taskforce1JammingMessage=Title=ВНИМАНИЕ - ШИРОКОПОЛОСНОЕ ПОДАВЛЕНИЕ\nBody=[E.C.H.O.]: ТРЕВОГА. ШИРОКОПОЛОСНОЕ ПОДАВЛЕНИЕ ВО ВСЕХ ДИАПАЗОНАХ ОБЗОРА НАДВОДНОЙ ОБСТАНОВКИ. ИСТОЧНИК ВЫСОКО И ВОСТОЧНЕЕ, ЗНАЧИТЕЛЬНО ВЫШЕ ОБЛАЧНОСТИ, И ОН ИЗЛУЧАЕТ ЕЩЁ С ТОГО МОМЕНТА, КАК МЫ ВЫШЛИ ИЗ ПОРТА.\n\nНАДВОДНАЯ КАРТИНА ДЕГРАДИРОВАНА ПО ВСЕМУ СЕКТОРУ. ДАННЫЕ ПО ДАЛЬНОСТИ И ПЕЛЕНГУ НЕДОСТОВЕРНЫ. СОСТОЯНИЕ СОХРАНИТСЯ НА ВЕСЬ ПЕРЕХОД.\n\n[АТЛАС]: Нас глушат ещё до того, как мы кого-то встретили. Кто-то стоит наверху с настоящим самолётом РЭБ. Это не пираты. Это бюджет.\n\n[E.C.H.O.]: НАВИГАЦИОННЫЙ И ПОИСКОВЫЙ КОМПЛЕКС ПАНДОРЫ ОТКЛЮЧЁН. ОНА ИДЁТ ВСЛЕПУЮ, ТОЛЬКО ПО НАШЕМУ ПЛАНШЕТУ. УНИЧТОЖЕНИЕ ИСТОЧНИКА ВЕРНУЛО БЫ ЕЙ ЗРЕНИЕ.\nButtonText=Принято\nPopupStyle=Notification

Taskforce1JammingIntel=Самолёт РЭБ излучает с большой высоты восточнее маршрута. Надводная картина деградирована по всему сектору. Собственные датчики MV Pandora отключены. Уничтожение постановщика помех должно вернуть ей зрение.

Taskforce1DecoyMessage=Title=НАДВОДНАЯ КАРТИНА - КОНТАКТЫ НЕ СХОДЯТСЯ\nBody=[E.C.H.O.]: МНОЖЕСТВЕННЫЕ НАДВОДНЫЕ ОТМЕТКИ ВОСТОЧНЕЕ МАРШРУТА. АНАЛИЗ СИГНАТУР ПРОТИВОРЕЧИВ. ОТМЕТКИ НЕ СООТВЕТСТВУЮТ ФИЗИЧЕСКИМ ОБЪЕКТАМ ЗАЯВЛЕННОЙ МАССЫ.\n\nОЦЕНКА - ЧАСТЬ ТОГО, ЧТО МЫ ВИДИМ, ЭТО БЕСПИЛОТНЫЕ КАТЕРА-ЛОЖНЫЕ ЦЕЛИ. РАДИОЛОКАЦИОННАЯ СИГНАТУРА НА ЭТОЙ ДИСТАНЦИИ НЕОТЛИЧИМА ОТ НАСТОЯЩЕГО КОРПУСА.\n\nЕДИНСТВЕННЫЙ ДОСТУПНЫЙ МНЕ ПРИЗНАК - СКОРОСТЬ. ВООРУЖЁННЫЕ КАТЕРА ПОЙДУТ ЧЕТЫРЕ ПЯТЬ УЗЛОВ И ВЫШЕ. ЛОЖНЫЕ ЦЕЛИ - НЕТ.\n\n[АТЛАС]: Поднимите машину и посмотрите на них глазами, командир. Если будем стрелять по призракам, к приходу настоящих будет пусто.\nButtonText=Принято\nPopupStyle=Notification

Taskforce1DecoyIntel=Часть надводной картины оценивается как беспилотные катера-ложные цели без вооружения. Единственный дистанционный признак - скорость: настоящие катера идут сорок пять узлов, ложные цели нет. Рекомендуется визуальное опознавание.

Taskforce1HoundsMessage=Title=КОНТАКТ - ГОНЧИЕ НА НАС\nBody=[ФАРВАТЕР]: В защищённую частоту компании вклинивается незарегистрированный передатчик.\n\nСиндикат хочет пустить этот корабль на дно, командир. Не захватить. Утопить. Они предпочтут, чтобы технология не досталась никому, чем смотреть, как её получит конкурент.\n\nЭто Гончие. Три стаи, три пеленга, и они сходятся на вашем маршруте ещё с того момента, как вы снялись. Курса, который их обходит, нет. И не было.\n\n[E.C.H.O.]: КЛАССИФИКАЦИЯ ПОДТВЕРЖДЕНА. ДВЕНАДЦАТЬ ВООРУЖЁННЫХ БЫСТРОХОДНЫХ КАТЕРОВ, ТРИ ГРУППЫ ПО ЧЕТЫРЕ. ТОРПЕДНОЕ ВООРУЖЕНИЕ. ДАЛЬНОСТЬ ПЯТЬ С ПОЛОВИНОЙ МИЛИ, БЕЗ НАВЕДЕНИЯ. ЧТОБЫ УБИТЬ, ИМ НУЖНО СБЛИЗИТЬСЯ.\n\n[АТЛАС]: Поднимайте авиагруппу с контейнеровоза, немедленно! Прикройте её и дайте им подойти самим. Каждому из этих катеров надо войти внутрь пяти миль, а эти пять миль открытой воды наши.\nButtonText=Оружие свободно\nPopupStyle=Notification

Taskforce1HoundsIntel=Двенадцать быстроходных катеров противника сходятся с трёх пеленгов, вооружены торпедами, прямоидущими, дальность до пяти с половиной миль. Для пуска им нужно сблизиться. Требуется визуальное опознавание, чтобы отделить их от ложных целей.

Taskforce1PlanChangeMessage=Title=ПЕРЕХВАТ - ПЛАН ИЗМЕНИЛСЯ\nBody=[ФАРВАТЕР]: Передаю вам расшифровку. Читайте сейчас, она меняет то, что с вами сейчас произойдёт.\n\nСиндикат отправляли сюда не топить это судно. В боевом распоряжении стоял ЗАХВАТ. Взять на абордаж, увести на верфь, на которую никто не сможет показать пальцем, и пусть кредиторы Meridian спишут технологию как непоставленный актив. Применение противокорабельных ракет тем приказом было прямо запрещено. Нельзя захватить корпус, который вы отправили на дно.\n\nИх машины взлетали в конфигурации сопровождения абордажной группы. Не удара.\n\n[СИРЕНА]: А право собственности перешло на час раньше, чем они рассчитывали. Юристы Meridian поторопились, потому что хотели получить свои деньги до прихода ликвидаторов.\n\n[АТЛАС]: То есть мы опередили их примерно на шестьдесят минут. И всё. Шестьдесят минут.\n\n[ФАРВАТЕР]: Приказ переиздан. Теперь в нём стоит УНИЧТОЖЕНИЕ. Они вешают то, что нашли, на то, что уже в воздухе, и оно идёт к вам.\n\n[E.C.H.O.]: ОЦЕНКА. ЗАПАС ПРОТИВОКОРАБЕЛЬНЫХ РАКЕТ ПРОТИВНИКА В ЭТОМ РАЙОНЕ ИМПРОВИЗИРОВАН И ОГРАНИЧЕН. ОДНА ВИНТОКРЫЛАЯ МАШИНА ОЦЕНИВАЕТСЯ КАК НОСИТЕЛЬ РАКЕТ. ВТОРАЯ НЕСЁТ АВИАЦИОННЫЕ ТОРПЕДЫ И ДОЛЖНА ПОДОЙТИ БЛИЖЕ ШЕСТИ МИЛЬ ДЛЯ СБРОСА.\n\n[АТЛАС]: Значит, нам повезло, командир. Они шли сюда красть её, а убивать её им пришлось придумывать на ходу. Только поэтому мы сейчас не смотрим на полный залп. Не растратьте это везение.\nButtonText=Принято\nPopupStyle=Notification

Taskforce1PlanChangeIntel=Получена расшифровка. Изначальной задачей Синдиката был захват, а не уничтожение, поэтому их авиация взлетала без ударной подвески. Приказ переиздан на уничтожение. Ожидается один вертолёт-носитель ракет и один с авиационными торпедами малой дальности со стороны группы обеспечения.

Taskforce1StrikeMessage=Title=ТРЕВОГА - ВОЗДУШНЫЕ КОНТАКТЫ НА СБЛИЖЕНИИ\nBody=[E.C.H.O.]: ТРЕВОГА. ДВА ВОЗДУШНЫХ КОНТАКТА, МАЛАЯ ВЫСОТА, СБЛИЖЕНИЕ СО СТОРОНЫ ГРУППЫ ОБЕСПЕЧЕНИЯ. ВЕДУЩАЯ МАШИНА СООТВЕТСТВУЕТ ПРОФИЛЮ НОСИТЕЛЯ РАКЕТ.\n\nОЖИДАЕТСЯ ПУСК НА ПРЕДЕЛЬНО МАЛОЙ ВЫСОТЕ ПО СУДНУ ПАНДОРА. ЕСЛИ ОНИ ДОЙДУТ ДО РУБЕЖА ПУСКА, ВЕРОЯТНОСТЬ ПОРАЖЕНИЯ КРИТИЧЕСКАЯ.\n\nВЕДОМАЯ МАШИНА РАКЕТ НЕ НЕСЁТ. ОНА НАМЕРЕНА ВОЙТИ В ЗОНУ ПРИМЕНЕНИЯ ТОРПЕД.\n\n[АТЛАС]: Зенитные батареи к бою! Ставьте дымы, отстреливайте диполи, все стволы на этот пеленг! Убейте их до пуска, командир, в этом весь фокус!\n\n[СИРЕНА]: Две ракеты, командир. Две. Если бы они шли сюда её топить, сейчас в воздухе была бы дюжина.\nButtonText=В бой\nPopupStyle=Notification

Taskforce1StrikeIntel=Два вертолёта на сближении со стороны группы обеспечения. Один несёт противокорабельные ракеты на предельно малой высоте, второй авиационные торпеды, которые надо сбрасывать ближе шести миль.

Taskforce1JammerDownMessage=Title=ПОСТАНОВЩИК ПОМЕХ УНИЧТОЖЕН\nBody=[E.C.H.O.]: ПОДАВЛЕНИЕ ПРЕКРАЩЕНО. ЭЛЕКТРОМАГНИТНЫЙ ФОН ВОЗВРАЩАЕТСЯ К НОРМЕ. НАДВОДНАЯ КАРТИНА ПРОЯСНЯЕТСЯ.\n\nНАВИГАЦИОННЫЙ И ПОИСКОВЫЙ КОМПЛЕКС ПАНДОРЫ ВОССТАНОВЛЕН. ОНА СНОВА ВИДИТ САМА.\n\n[АТЛАС]: Хорошая работа. Эта машина стоила больше, чем вся наша компания. У кого-то в кабинете будет очень тяжёлое утро.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1HoundsClearMessage=Title=СТАИ УНИЧТОЖЕНЫ\nBody=[E.C.H.O.]: ВСЕ ДВЕНАДЦАТЬ ВООРУЖЁННЫХ КАТЕРОВ УНИЧТОЖЕНЫ. ОСТАВШИЕСЯ НАДВОДНЫЕ ОТМЕТКИ - БЕСПИЛОТНЫЕ КАТЕРА-МИШЕНИ. ВООРУЖЕНИЯ НЕТ. ЭКИПАЖА НЕТ. ОНИ И НЕ ДОЛЖНЫ БЫЛИ ДО НАС ДОЙТИ.\n\n[СИРЕНА]: Они потратили состояние на фанеру и уголковые отражатели только ради того, чтобы вы сожгли боекомплект. Пираты так не думают.\n\n[АТЛАС]: Так думает бухгалтер. Кто-то это посчитал.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1CerberusMessage=Title=КОРАБЛЬ УПРАВЛЕНИЯ УНИЧТОЖЕН\nBody=[СИРЕНА]: Их корабль управления погиб. Тот, кто вёл стаи с этого борта, сейчас в воде, а остальная группа расходится.\n\n[АТЛАС]: В контракте этого не было, командир, и я не жалуюсь. Всё, за что нам не пришлось платить, - это прибыль.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1PandoraLostMessage=Title=<size=40><color=Red>КОНТРАКТ ПРОВАЛЕН</color></size>\nBody=MV ПАНДОРА погибла.\n\n[АТЛАС]: Заказчик расплатился с нами корпусом, командир, и корпус лежит на дне Аравийского моря. Выставлять счёт не за что и некому.\n\n[E.C.H.O.]: ЦЕЛЬЮ СИНДИКАТА БЫЛО НЕДОПУЩЕНИЕ, А НЕ ЗАХВАТ. ОНИ ЕЁ ДОСТИГЛИ. МЫ ПОМОГЛИ.\nButtonText=Выйти из миссии\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=<size=40><color=Red>МИССИЯ ПРОВАЛЕНА</color></size>\nBody=У Phantom Wake не осталось кораблей на плаву.\n\nКомпании конец, а контейнеровоз - чей-то чужой трофей.\nButtonText=Выйти из миссии\nPopupStyle=Outro

Taskforce1VictoryMessage=Title=<size=40><color=Lime>КОНТРАКТ ВЫПОЛНЕН</color></size>\nBody=[E.C.H.O.]: ПАНДОРА ДОСТИГЛА ТОЧКИ ПЕРЕДАЧИ. КОНТАКТЫ ОТХОДЯТ. УГРОЗА ЛИКВИДИРОВАНА.\n\n[СИРЕНА]: Синдикат отступает. Кажется, они решили, что убить нас дороже, чем мы стоим.\n\n[АТЛАС]: Мы сожгли сегодня кучу денег на боеприпасах, командир. Но этот контейнеровоз теперь наш. Мы его залатаем, перекрасим, напишем на корме новое имя и оформим как обычный сухогруз под панамским флагом.\n\nИ у нас будет лучшая скрытая авиабаза на всём Индийском океане, на которую никто не посмотрит дважды. Курс на базу.\n\n[E.C.H.O.]: MV ПАНДОРА ВНЕСЕНА В РЕЕСТР КОМПАНИИ. БЕЗ ВООРУЖЕНИЯ. НИЧЕМ НЕ ПРИМЕЧАТЕЛЬНА. НАША.\nButtonText=Выйти из миссии\nPopupStyle=Outro


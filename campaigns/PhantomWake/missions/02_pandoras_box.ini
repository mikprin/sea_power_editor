; =====================================================================
; ENVIRONMENT
; Map centre unchanged from the editor backbone: 19.92 N, 67.88 E,
; open water in the central Arabian Sea. No land anywhere in the
; playfield, so unlike 01C there is no coastline to sample against.
;
;   X = (lon - 67.88) * 60      Z = (lat - 19.92) * 60
;
; Date 6 Aug 1985. Contract order so far: 01 is 26 Jun, 01A 2 Jul,
; 01B 9 Jul, 01C 16 Jul, so Stage 2 opens three weeks later.
;
; Time moved 21:00 -> 19:00 and SeaState 7 -> 4, both deliberate:
;   - 19:00 is the script's "late evening, slightly reduced visibility".
;     21:00 here is full dark, and the whole Phase 2 mechanic is visual
;     identification from aircraft. Dusk degrades VID range without
;     removing it, which is exactly the tension the script asks for.
;   - Sea State 7 is a near gale. It would have crippled the 35 tonne
;     Libelles that are supposed to be the threat, and grounded the
;     player's own helicopters. 4 keeps the swell in the script without
;     deleting both sides' toys.
; =====================================================================
[Environment]
Date=1985,8,6
Time=19,0
ConvertTimeToLocal=False
SeaState=4
Clouds=Overcast
WindDirection=SW
MapCenterLatitude=19.92
MapCenterLongitude=67.88
LoadBackgroundData=False

[Mission]
Difficulty=0
PlayerTaskforce=Taskforce1
EnemyTaskforce=Taskforce2
NumberOfTaskforce1Vessels=3
NumberOfTaskforce2Vessels=31
NumberOfTaskforce2Aircraft=1
NumberOfTaskforce2Helicopters=2
NumberOfNeutralVessels=3
Taskforce2_NumberOfFormations=4
Taskforce2_Formation1=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3,Taskforce2Vessel4|Hound Pack Alpha|Loose|1|OverrideSpawnPositions
Taskforce2_Formation2=Taskforce2Vessel5,Taskforce2Vessel6,Taskforce2Vessel7,Taskforce2Vessel8|Hound Pack Bravo|Loose|1|OverrideSpawnPositions
Taskforce2_Formation3=Taskforce2Vessel9,Taskforce2Vessel10,Taskforce2Vessel11,Taskforce2Vessel12|Hound Pack Charlie|Loose|1|OverrideSpawnPositions
Taskforce2_Formation4=Taskforce2Vessel13,Taskforce2Vessel14,Taskforce2Vessel15|Syndicate Support Group|Loose|1.5|OverrideSpawnPositions
NumberOfTriggers=13

; =====================================================================
; CONVOY AXIS
; Bearing 113 from the Pandora's start at (-4.58, -45.14), which is the
; heading and position the editor backbone already had. Unit vector
; (0.9205, -0.3907). Distance d in NM along the lane:
;
;   d=0    (-4.58, -45.14)   MV Pandora start
;   d=10   ( 4.63, -49.05)   Gate A  - jamming, decoy swarm spawns
;   d=20   (13.83, -52.95)   Gate B  - the Hounds are released
;   d=30   (23.04, -56.86)   Gate C  - Exocet strike
;   d=36   (28.56, -59.20)   NAVPOINT KEYSTONE, r=6  - victory
;
; 36 NM authored, 30 NM effective because the Keystone circle catches
; her early. The Pandora tops out at 20 kt, so about 90 minutes of
; transit - in line with 01C. No time limit, same as 01 and 01C.
;
; The backbone's original delivery circle sat at (101.8, -95.0), which
; is 117 NM out. At 20 kt that is a four hour mission with three
; scripted events in it. The axis and bearing are unchanged; only the
; length was cut.
; =====================================================================

; =====================================================================
; PLAYER
;
; SECTION LAYOUT IS THE VANILLA "09 Shadows off Palawan" SHAPE:
;   Vessel1  TaskForceModeAnchor=True          - generator seed
;   Vessel2  TaskForceModePlaceholderUnit=True - removed at launch
;   Vessel3+ TaskForceModeIgnoreUnit=True      - author placed, kept
; That mission is Generated, has a player force of unknown size, and
; still carries four hand placed amphibs at Vessel3..Vessel6. So an
; ignored unit at Vessel3 survives generation, and its section name is
; safe to point triggers at.
;
; Only Taskforce1Vessel1 and Taskforce1Vessel3 are referenced by any
; trigger, so the player may bring as many hulls as they can afford.
; =====================================================================

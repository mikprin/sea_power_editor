; =====================================================================
; HOSTILE - THE ABYSSAL HOUNDS
;
; wp_pt_libelle, Project 131 fast attack craft. tools-units.py arsenal
; only reports the 23mm ZU-23 because the tool lists mounts by magazine,
; but the raw unit file has three weapon systems:
;   WeaponSystem1  OTA-53_533mm torpedo tube, Ammunition=wp_53-38
;   WeaponSystem2  OTA-53_533mm torpedo tube, Ammunition=wp_53-38
;   WeaponSystem3  23mm ZU-23, 2400 rounds
; So the script's "torpedoes and machine guns" is exactly right, and
; the tubes cannot be magazine overridden because they carry their round
; directly rather than through an AssociatedMagazine.
;
; wp_53-38: 5.5 NM, 34 kt, guidance NONE. Straight runners. The pack has
; to close inside a few miles to have any chance, which is what makes
; this a knife fight in the dark rather than a standoff. Hull is 35 t
; and 48 kt flat out - fast, fragile and blind past a few miles.
;
; Three packs of four, spawned at Gate B from three separate bearings.
; Only the pack leader carries waypoints; the Loose formation with
; OverrideSpawnPositions brings the other three along. Same pattern as
; the interceptor pair and coastal squadron in 01C.
;
; Attack= makes them prioritise the Pandora over the player's escorts.
; UNVERIFIED - the field appears nowhere in Pacific Strike, it is
; community guide only. If it is ignored the packs still run authored
; routes straight through the convoy lane with weapons free, so the
; phase degrades to an ordinary intercept rather than breaking.
; =====================================================================


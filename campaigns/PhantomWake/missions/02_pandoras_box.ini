; =====================================================================
; TRIGGERS
;
; Twelve of the thirteen are UnitDetected, UnitDestroyed,
; HasNoUnitsOfType or a plain clock. Exactly one has a position:
; Trigger12, the win condition, which is where the player is going.
;
; docs-CLAUDE.md section 5: Action_Units is per TRIGGER, not per action.
; Trigger5 and Trigger6 share one condition set and exist as two
; triggers only because Trigger6 needs Action_Units for the spawn list.
; =====================================================================

[Trigger1]

; The script's third objective is "do not lose a single escort", but
; the player's ships past the anchor are generated and this file cannot
; know their section names. Taskforce1Vessel1 is the one hull that is
; guaranteed to exist after generation, so the objective is scoped to
; the flagship. Honest and always evaluable, rather than an objective
; that silently never fires.
[Trigger12]
Name=Flagship lost - escort objective failed
Condition_FlagshipDead_Type=UnitDestroyed
Condition_FlagshipDead_Units=Taskforce1Vessel1
ConditionsCompleted=<FlagshipDead>
Action_Taskforce1_Message=Taskforce1FlagshipLostMessage
Action_Taskforce1_VoiceMessage=ObjectiveFailed
Action_ObjectivesFailed=EscortIntact

; FAIRWAY's decrypt, d=22 with a 3 NM radius so it fires at d=19 - after
; Gate B has already put the Hounds in the water at d=15, and before
; Gate C launches the helicopters at d=25. Roughly ten minutes of warning
; at the Pandora's twenty knots.
;
; This is the beat that explains why there are only two anti-ship
; missiles in the entire mission. The Syndicate's tasking was seizure,
; the title transferred an hour early, and the strike is improvised off
; airframes that launched rigged for a boarding escort. It is also
; straight tactical intel: it tells the player one helicopter shoots
; from 35 NM and the other has to come inside 6.
;
; AreaDisplaySide=None - no circle is drawn for this one. The player is
; not navigating to it, they are simply passing through it, and a third
; blue circle on the lane would clutter the plot.
[Trigger13]
Name=Intercepted traffic - seizure order reissued as denial
Condition_Decrypt_Type=UnitsInTheArea
Condition_Decrypt_PositionNM=15.67,0,-53.74
Condition_Decrypt_AreaRadiusNM=3
Condition_Decrypt_AreaDisplaySide=None
Condition_Decrypt_Units=Taskforce1Vessel3
ConditionsCompleted=<Decrypt>
Action_Taskforce1_Message=Taskforce1PlanChangeMessage
Action_Taskforce1_Intel=Taskforce1PlanChangeIntel
Action_Taskforce1_VoiceMessage=NewIntelReceived
Action_VariableSet=02SeizureOrderIntercepted,True

[Taskforce1_Objectives]
EscortPandora=60,-60,Complete,Main
DestroyHounds=25,-25,Complete,Hidden
EscortIntact=15,-15,Complete
KillJammer=10,0,,Hidden
KillFOB=15,0,,Hidden

[CampaignVariables]
02PandoraDelivered=False

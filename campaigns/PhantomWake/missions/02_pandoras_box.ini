; ---------- forecast ----------
StartForecast=ПОГОДНАЯ СВОДКА ПО КОНТРАКТУ - ЦЕНТРАЛЬНАЯ ЧАСТЬ АРАВИЙСКОГО МОРЯ\nДЕЙСТВИТЕЛЬНА: 061400-062200Z АВГ 85\nСплошная облачность, нижняя кромка две тысячи футов, юго-западный муссонный поток. Волнение 4 балла, длинная западная зыбь. В течение периода заход солнца, так что свет уйдёт от плохого до нулевого, пока вы ещё будете в коридоре. Дальность визуального опознавания после сумерек резко падает. Погода не ограничивает работу РЛС надводной обстановки. Значит, всё, что сегодня не так с вашей радиолокационной картинкой, погодой не объясняется.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - КОНТРАКТ 02</size>\nЯЩИК ПАНДОРЫ\n<size=24>6 августа 1985 - Центральная часть Аравийского моря</size>\nBody=[СИРЕНА]: Командир, мы в нейтральных водах, бумаги закрыты. Передача прав собственности на судно ARAPAHO подтверждена. Meridian Naval Systems подписали час назад, их инженеры сошли на берег в последнем порту и получили расчёт наличными.\n\n[АТЛАС]: Это хорошая новость. Заказчик обанкротился, пока строил её, деньгами расплатиться не смог и отдал долг корпусом. Контейнеровоз с приваренной полётной палубой. Он наш в ту секунду, когда дойдёт до NavPoint Keystone. А до тех пор это самая большая, самая медленная и самая дорогая мишень в Аравийском море.\n\nУ неё нет вооружения. Совсем. Ни ствола, ни пусковой. У неё есть палуба и восемь машин, и именно поэтому её хотят утопить.\n\n[E.C.H.O.]: ПРЕДУПРЕЖДЕНИЕ ПО ПАЛУБЕ. ВРЕМЯ ПОДГОТОВКИ МАШИНЫ К ВЫЛЕТУ - МИНИМУМ ОДИН ПЯТЬ МИНУТ. РЕКОМЕНДУЮ ПОДНЯТЬ РАЗВЕДЫВАТЕЛЬНЫЙ ВЕРТОЛЁТ ДО ПЕРВОГО КОНТАКТА, А НЕ ПОСЛЕ. МАШИНА НА ПАЛУБЕ - ЭТО ПАССАЖИР.\n\n[АТЛАС]: Экономьте боекомплект. Каждый выстрел сегодня вычитается из гонорара, который нам платят металлоломом.\nButtonText=Начать движение\nPopupStyle=Intro

Taskforce1StartIntel=Контракт 02 - Провести MV Pandora на восток по транзитному коридору до NavPoint Keystone. Судно без вооружения. Поднимайте авиацию заранее, подготовка машины занимает пятнадцать минут.

Taskforce1JammingMessage=Title=ВНИМАНИЕ - МАССИРОВАННОЕ ПОДАВЛЕНИЕ РЛС\nBody=[E.C.H.O.]: ТРЕВОГА. ШИРОКОПОЛОСНОЕ ПОДАВЛЕНИЕ ВО ВСЕХ ДИАПАЗОНАХ ОБЗОРА НАДВОДНОЙ ОБСТАНОВКИ. НАБЛЮДАЮ ДВА ЧЕТЫРЕ... ТРИ ШЕСТЬ... ЧЕТЫРЕ ДВА НЕОПОЗНАННЫХ КОНТАКТА.\n\nАНАЛИЗ СИГНАТУР ПРОТИВОРЕЧИВ. ОТМЕТКИ НЕ СООТВЕТСТВУЮТ ФИЗИЧЕСКИМ ОБЪЕКТАМ. ДАННЫЕ ПО ДАЛЬНОСТИ И ПЕЛЕНГУ НЕДОСТОВЕРНЫ. НА ЭТОЙ ДИСТАНЦИИ Я НЕ МОГУ ОТДЕЛИТЬ КОРПУСА ОТ АРТЕФАКТОВ.\n\n[АТЛАС]: Нас глушат! Эскадра слепнет. Откуда они вообще берутся?\n\n[СИРЕНА]: Сверху и с востока, на краю планшета. Кто-то стоит над облаками с настоящим самолётом РЭБ. Это не пираты. Это бюджет.\n\n[E.C.H.O.]: НАВИГАЦИОННЫЙ И ПОИСКОВЫЙ КОМПЛЕКС ПАНДОРЫ ОТКЛЮЧЁН. ОНА ИДЁТ ВСЛЕПУЮ, ТОЛЬКО ПО НАШЕМУ ПЛАНШЕТУ.\nButtonText=Принято\nPopupStyle=Notification

Taskforce1JammingIntel=Самолёт РЭБ работает на большой высоте восточнее коридора. Надводная картина забита ложными отметками. Собственные датчики MV Pandora отключены. Уничтожение постановщика помех должно вернуть ей зрение.

Taskforce1HoundsMessage=Title=КОНТАКТ - СВОРУ СПУСТИЛИ С ЦЕПИ\nBody=[ФАРВАТЕР]: В защищённую частоту компании вклинивается незарегистрированный передатчик.\n\nСиндикат хочет пустить этот корабль на дно, командир. Не захватить. Утопить. Они предпочтут, чтобы технология не досталась никому, чем смотреть, как её получит конкурент.\n\nЭто Гончие. Они охотятся стаей, заходят из слепого сектора, и половина того, что вы видите, вообще не существует. Не доверяйте сегодня радарам. Используйте глаза в небе.\n\n[АТЛАС]: Поднимайте авиагруппу с контейнеровоза, немедленно! Нам нужен кто-то, кто посмотрит на эти отметки глазами. Если мы будем стрелять по фантомам, к приходу настоящих катеров у нас будет пусто, а эти катера несут торпеды.\n\n[E.C.H.O.]: ПРИМЕЧАНИЕ ПО КЛАССИФИКАЦИИ. РЕАЛЬНЫЕ КАТЕРА ИДУТ ЧЕТЫРЕ ПЯТЬ УЗЛОВ И ВЫШЕ. АРТЕФАКТЫ - НЕТ. СКОРОСТЬ - ЕДИНСТВЕННЫЙ ПРИЗНАК, КОТОРЫЙ Я МОГУ ПРЕДЛОЖИТЬ, ПОКА КТО-НИБУДЬ НЕ ПОДОЙДЁТ ДОСТАТОЧНО БЛИЗКО, ЧТОБЫ ПОСМОТРЕТЬ.\nButtonText=Поднять авиагруппу\nPopupStyle=Notification

Taskforce1HoundsIntel=Двенадцать быстроходных катеров противника с трёх векторов, вооружены торпедами, прямоидущими, дальность до пяти миль. Остальные контакты оцениваются как беспилотные катера-ложные цели. Требуется визуальное опознавание.

Taskforce1PlanChangeMessage=Title=ПЕРЕХВАТ - ПЛАН ИЗМЕНИЛСЯ\nBody=[ФАРВАТЕР]: Передаю вам расшифровку. Читайте сейчас, она меняет то, что с вами сейчас произойдёт.\n\nСиндикат отправляли сюда не топить это судно. В боевом распоряжении стоял ЗАХВАТ. Взять на абордаж, увести на верфь, на которую никто не сможет показать пальцем, и пусть кредиторы Meridian спишут технологию как непоставленный актив. Применение противокорабельных ракет тем приказом было прямо запрещено. Нельзя захватить корпус, который вы отправили на дно.\n\nИх машины взлетали в конфигурации сопровождения абордажной группы. Не удара.\n\n[СИРЕНА]: А право собственности перешло на час раньше, чем они рассчитывали. Юристы Meridian поторопились, потому что хотели получить свои деньги до прихода ликвидаторов.\n\n[АТЛАС]: То есть мы опередили их примерно на шестьдесят минут. И всё. Шестьдесят минут.\n\n[ФАРВАТЕР]: Приказ переиздан. Теперь в нём стоит УНИЧТОЖЕНИЕ. Они вешают то, что нашли, на то, что уже в воздухе.\n\n[E.C.H.O.]: ОЦЕНКА. ЗАПАС ПРОТИВОКОРАБЕЛЬНЫХ РАКЕТ ПРОТИВНИКА В ЭТОМ РАЙОНЕ ИМПРОВИЗИРОВАН И ОГРАНИЧЕН. ОДНА ВИНТОКРЫЛАЯ МАШИНА ОЦЕНИВАЕТСЯ КАК НОСИТЕЛЬ РАКЕТ. ВТОРАЯ НЕСЁТ АВИАЦИОННЫЕ ТОРПЕДЫ И ДОЛЖНА ПОДОЙТИ БЛИЖЕ ШЕСТИ МИЛЬ ДЛЯ СБРОСА.\n\n[АТЛАС]: Значит, нам повезло, командир. Они шли сюда красть её, а убивать её им пришлось придумывать на ходу. Только поэтому мы сейчас не смотрим на полный залп. Не растратьте это везение.\nButtonText=Принято\nPopupStyle=Notification

Taskforce1PlanChangeIntel=Получена расшифровка. Изначальной задачей Синдиката был захват, а не уничтожение, поэтому их авиация взлетала без ударной подвески. Приказ переиздан на уничтожение. Ожидается один вертолёт-носитель ракет и один с авиационными торпедами малой дальности.

Taskforce1StrikeMessage=Title=ТРЕВОГА - ПУСК ПРОТИВОКОРАБЕЛЬНЫХ РАКЕТ\nBody=[E.C.H.O.]: ТРЕВОГА. ДВА ВОЗДУШНЫХ КОНТАКТА НА ВОСТОКЕ, МАЛАЯ ВЫСОТА, СБЛИЖЕНИЕ. ВЕДУЩАЯ МАШИНА СООТВЕТСТВУЕТ ПРОФИЛЮ НОСИТЕЛЯ РАКЕТ.\n\nОБНАРУЖЕН ЗАПУСК. ВЕКТОР НА ПРЕДЕЛЬНО МАЛОЙ ВЫСОТЕ. ЦЕЛЬ - СУДНО ПАНДОРА. ВЕРОЯТНОСТЬ ПОРАЖЕНИЯ - КРИТИЧЕСКАЯ.\n\nВЕДОМАЯ МАШИНА ПУСК НЕ ПРОИЗВОДИТ. ОНА ПРОДОЛЖАЕТ СБЛИЖЕНИЕ. НАМЕРЕНА ВОЙТИ В ЗОНУ ПРИМЕНЕНИЯ ТОРПЕД.\n\n[АТЛАС]: Зенитные батареи к бою! Ставьте дымы, отстреливайте диполи, все стволы на этот пеленг! Защищайте контейнеровоз любой ценой, командир, она не переживёт попадания, а мы не переживём такой потери!\n\n[СИРЕНА]: Две ракеты, командир. Две. Если бы они шли сюда её топить, сейчас в воздухе была бы дюжина.\nButtonText=В бой\nPopupStyle=Notification

Taskforce1StrikeIntel=Один вертолёт-носитель ракет атакует с востока противокорабельными ракетами на предельно малой высоте. Второй сближается для сброса авиационных торпед ближе шести миль. Их группа обеспечения держится на удалении к юго-востоку.

Taskforce1JammerDownMessage=Title=ПОСТАНОВЩИК ПОМЕХ УНИЧТОЖЕН\nBody=[E.C.H.O.]: ПОДАВЛЕНИЕ ПРЕКРАЩЕНО. ЭЛЕКТРОМАГНИТНЫЙ ФОН ВОЗВРАЩАЕТСЯ К НОРМЕ. ЛОЖНЫЕ ОТМЕТКИ ИСЧЕЗАЮТ С ПЛАНШЕТА.\n\nНАВИГАЦИОННЫЙ И ПОИСКОВЫЙ КОМПЛЕКС ПАНДОРЫ ВОССТАНОВЛЕН. ОНА СНОВА ВИДИТ САМА.\n\n[АТЛАС]: Хорошая работа. Эта машина стоила больше, чем вся наша компания. У кого-то в кабинете будет очень тяжёлое утро.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1HoundsClearMessage=Title=СТАЯ УНИЧТОЖЕНА\nBody=[E.C.H.O.]: ВСЕ ДВЕНАДЦАТЬ ВООРУЖЁННЫХ КАТЕРОВ УНИЧТОЖЕНЫ. ОСТАВШИЕСЯ НАДВОДНЫЕ ОТМЕТКИ - БЕСПИЛОТНЫЕ КАТЕРА-МИШЕНИ. ВООРУЖЕНИЯ НЕТ. ЭКИПАЖА НЕТ. ОНИ И НЕ ДОЛЖНЫ БЫЛИ ДО НАС ДОЙТИ.\n\n[СИРЕНА]: Они потратили состояние на фанеру и уголковые отражатели только ради того, чтобы вы сожгли боекомплект. Пираты так не думают.\n\n[АТЛАС]: Так думает бухгалтер. Кто-то это посчитал.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1CerberusMessage=Title=ГРУППА ОБЕСПЕЧЕНИЯ УНИЧТОЖЕНА\nBody=[СИРЕНА]: Их корабль управления погиб. Тот, кто вёл стаю с этого борта, сейчас в воде, а остальная группа расходится.\n\n[АТЛАС]: В контракте этого не было, командир, и я не жалуюсь. Всё, за что нам не пришлось платить, - это прибыль.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1PandoraLostMessage=Title=<size=40><color=Red>КОНТРАКТ ПРОВАЛЕН</color></size>\nBody=MV ПАНДОРА погибла.\n\n[АТЛАС]: Заказчик расплатился с нами корпусом, командир, и корпус лежит на дне Аравийского моря. Выставлять счёт не за что и некому.\n\n[E.C.H.O.]: ЦЕЛЬЮ СИНДИКАТА БЫЛО НЕДОПУЩЕНИЕ, А НЕ ЗАХВАТ. ОНИ ЕЁ ДОСТИГЛИ. МЫ ПОМОГЛИ.\nButtonText=Выйти из миссии\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=<size=40><color=Red>МИССИЯ ПРОВАЛЕНА</color></size>\nBody=У Phantom Wake не осталось кораблей на плаву.\n\nКомпании конец, а контейнеровоз - чей-то чужой трофей.\nButtonText=Выйти из миссии\nPopupStyle=Outro

Taskforce1FlagshipLostMessage=Title=ПОТЕРЯ В ОХРАНЕНИИ\nBody=[АТЛАС]: Мы только что потеряли корпус, командир.\n\nМы не флот. У нас нет замены, стоящей у причала и ждущей нас. Это строка в книге, которая не возвращается.\n\nДоводите контракт. Скорбеть будем в своё время.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1VictoryMessage=Title=<size=40><color=Lime>КОНТРАКТ ВЫПОЛНЕН</color></size>\nBody=[E.C.H.O.]: ПАНДОРА ПРОШЛА NAVPOINT KEYSTONE. КОНТАКТЫ ПОТЕРЯНЫ. ЭЛЕКТРОМАГНИТНЫЙ ФОН В НОРМЕ. УГРОЗА ЛИКВИДИРОВАНА.\n\n[СИРЕНА]: Синдикат отступает. Кажется, они решили, что убить нас дороже, чем мы стоим.\n\n[АТЛАС]: Мы сожгли сегодня кучу денег на боеприпасах, командир. Но этот контейнеровоз теперь наш. Мы его залатаем, перекрасим, напишем на корме новое имя и оформим как обычный сухогруз под панамским флагом.\n\nИ у нас будет лучшая скрытая авиабаза на всём Индийском океане, на которую никто не посмотрит дважды. Курс на базу.\n\n[E.C.H.O.]: MV ПАНДОРА ВНЕСЕНА В РЕЕСТР КОМПАНИИ. БЕЗ ВООРУЖЕНИЯ. НИЧЕМ НЕ ПРИМЕЧАТЕЛЬНА. НАША.\nButtonText=Выйти из миссии\nPopupStyle=Outro


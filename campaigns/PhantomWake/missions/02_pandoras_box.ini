Action_Victory=Taskforce2
Action_ObjectivesFailed=EscortPandora
Action_ObjectivesCancel=DestroyHounds,EscortIntact,KillJammer,KillFOB
Action_VariableSet=02PandoraLost,True

; The win. The only positional condition in the file, and the only thing
; drawn on the player's tactical map - because it is where they are
; going.
;
; Centre moved onto the Pandora's OWN SECOND WAYPOINT, NM (67.35,
; -77.37), keeping the hand-placed r=40. The original marker sat at
; (101.76, -94.97), which put the circle edge 77.5 NM down the route -
; nearly four hours at her twenty knots, of which the last two were
; empty ocean with the fight long over.
;
; From the second waypoint the edge falls at 38.8 NM:
;   leg 1 is 28.3 NM, then 10.5 NM down leg 2 before the circle bites.
;   1 h 56 m at 20 kt. First contact is around the one hour mark, so
;   roughly an hour of approach and an hour of fighting.
; Steering direct instead of via the waypoint is also 38.8 NM, so there
; is no corner to cut.
;
; The crossing point works out at NM (31.0, -60.6), which is 27 to 39 NM
; from every hostile start position - the packs have closed long before
; the player gets there.
[Trigger12]
Name=Pandora reaches the handover point - contract fulfilled
Condition_Handover_Type=UnitsInTheArea
Condition_Handover_PositionNM=65.61797,0,-76.09645
Condition_Handover_AreaRadiusNM=22
Condition_Handover_AreaDisplaySide=Blue
Condition_Handover_Units=Taskforce1Vessel3
ConditionsCompleted=<Handover>
Action_Taskforce1_Message=Taskforce1VictoryMessage
Action_Taskforce1_VoiceMessage=MissionComplete
Action_EndMission=True
Action_Victory=Taskforce1
Action_ObjectivesCompleted=EscortPandora,EscortIntact
Action_VariableSet=02PandoraDelivered,True

[Trigger13]
Name=Task force wiped out - defeat
Condition_NoHulls_Type=HasNoUnitsOfType
Condition_NoHulls_Taskforce=Taskforce1
Condition_NoHulls_UnitType=Vessel
ConditionsCompleted=<NoHulls>
Action_Taskforce1_Message=Taskforce1TaskForceLostMessage
Action_Taskforce1_VoiceMessage=MissionFail
Action_EndMission=True
Action_Victory=Taskforce2
Action_ObjectivesFailed=EscortPandora,EscortIntact
Action_ObjectivesCancel=DestroyHounds,KillJammer,KillFOB

[Taskforce1_Objectives]
EscortPandora=60,-60,Complete,Main
DestroyHounds=25,-25,Complete,Hidden
EscortIntact=15,-15,Complete
KillJammer=10,0,,Hidden
KillFOB=15,0,,Hidden


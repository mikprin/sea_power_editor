; ---------- forecast ----------
StartForecast=CONTRACT WEATHER SUMMARY - CENTRAL ARABIAN SEA\nVALID: 061400-062200Z AUG 85\nOvercast, base two thousand feet, southwesterly monsoon flow. Sea State 4 with a long westerly swell. Sunset falls during the period, so the light goes from poor to none while you are still on passage. Visual identification range drops off badly after dusk. Surface search is unrestricted by weather, which means anything wrong with your radar picture tonight is not the weather.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - CONTRACT 02</size>\nPANDORAS BOX\n<size=24>6 August 1985 - Central Arabian Sea</size>\nBody=[SIREN]: Commander, we are in neutral water and the paperwork is done. Title to the vessel ARAPAHO has transferred. Meridian Naval Systems signed her over an hour ago and their engineers walked off in the last port with their severance in cash.\n\n[ATLAS]: Which is the good news. The client went bankrupt building her and could not pay the fee, so they paid us in hull. She is a container ship with a flight deck welded on, and she is ours the moment she reaches the handover point. Until then she is the largest, slowest, most expensive target in the Arabian Sea.\n\nShe has no weapons. None. Not a gun, not a launcher. What she has is a deck and eight airframes, and that is the whole reason anyone wants her dead.\n\n[E.C.H.O.]: DECK READINESS ADVISORY. AIRFRAME SPIN UP TIME ONE FIVE MINUTES MINIMUM. RECOMMEND LAUNCHING RECONNAISSANCE ROTARY WING BEFORE THE FIRST CONTACT, NOT AFTER. AN AIRCRAFT ON THE DECK IS A PASSENGER.\n\n[SIREN]: It is a long passage and there is no safe route across it. Whatever is out here will find us wherever we steer.\n\n[ATLAS]: Conserve ordnance. Every round we fire tonight comes out of a fee we are being paid in scrap metal.\nButtonText=Get underway\nPopupStyle=Intro

Taskforce1StartIntel=Contract 02 - Escort MV Pandora across the Arabian Sea to the handover point. She is unarmed and makes twenty knots flat out. Launch aircraft early, airframe ready up time is fifteen minutes.

Taskforce1JammingMessage=Title=WARNING - BROADBAND EW INTERFERENCE\nBody=[E.C.H.O.]: ALERT. BROADBAND SUPPRESSION ACROSS ALL SURFACE SEARCH BANDS. THE SOURCE IS HIGH AND TO THE EAST, WELL ABOVE THE OVERCAST, AND IT HAS BEEN RADIATING SINCE BEFORE WE CLEARED THE PORT.\n\nSURFACE PICTURE DEGRADED ACROSS THE ENTIRE SECTOR. RANGE AND BEARING DATA UNRELIABLE. THIS CONDITION WILL PERSIST FOR THE DURATION OF THE PASSAGE.\n\n[ATLAS]: We are being jammed before we have even met anybody. Somebody is standing off up there with a real electronic warfare aircraft. That is not a pirate. That is a budget.\n\n[E.C.H.O.]: PANDORA NAVIGATION AND SURFACE SEARCH SUITE OFFLINE. SHE IS RUNNING BLIND ON OUR PLOT ALONE. DESTROYING THE SOURCE WOULD RESTORE HER.\nButtonText=Understood\nPopupStyle=Notification

Taskforce1JammingIntel=Standoff jammer radiating from high altitude east of the track. Surface picture degraded sector wide. MV Pandora's own sensors are down. Killing the jammer should restore her suite.

Taskforce1DecoyMessage=Title=SURFACE PICTURE - CONTACTS DO NOT ADD UP\nBody=[E.C.H.O.]: MULTIPLE SURFACE RETURNS EAST OF TRACK. SIGNATURE ANALYSIS INCONSISTENT. RETURNS DO NOT CORRESPOND TO PHYSICAL OBJECTS OF THE MASS THEY CLAIM.\n\nASSESSMENT - A PROPORTION OF WHAT WE ARE LOOKING AT IS UNMANNED DECOY CRAFT. RADAR SIGNATURE INDISTINGUISHABLE FROM A REAL HULL AT THIS RANGE.\n\nONLY DISCRIMINATOR AVAILABLE TO ME IS SPEED. ARMED CRAFT WILL BE MAKING FOUR FIVE KNOTS AND ABOVE. DECOYS WILL NOT.\n\n[ATLAS]: Get an aircraft over them and look with your eyes, Commander. If we shoot at ghosts we will be empty when something real turns up.\nButtonText=Acknowledge\nPopupStyle=Notification

Taskforce1DecoyIntel=Part of the surface picture assessed as unmanned decoy craft with no armament. Speed is the only remote discriminator - real craft make forty five knots, decoys do not. Visual identification recommended.

Taskforce1HoundsMessage=Title=CONTACT - THE HOUNDS ARE ON US\nBody=[FAIRWAY]: An unlisted transmitter cuts into the company channel.\n\nThe Syndicate wants that ship on the bottom, Commander. Not captured. Sunk. They would rather nobody has the technology than watch a competitor field it.\n\nThose are the Abyssal Hounds. Three packs, three bearings, and they have been converging on your track since before you sailed. There is no course that avoids them. There never was.\n\n[E.C.H.O.]: CLASSIFICATION CONFIRMED. TWELVE ARMED FAST ATTACK CRAFT IN THREE GROUPS OF FOUR. TORPEDO ARMED. WEAPON RANGE FIVE POINT FIVE MILES, UNGUIDED. THEY MUST CLOSE TO KILL.\n\n[ATLAS]: Get the air wing up off the container ship, now! Screen her and let them come to you. Every one of those boats has to get inside five miles to do anything, and that is five miles of open water we own.\nButtonText=Weapons free\nPopupStyle=Notification

Taskforce1HoundsIntel=Twelve hostile fast attack craft converging from three bearings, torpedo armed, straight running fish out to five and a half miles. They must close to release. Visual identification required to separate them from the decoys.

Taskforce1PlanChangeMessage=Title=INTERCEPTED TRAFFIC - THE PLAN HAS CHANGED\nBody=[FAIRWAY]: I am pushing you a decrypt. Read it now, it changes what is about to happen to you.\n\nThe Syndicate was never sent here to sink that ship. The tasking order was SEIZURE. Board her, take her, walk her into a yard nobody can point to, and let Meridian's creditors write the technology off as an asset that was never delivered. Anti-ship missiles were explicitly prohibited under that order. You cannot capture a hull you have put on the bottom.\n\nTheir airframes launched configured for a boarding escort. Not a strike.\n\n[SIREN]: And the title transferred an hour before they expected it to. Meridian's lawyers moved early because they wanted to be paid before the liquidators arrived.\n\n[ATLAS]: So we beat them to her by about sixty minutes. That is all. Sixty minutes.\n\n[FAIRWAY]: The order has been reissued. It now reads DENIAL. They are hanging whatever ordnance they can find on whatever is already in the air, and it is coming your way.\n\n[E.C.H.O.]: ASSESSMENT. HOSTILE ANTI-SHIP MISSILE INVENTORY IN THIS SECTOR IS IMPROVISED AND LIMITED. ONE ROTARY WING AIRFRAME ASSESSED AS MISSILE CAPABLE. THE SECOND IS CARRYING AIRCRAFT TORPEDOES AND MUST CLOSE INSIDE SIX MILES TO RELEASE.\n\n[ATLAS]: Then we got lucky, Commander. They came here to steal her and they have had to improvise a way to kill her instead. That is the only reason we are not looking at a full salvo. Do not waste it.\nButtonText=Acknowledge\nPopupStyle=Notification

Taskforce1PlanChangeIntel=Decrypt received. Syndicate tasking was originally seizure, not destruction, so their aircraft launched without a strike fit. Order reissued as denial. Expect one missile armed helicopter and one carrying short range aircraft torpedoes, inbound from the support group.

Taskforce1StrikeMessage=Title=ALERT - ROTARY WING CONTACTS INBOUND\nBody=[E.C.H.O.]: WARNING. TWO ROTARY WING CONTACTS, LOW, CLOSING FROM THE SUPPORT GROUP. LEAD AIRFRAME MATCHES THE MISSILE CAPABLE PROFILE.\n\nEXPECT SEA SKIMMING RELEASE AGAINST THE VESSEL PANDORA. PROBABILITY OF PENETRATION IS CRITICAL IF THEY REACH LAUNCH RANGE.\n\nTRAILING AIRFRAME IS NOT MISSILE ARMED. IT INTENDS TO GET INSIDE TORPEDO RANGE.\n\n[ATLAS]: Air defence batteries, engage! Make smoke, get chaff in the air, put every barrel you own on that bearing! Kill them before they release, Commander, that is the whole trick!\n\n[SIREN]: Two missiles, Commander. Two. If they had come here expecting to sink her there would be a dozen in the air right now.\nButtonText=Engage\nPopupStyle=Notification

Taskforce1StrikeIntel=Two helicopters inbound from the support group. One missile armed with sea skimming anti ship missiles, one carrying aircraft torpedoes that must be released inside six miles.

Taskforce1JammerDownMessage=Title=JAMMER DESTROYED\nBody=[E.C.H.O.]: SUPPRESSION HAS CEASED. ELECTROMAGNETIC BACKGROUND RETURNING TO NORMAL. THE SURFACE PICTURE IS RESOLVING.\n\nPANDORA NAVIGATION AND SURFACE SEARCH SUITE RESTORED. SHE HAS HER OWN EYES AGAIN.\n\n[ATLAS]: Good shooting. That thing was worth more than our entire company. Somebody in an office is going to have a very bad morning.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1HoundsClearMessage=Title=PACKS NEUTRALISED\nBody=[E.C.H.O.]: ALL TWELVE ARMED CRAFT DESTROYED. REMAINING SURFACE RETURNS ARE UNMANNED TARGET DRONES. NO WEAPON SYSTEMS. NO CREW. THEY WERE NEVER MEANT TO REACH US.\n\n[SIREN]: They spent a fortune on plywood and radar reflectors just to make you waste ammunition. That is not how pirates think.\n\n[ATLAS]: It is how an accountant thinks. Somebody costed this out.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1CerberusMessage=Title=SUPPORT GROUP COMMAND SHIP DESTROYED\nBody=[SIREN]: Their command ship is gone. Whoever was running the packs from that hull is in the water now, and the rest of their group is scattering.\n\n[ATLAS]: That was not on the contract, Commander, and I am not complaining. Anything we did not have to pay for is profit.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1PandoraLostMessage=Title=<size=40><color=Red>CONTRACT FAILED</color></size>\nBody=MV PANDORA is gone.\n\n[ATLAS]: The client paid us in hull, Commander, and the hull is on the bottom of the Arabian Sea. There is nothing to invoice and nobody solvent left to invoice it to.\n\n[E.C.H.O.]: THE SYNDICATE OBJECTIVE WAS DENIAL, NOT CAPTURE. THEY HAVE ACHIEVED IT. WE ASSISTED.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=<size=40><color=Red>MISSION FAILED</color></size>\nBody=Phantom Wake has no hulls left in the water.\n\nThe company is finished, and the container ship is somebody else's salvage.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1VictoryMessage=Title=<size=40><color=Lime>CONTRACT FULFILLED</color></size>\nBody=[E.C.H.O.]: PANDORA HAS REACHED THE HANDOVER POINT. CONTACTS BREAKING OFF. THREAT ELIMINATED.\n\n[SIREN]: The Syndicate is pulling back. I think they have decided we are more expensive to kill than we are worth.\n\n[ATLAS]: We burned a small fortune in ordnance tonight, Commander. But that container ship is ours now. We will patch her, repaint her, put a new name on the stern and file her as a general cargo hull out of Panama.\n\nAnd then we will have the best hidden airbase in the Indian Ocean, and nobody will ever look twice at her. Course for base.\n\n[E.C.H.O.]: MV PANDORA ADDED TO COMPANY ROSTER. UNARMED. UNREMARKABLE. OURS.\nButtonText=Exit mission\nPopupStyle=Outro


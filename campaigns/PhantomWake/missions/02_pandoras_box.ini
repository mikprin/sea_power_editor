02HoundsDestroyed=False
02JammerDestroyed=False
02SyndicateCommandShipSunk=False
02SeizureOrderIntercepted=False

; =====================================================================
; RETREAT ANCHOR - the Hounds run Morale 2-3 with
; RetreatAfterWeaponsExpended=True, so most will break once their two
; fish are gone. Without a Red retreat point they have nowhere to run
; to (docs-CLAUDE.md section 11). Anchored on the support group, which
; is where they came from.
; =====================================================================
[GameplayAnchors]
NumberOfAnchors=1
Anchor1=RetreatPoint_Red_1

[RetreatPoint_Red_1]

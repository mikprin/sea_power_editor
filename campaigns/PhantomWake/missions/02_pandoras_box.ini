; =====================================================================
; HOSTILE - THE IMPROVISED STRIKE
;
; Two fr_sa-321 Super Frelons, and they are deliberately NOT carrying
; the same thing. This is the whole point of the Trigger13 intercept.
;
; The Syndicate came here to SEIZE the Pandora before her title
; transferred, not to sink her - anti-ship missiles were prohibited
; under the original tasking because you cannot capture a hull you have
; put on the bottom. Meridian's lawyers signed her over an hour early,
; the plan collapsed, and the order was reissued as denial. So these
; two airframes launched configured for a boarding escort and are now
; carrying whatever could be hung on them in the time available:
;
;   Helicopter1  AntiShipPrecision  2 x fr_am-39 Exocet   35 NM
;   Helicopter2  AntiShip           2 x fr_e15 torpedo    6.5 NM
;
; That is TWO anti-ship missiles in the whole mission, not four, and it
; is a story reason rather than a difficulty slider. The second airframe
; has to run inside 6.5 NM of the ship it is trying to kill, in front of
; the escorts, which makes it a visible and beatable threat instead of
; another pair of sea skimmers.
;
; They spawn at Gate C from (62,-76) and (64,-78), over 40 NM from the
; Pandora - outside even Exocet range on purpose. They close for several
; minutes at 134 kt, and that transit is the player's warning and the
; Harriers' window. If the player kept CAP up this phase is two dead
; helicopters.
;
; Both Attack= lines name the Pandora, matching the reissued order and
; matching what E.C.H.O. announces. Same unverified-field caveat as the
; Hounds; if it is ignored they engage freely on the same approach.
; Helicopter2 attacks off wp_2 rather than wp_1 because it has to be a
; lot closer before its weapon is in range at all.
; =====================================================================
[Taskforce2Helicopter1]

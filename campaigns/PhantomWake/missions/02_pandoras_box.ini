; =====================================================================
; HOSTILE - THE ABYSSAL HOUNDS
;
; Three packs of wp_pt_libelle, ALL PRESENT FROM T=0, on the positions,
; headings, telegraph settings and routes laid out by hand in the
; editor. Nothing here is Disabled and nothing here waits for a trigger.
;
; SECOND PLAYTEST FIX - the packs could be dodged even though they were
; live from t=0. Three separate causes, all now corrected:
;
; 1. THEY WERE SLOWER THAN THE SHIP THEY WERE HUNTING. Telegraph=3 on an
;    engine-default hull is 15 kt (the common vanilla table is
;    -x,0,5,10,15,20,max). MV Pandora tops out at 20 kt and runs at
;    Telegraph=5. A 48 kt torpedo boat was chasing a 20 kt freighter at
;    15 kt, and pack one's first waypoint carried /SetTelegraph,2, which
;    dropped it to 10. They could never close, only pass. Now Telegraph=4
;    (20 kt) with /SetTelegraph,5 (48 kt) on the inbound leg, and
;    UnlimitedFuel=True so the sprint cannot strand them.
;
; 2. THE "COMB" CONVERGED TO ONE LINE. All three leader routes ended in
;    the player's start area, which put every pack on the same
;    start-to-handover axis. Measured across the corridor they all sat
;    within 5 NM of each other - a single tooth, not a comb. Each pack
;    now owns a cross-corridor lane and zigzags in it on a Loop:
;    pack one 18 to 6 NM north of the axis, pack three on the axis,
;    pack two 20 to 6 NM south. With ~15 NM of nav radar each, the three
;    lanes screen a continuous 65 NM front instead of one 30 NM strip.
;
; 3. THE RUN-UP WAS 60-75 NM. The packs started beyond the win circle,
;    so first contact came at about 3/4 of the passage. Every hostile
;    group has been compressed toward the player along the corridor
;    axis: packs 60-75 -> 36-46 NM, decoys 42-58 -> 25-38 NM, support
;    group 66 -> 52 NM (still just outside the 22 NM handover circle,
;    so it stays the last obstacle rather than a mid-lane one).
;    First radar contact now lands around 40 minutes instead of 100.
;
; MissionType was AntiSurface on every hostile. That value appears
; nowhere in the vanilla campaign and nowhere in the community guide -
; Patrol is the only value vanilla ever uses (18 occurrences). Switched
; to Patrol on the assumption that an unrecognised enum left these units
; with no AI mission at all. Easy to revert if it changes nothing.
;
; wp_pt_libelle, Project 131 fast attack craft. arsenal only reports the
; 23 mm ZU-23 because the tool lists mounts by magazine, but the raw
; unit file has three weapon systems:
;   WeaponSystem1  OTA-53_533mm torpedo tube, Ammunition=wp_53-38
;   WeaponSystem2  OTA-53_533mm torpedo tube, Ammunition=wp_53-38
;   WeaponSystem3  23mm ZU-23, 2400 rounds
; wp_53-38 is 5.5 NM, 34 kt, guidance NONE - straight runners, so the
; packs have to close to a few miles to do anything. 35 t hull, 48 kt
; flat out. Fast, fragile, blind past a few miles.
;
; The leader carries the waypoints; the Circle formation with
; OverrideSpawnPositions brings the other three along, as authored.
; =====================================================================


; FAIRWAY's decrypt.
[Trigger5]
Name=Intercepted traffic - seizure order reissued as denial
Condition_LeaderSeen_Type=UnitDetected
Condition_LeaderSeen_Taskforce=Taskforce2
Condition_LeaderSeen_Units=Taskforce2Vessel1,Taskforce2Vessel5,Taskforce2Vessel9

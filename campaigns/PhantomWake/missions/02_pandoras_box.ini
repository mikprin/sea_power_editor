; =====================================================================
; THE PRIZE - MV PANDORA
; Position, heading and both waypoints are exactly as laid out by hand
; in share/02_pandoras_box.ini. Telegraph raised 4 -> 5 so the 77 NM
; passage runs at her 20 kt maximum instead of about 16.
;
; THE HULL is awarded by JoinTaskForce=True on this section, NOT by
; TaskForceModeCompletionRewardedUnits in campaign.ini - that field
; files everything it is handed as an aircraft, which is how the 01C
; Foxtrot ended up under the Fixed Wing tab.
;
; THE AIR WING below is the opposite case and IS awarded by
; TaskForceModeCompletionRewardedUnits on [Mission5] in campaign.ini,
; because these eight actually are aircraft. CustomAirGroup only puts
; them on the deck for the duration of this mission - it does not hand
; them to the company. The Squadron references here must stay in step
; with that reward line and with [AllowedHelicopters]/[AllowedAircraft]
; in player_task_force_roster.ini, or the player flies one set of
; airframes here and inherits a different set afterwards.
;
; Deck fits ten (AircraftCapacity=10, DeckParkSlots=8), so eight fills
; the park.
; =====================================================================

; =====================================================================
; TRIGGERS
;
; Everything is gated on the Pandora's position, never on a clock, so
; the pacing follows the player rather than a stopwatch. A player who
; runs her at flank meets the Hounds sooner; one who creeps meets them
; later, with more time to get aircraft up. There is no time limit at
; all, matching 01, 01A and 01C.
;
; docs-CLAUDE.md section 5: Action_Units is per TRIGGER, not per action.
; Trigger2 and Trigger3 are therefore one event split in two, because
; Trigger2 needs Action_Units for the Pandora's sensors and Trigger3
; needs it for the spawn list.
; =====================================================================

[Trigger1]
Name=Start
Condition_Start_Type=Time
Condition_Start_Time=5
ConditionsCompleted=<Start>
Action_Taskforce1_Message=Taskforce1StartMessage
Action_Taskforce1_Intel=Taskforce1StartIntel
Action_Forecast=StartForecast

; Gate A, d=10. The jamming starts and the Pandora goes blind.
[Trigger2]
Name=Gate A - EW jamming, Pandora sensors down
Condition_ContactZone_Type=UnitsInTheArea
Condition_ContactZone_PositionNM=4.63,0,-49.05
Condition_ContactZone_AreaRadiusNM=5
Condition_ContactZone_AreaLabel=ContactZoneAreaLabel
Condition_ContactZone_AreaDisplaySide=Blue
Condition_ContactZone_Units=Taskforce1Vessel3
ConditionsCompleted=<ContactZone>
Action_Taskforce1_Message=Taskforce1JammingMessage
Action_Taskforce1_Intel=Taskforce1JammingIntel
Action_Taskforce1_VoiceMessage=NewIntelReceived
Action_Units=Taskforce1Vessel3
Action_EnableDisableSensorSystems=Disable
Action_EnableTriggers=Trigger3
Action_ObjectivesUnHide=KillJammer

; No conditions at all, so it fires the instant Trigger2 enables it.
; See docs-CLAUDE.md section 2B. Split off purely because Action_Units
; is per-trigger and Trigger2 has spent its on the Pandora.
[Trigger3]
Name=Gate A - spawn the jammer and the decoy swarm
Disabled=True
Action_SetEnabledStatus=True
Action_Units=Taskforce2Aircraft1,Taskforce2Vessel16,Taskforce2Vessel17,Taskforce2Vessel18,Taskforce2Vessel19,Taskforce2Vessel20,Taskforce2Vessel21,Taskforce2Vessel22,Taskforce2Vessel23,Taskforce2Vessel24,Taskforce2Vessel25,Taskforce2Vessel26,Taskforce2Vessel27,Taskforce2Vessel28,Taskforce2Vessel29,Taskforce2Vessel30,Taskforce2Vessel31

; Gate B, d=20. Three packs come off the leash from three bearings.
; Pack Alpha has 22 NM to run at 48 kt, Bravo 20 NM, Charlie 22 NM, so
; all three arrive within about half an hour of this firing. The
; Pandora covers d=20 to d=30 in 30 minutes at 20 kt, so the packs and
; the convoy meet at roughly Gate C. That overlap is intentional - the
; missile strike lands while the knife fight is still going.
[Trigger4]
Name=Gate B - the Hounds are released
Condition_HoundZone_Type=UnitsInTheArea
Condition_HoundZone_PositionNM=13.83,0,-52.95
Condition_HoundZone_AreaRadiusNM=5
Condition_HoundZone_AreaLabel=HoundZoneAreaLabel
Condition_HoundZone_AreaDisplaySide=Blue
Condition_HoundZone_Units=Taskforce1Vessel3

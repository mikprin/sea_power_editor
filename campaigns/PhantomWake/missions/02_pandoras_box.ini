; ---------- forecast ----------
StartForecast=CONTRACT WEATHER SUMMARY - CENTRAL ARABIAN SEA\nVALID: 061400-062200Z AUG 85\nOvercast, base two thousand feet, southwesterly monsoon flow. Sea State 4 with a long westerly swell. Sunset falls during the period, so the light goes from poor to none while you are still in the lane. Visual identification range drops off badly after dusk. Surface search is unrestricted by weather, which means anything wrong with your radar picture tonight is not the weather.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - CONTRACT 02</size>\nPANDORA'S BOX\n<size=24>6 August 1985 - Central Arabian Sea</size>\nBody=[SIREN]: Commander, we are in neutral water and the paperwork is done. Title to the vessel ARAPAHO has transferred. Meridian Naval Systems signed her over an hour ago and their engineers walked off in the last port with their severance in cash.\n\n[ATLAS]: Which is the good news. The client went bankrupt building her and could not pay the fee, so they paid us in hull. She is a container ship with a flight deck welded on, and she is ours the moment she reaches NavPoint Keystone. Until then she is the largest, slowest, most expensive target in the Arabian Sea.\n\nShe has no weapons. None. Not a gun, not a launcher. What she has is a deck and eight airframes, and that is the whole reason anyone wants her dead.\n\n[E.C.H.O.]: DECK READINESS ADVISORY. AIRFRAME SPIN UP TIME ONE FIVE MINUTES MINIMUM. RECOMMEND LAUNCHING RECONNAISSANCE ROTARY WING BEFORE THE FIRST CONTACT, NOT AFTER. AN AIRCRAFT ON THE DECK IS A PASSENGER.\n\n[ATLAS]: Conserve ordnance. Every round we fire tonight comes out of a fee we are being paid in scrap metal.\nButtonText=Get underway\nPopupStyle=Intro

Taskforce1StartIntel=Contract 02 - Escort MV Pandora east along the transit lane to NavPoint Keystone. She is unarmed. Launch aircraft early, airframe ready up time is fifteen minutes.

Taskforce1JammingMessage=Title=WARNING - MASSIVE EW INTERFERENCE\nBody=[E.C.H.O.]: ALERT. BROADBAND SUPPRESSION ACROSS ALL SURFACE SEARCH BANDS. TRACKING TWO FOUR... THREE SIX... FOUR TWO UNIDENTIFIED CONTACTS.\n\nSIGNATURE ANALYSIS INCONSISTENT. RETURNS DO NOT CORRESPOND TO PHYSICAL OBJECTS. RANGE AND BEARING DATA UNRELIABLE. I CANNOT SEPARATE HULLS FROM ARTIFACTS AT THIS RANGE.\n\n[ATLAS]: We are being jammed. The whole squadron is going blind. Where are they even coming from?\n\n[SIREN]: High and to the east, at the edge of the plot. Somebody is standing off above the overcast with a real electronic warfare aircraft. That is not a pirate. That is a budget.\n\n[E.C.H.O.]: PANDORA NAVIGATION AND SURFACE SEARCH SUITE OFFLINE. SHE IS RUNNING BLIND ON OUR PLOT ALONE.\nButtonText=Understood\nPopupStyle=Notification

Taskforce1JammingIntel=Standoff jammer active east of the lane at high altitude. Surface picture is saturated with false returns. MV Pandora's own sensors are down. Killing the jammer should restore her suite.

Taskforce1HoundsMessage=Title=CONTACT - THE HOUNDS ARE OFF THE LEASH\nBody=[FAIRWAY]: An unlisted transmitter cuts into the company channel.\n\nThe Syndicate wants that ship on the bottom, Commander. Not captured. Sunk. They would rather nobody has the technology than watch a competitor field it.\n\nThose are the Abyssal Hounds. They hunt in a pack, they come from the blind quarter, and half of what you are looking at is not there at all. Do not trust your radar tonight. Use the eyes you have in the sky.\n\n[ATLAS]: Get the air wing up off the container ship, now! We need somebody putting eyeballs on those contacts. If we shoot at ghosts we will be empty when the real boats arrive, and those boats carry torpedoes.\n\n[E.C.H.O.]: CLASSIFICATION NOTE. REAL CRAFT ARE MAKING FOUR FIVE KNOTS PLUS. THE ARTIFACTS ARE NOT. SPEED IS THE ONLY DISCRIMINATOR I CAN OFFER UNTIL SOMETHING GETS CLOSE ENOUGH TO LOOK.\nButtonText=Launch the air wing\nPopupStyle=Notification

Taskforce1HoundsIntel=Twelve hostile fast attack craft inbound from three vectors, torpedo armed, straight running fish out to five miles. Remaining contacts assessed as unmanned decoy craft. Visual identification required.

Taskforce1PlanChangeMessage=Title=INTERCEPTED TRAFFIC - THE PLAN HAS CHANGED\nBody=[FAIRWAY]: I am pushing you a decrypt. Read it now, it changes what is about to happen to you.\n\nThe Syndicate was never sent here to sink that ship. The tasking order was SEIZURE. Board her, take her, walk her into a yard nobody can point to, and let Meridian's creditors write the technology off as an asset that was never delivered. Anti-ship missiles were explicitly prohibited under that order. You cannot capture a hull you have put on the bottom.\n\nTheir airframes launched configured for a boarding escort. Not a strike.\n\n[SIREN]: And the title transferred an hour before they expected it to. Meridian's lawyers moved early because their lawyers wanted to be paid before the liquidators arrived.\n\n[ATLAS]: So we beat them to her by about sixty minutes. That is all. Sixty minutes.\n\n[FAIRWAY]: The order has been reissued. It now reads DENIAL. They are hanging whatever ordnance they can find on whatever is already in the air.\n\n[E.C.H.O.]: ASSESSMENT. HOSTILE ANTI-SHIP MISSILE INVENTORY IN THIS SECTOR IS IMPROVISED AND LIMITED. ONE ROTARY WING AIRFRAME ASSESSED AS MISSILE CAPABLE. THE SECOND IS CARRYING AIRCRAFT TORPEDOES AND MUST CLOSE INSIDE SIX MILES TO RELEASE.\n\n[ATLAS]: Then we got lucky, Commander. They came here to steal her and they have had to improvise a way to kill her instead. That is the only reason we are not looking at a full salvo. Do not waste it.\nButtonText=Acknowledge\nPopupStyle=Notification

Taskforce1PlanChangeIntel=Decrypt received. Syndicate tasking was originally seizure, not destruction, so their aircraft launched without a strike fit. Order reissued as denial. Expect one missile armed helicopter and one carrying short range aircraft torpedoes.

Taskforce1StrikeMessage=Title=ALERT - ANTI SHIP MISSILE LAUNCH\nBody=[E.C.H.O.]: WARNING. TWO ROTARY WING CONTACTS EAST, LOW, CLOSING. LEAD AIRFRAME MATCHES THE MISSILE CAPABLE PROFILE.\n\nLAUNCH DETECTED. SEA SKIMMING VECTOR. TARGET IS THE VESSEL PANDORA. PROBABILITY OF PENETRATION IS CRITICAL.\n\nTRAILING AIRFRAME IS NOT LAUNCHING. IT IS STILL CLOSING. IT INTENDS TO GET INSIDE TORPEDO RANGE.\n\n[ATLAS]: Air defence batteries, engage! Make smoke, get chaff in the air, put every barrel you own on that bearing! Protect the container ship at any cost, Commander, she cannot take a hit and we cannot take the loss!\n\n[SIREN]: Two missiles, Commander. Two. If they had come here expecting to sink her there would be a dozen in the air right now.\nButtonText=Engage\nPopupStyle=Notification

Taskforce1StrikeIntel=One missile armed helicopter engaging from the east with sea skimming anti ship missiles. A second is closing to release aircraft torpedoes inside six miles. Their support group is holding at standoff range to the southeast.

Taskforce1JammerDownMessage=Title=JAMMER DESTROYED\nBody=[E.C.H.O.]: SUPPRESSION HAS CEASED. ELECTROMAGNETIC BACKGROUND RETURNING TO NORMAL. FALSE RETURNS ARE COLLAPSING OFF THE PLOT.\n\nPANDORA NAVIGATION AND SURFACE SEARCH SUITE RESTORED. SHE HAS HER OWN EYES AGAIN.\n\n[ATLAS]: Good shooting. That thing was worth more than our entire company. Somebody in an office is going to have a very bad morning.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1HoundsClearMessage=Title=PACK NEUTRALISED\nBody=[E.C.H.O.]: ALL TWELVE ARMED CRAFT DESTROYED. REMAINING SURFACE RETURNS ARE UNMANNED TARGET DRONES. NO WEAPON SYSTEMS. NO CREW. THEY WERE NEVER MEANT TO REACH US.\n\n[SIREN]: They spent a fortune on plywood and radar reflectors just to make you waste ammunition. That is not how pirates think.\n\n[ATLAS]: It is how an accountant thinks. Somebody costed this out.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1CerberusMessage=Title=SUPPORT GROUP DESTROYED\nBody=[SIREN]: Their command ship is gone. Whoever was running the pack from that hull is in the water now, and the rest of their group is scattering.\n\n[ATLAS]: That was not on the contract, Commander, and I am not complaining. Anything we did not have to pay for is profit.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1PandoraLostMessage=Title=<size=40><color=Red>CONTRACT FAILED</color></size>\nBody=MV PANDORA is gone.\n\n[ATLAS]: The client paid us in hull, Commander, and the hull is on the bottom of the Arabian Sea. There is nothing to invoice and nobody solvent left to invoice it to.\n\n[E.C.H.O.]: THE SYNDICATE OBJECTIVE WAS DENIAL, NOT CAPTURE. THEY HAVE ACHIEVED IT. WE ASSISTED.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=<size=40><color=Red>MISSION FAILED</color></size>\nBody=Phantom Wake has no hulls left in the water.\n\nThe company is finished, and the container ship is somebody else's salvage.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1FlagshipLostMessage=Title=ESCORT LOSS\nBody=[ATLAS]: We just lost a hull, Commander.\n\nWe are not a navy. We do not have a replacement sitting at a pier waiting for us. That is a line in the ledger that does not come back.\n\nFinish the contract. Grieve on our own time.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1VictoryMessage=Title=<size=40><color=Lime>CONTRACT FULFILLED</color></size>\nBody=[E.C.H.O.]: PANDORA HAS CROSSED NAVPOINT KEYSTONE. CONTACTS LOST. ELECTROMAGNETIC BACKGROUND NORMAL. THREAT ELIMINATED.\n\n[SIREN]: The Syndicate is pulling back. I think they have decided we are more expensive to kill than we are worth.\n\n[ATLAS]: We burned a small fortune in ordnance tonight, Commander. But that container ship is ours now. We will patch her, repaint her, put a new name on the stern and file her as a general cargo hull out of Panama.\n\nAnd then we will have the best hidden airbase in the Indian Ocean, and nobody will ever look twice at her. Course for base.\n\n[E.C.H.O.]: MV PANDORA ADDED TO COMPANY ROSTER. UNARMED. UNREMARKABLE. OURS.\nButtonText=Exit mission\nPopupStyle=Outro


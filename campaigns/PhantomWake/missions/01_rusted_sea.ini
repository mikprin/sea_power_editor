
[Language_en]
Name=01 Rusted Waters
Description=Catch up with the container ship MV Vagabond, take her under escort, and walk her out to NavPoint Alpha. Pirates, fog, and something far worse.

; ---------- ship name overrides ----------
NeutralVessel1NameOverride=MV VAGABOND
NeutralVessel1ShortNameOverride=VAGABOND


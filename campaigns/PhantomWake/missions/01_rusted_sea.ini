; ---------- forecast ----------
StartForecast=CONTRACT WEATHER SUMMARY - BAB-EL-MANDEB APPROACHES\nVALID: 260600-261200Z JUN 85\nDense advection fog across the eastern approaches at 0600 local, visibility under one nautical mile in patches. Sea State 3 with a light southwesterly. Fog will thin slowly through the morning but will not clear during the period. Surface search radar performance degraded by clutter and moisture. Assume you cannot see what you have not driven up to and looked at.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - CONTRACT 01</size>\nRUSTED WATERS\n<size=24>26 June 1985</size>\nBody=Welcome to the ocean, Commander.\n\nThe client is a corporate proxy. They have no name, they have paid a premium, and they want this transit kept off the books. Local authorities are not to be involved.\n\nMV Vagabond is a civilian container ship inbound from the strait. Link up with her at the marked rendezvous, take station, and walk her out to NavPoint Alpha in international water.\n\nThe fog is thick and these grounds are crowded. Fishermen, smugglers, and skiffs that are neither. Your sensors will not tell them apart.\n\nRULES OF ENGAGEMENT: lethal force is authorised only to defend the client vessel or your own hulls. Identify visually before you shoot. Every round you fire is money burned, and every dead fisherman is a contract we never get again.\nButtonText=Get underway\nPopupStyle=Intro

StartIntel=Contract 01 - Escort MV Vagabond to NavPoint Alpha. ROE restrictive. Visual identification required before engagement.

Taskforce1RendezvousMessage=Title=RENDEZVOUS COMPLETE\nBody=MV VAGABOND: We have you visual off our quarter. Good to see somebody out here.\n\nWe are making turns for the outbound leg now. Stay close, we have no defensive fit at all.\nButtonText=Acknowledge\nPopupStyle=Message

Taskforce1ClutterMessage=Title=CONGESTED WATER\nBody=Surface picture is filling up. Multiple small contacts crossing the convoy track, most of them slow, none of them squawking anything.\n\nIn this visibility the radar cannot separate a fishing dhow from an armed skiff. If you want to know what a contact is, you will have to go and look at it.\nButtonText=Acknowledge\nPopupStyle=Message

Taskforce1AmbushMessage=Title=WARNING - CRAFT ACCELERATING\nBody=Three of those contacts just came off idle and went to full throttle on an intercept course for VAGABOND.\n\nThey are weapons visible. This is an attack.\n\nWatch your fire. The rest of that cluster is still full of fishermen.\nButtonText=Engage\nPopupStyle=Message

Taskforce1PiratesClearMessage=Title=SKIFFS NEUTRALISED\nBody=All three hostile craft are dead in the water. VAGABOND reports no damage.\n\nThat was almost too easy for what the client is paying.\nButtonText=Continue\nPopupStyle=Message

Taskforce1JammingMessage=Title=WARNING - SEVERE EW INTERFERENCE\nBody=Broadband noise across the surface search and navigation bands. This is not weather and it is not a fishing set.\n\nThis is military-grade jamming. Somebody with a real budget is standing off above the overcast and blinding this convoy on purpose.\n\nVAGABOND reports her navigation and radar suite is completely down. She is running blind and holding course on our word alone.\n\nThe pirates were the noise. This is the signal.\nButtonText=Understood\nPopupStyle=Message

JammingIntel=Military-grade broadband jammer active overhead. Pirate attack assessed as cover for a follow-on action against MV Vagabond.

Taskforce1HeloInboundMessage=Title=LOW CONTACT - CLOSING FAST\nBody=Something just came out of the fog at wavetop height, tracking straight for VAGABOND. Heavy transport type, no markings, no transponder, no answer on any channel.\n\nThat airframe carries men, not missiles. They are not here to sink her, they are here to take what is in her hold.\n\nKill it before it gets over the deck.\nButtonText=Weapons free on the helicopter\nPopupStyle=Message

Taskforce1BoardingMessage=Title=COMMANDOS ARE BOARDING\nBody=VAGABOND: THEY ARE ON THE DECK, REPEAT, MEN ON THE DECK, THEY ARE ROPING DOWN ON THE CONTAINERS.\n\nShoot that helicopter down NOW. Once they cut into the secure boxes the contract is finished and so are we.\nButtonText=Fire\nPopupStyle=Message

Taskforce1HeloDownMessage=Title=THREAT NEUTRALISED\nBody=Transport is down. Whoever was still on the ropes went into the water with it.\n\nVAGABOND reports the deck is clear and her hold is intact.\n\nGet her to Alpha. We will work out who sent that thing later.\nButtonText=Continue\nPopupStyle=Message

Taskforce1CargoLostMessage=Title=MISSION FAILED\nBody=The boarding party is through into the secure containers.\n\nWhatever the client was moving is now in somebody else's hands. VAGABOND's master has surrendered the ship.\n\nCargo breached. Contract failed. Phantom Wake does not get paid, and word of this will travel.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1VagabondLostMessage=Title=MISSION FAILED\nBody=MV VAGABOND is gone.\n\nThe client hired us for exactly one thing and we could not do it. There is no partial payment on an escort contract.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=MISSION FAILED\nBody=Phantom Wake has no hulls left in the water.\n\nThe company is finished.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1CiviliansHitMessage=Title=CIVILIAN CASUALTIES\nBody=We just put rounds into a boat full of fishermen.\n\nThe client will not care. Everyone else on this coast will. That is a door closed to us permanently.\nButtonText=Continue\nPopupStyle=Message

Taskforce1VictoryMessage=Title=<size=40><color=Lime>CONTRACT FULFILLED</color></size>\nBody=MV VAGABOND has crossed into international water at NavPoint Alpha and is clear.\n\nEscort complete. The client has released payment and asked no questions, which tells you something on its own.\n\nSomebody spent real money to put a jammer and an assault transport over a rusted container ship in the Gulf of Aden. That was not piracy. That was an operation.\n\nWe are on somebody's board now, Commander. Spend the money well.\nButtonText=Exit mission\nPopupStyle=Outro


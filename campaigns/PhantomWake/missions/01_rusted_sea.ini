MapSymbol_New1Label_en=Rendezvous Point
MapSymbol_New2Label_en=MV Vagabond - underway
MapSymbol_New3Label_en=NavPoint Alpha
MapSymbol_New4Label_en=Congested Fishing Grounds
MapSymbol_New5Label_en=Unknown Air Activity
Zone1Label_en=Deployment Zone - Obsidian Orcas


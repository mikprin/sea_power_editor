; =====================================================================
; CONVOY AXIS
; Everything is laid out along bearing 110 from the rendezvous point at
; (-9.97, -1.04). Distance d along that axis maps to:
;   d=-5  Vagabond start        (-14.67,  0.67)
;   d= 0  Rendezvous            ( -9.97, -1.04)
;   d= 5  Pirate ambush         ( -5.27, -2.75)  <- halfway to the axis
;   d= 7  EW and helo launch    ( -3.39, -3.44)
;   d=10  Air Threat Axis "B"   ( -0.57, -4.46)
;   d=16  NavPoint Alpha        (  5.07, -6.51)
; Vagabond sails from t=0 at a fixed speed and every downstream beat is
; position-gated off HER, not off the clock. The sequence therefore stays
; in order no matter how fast or slow the player is. Do not change her
; Telegraph or waypoints without re-checking the gates.
; =====================================================================

; =====================================================================
; PLAYER - Task Force Mode anchor. Type and variant here are a stand-in;
; the campaign generator replaces this hull with the player's own ships
; and uses this position, heading, telegraph and waypoint as the seed.
; =====================================================================

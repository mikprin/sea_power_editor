; =====================================================================
; ENVIRONMENT
; Map centre unchanged from the editor backbone (share-01C.ini):
;   X = (lon - 39.04) * 60      Z = (lat + 6.08) * 60
; Playfield is the Zanzibar Channel and the water north of Unguja.
;
; COASTLINE, measured - not guessed. The land mask below was read out of a
; render of this mission's own campaign map, calibrated on the deployment
; rectangle (12.375 px per NM) and cleaned of the symbol overlays, then
; every position and route leg in this file was sampled against it. An
; earlier draft used an inferred island outline and was wrong: the large
; island east of the playfield is PEMBA, not Unguja, and a threat arrow
; ended up sitting on top of it.
;
;   Mainland (Tanzania)  X <= -12 at Z 6..14, receding to X <= -4 by Z 36
;   Unguja north end     X 10..20 at Z 4..22   (Tumbatu at X 10..12, Z 14..18)
;   Pemba                X 32..48 at Z 36..60
;   Zanzibar Channel     X -12..8 at Z 6..20  <- the bay, ~20 NM wide
;   Open water north     X -4..30 at Z 22..60
;
; So the channel is a genuine bounded bay with the mainland to the west
; and Unguja to the east, and its northern mouth at Z ~20 is the door the
; picket line closes. That is the whole mission in one sentence.
;
; Date moved from 26 Jun to 16 Jul 1985 so the optional contracts run in
; order behind Mission 01: 01A is 2 Jul, 01B is 9 Jul, 01C is 16 Jul.
; Daylight on purpose - the script wants a loud gun fight, not a sneak.
; =====================================================================
[Environment]
Date=1985,7,16
Time=10,0
ConvertTimeToLocal=False
SeaState=2
Clouds=Scattered_1
WindDirection=NE
MapCenterLatitude=-6.08
MapCenterLongitude=39.04
LoadBackgroundData=False

[Mission]
Difficulty=0
PlayerTaskforce=Taskforce1
EnemyTaskforce=Taskforce2
NumberOfTaskforce1Vessels=1
NumberOfTaskforce2Vessels=9
NumberOfTaskforce2Helicopters=1
NumberOfTaskforce1Submarines=1
NumberOfNeutralVessels=3
Taskforce2_NumberOfFormations=2
Taskforce2_Formation1=Taskforce2Vessel5,Taskforce2Vessel6|Interceptor Pair|LineAstern|0.8|OverrideSpawnPositions
Taskforce2_Formation2=Taskforce2Vessel7,Taskforce2Vessel8,Taskforce2Vessel9|Coastal Squadron|Vic|1.2|OverrideSpawnPositions
NumberOfTriggers=9

; =====================================================================
; PLAYER - Task Force Mode anchor, in the deployment box north of the
; channel mouth, heading south-south-west into it. Type and variant are
; discarded by the generator (docs-CLAUDE.md section 14); position,
; heading, telegraph and waypoints are kept.
;
; Weapons free from the first second. This contract has no ROE at all -
; the whole point of Phase 1 is to be noisy.
;
; Only Taskforce1Vessel1 is referenced by triggers, so the player may
; bring as many hulls as they can afford without breaking anything.
; =====================================================================
[Taskforce1Vessel1]

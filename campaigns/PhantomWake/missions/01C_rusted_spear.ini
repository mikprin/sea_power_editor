; =====================================================================
; TRIGGERS
;
; Phase gating is deliberately forgiving. The rendezvous trigger is NOT
; gated on the blockade being destroyed - a player who threads the line
; instead of clearing it still gets the submarine, they just forfeit the
; BreakBlockade objective. Gating one on the other would soft-lock the
; mission for anyone who slipped past a picket boat.
;
; Note docs-CLAUDE.md section 5: Action_Units is per-TRIGGER, not per
; action. Trigger4 and Trigger5 therefore share one condition and are
; split only because they need different Action_Units lists.
; =====================================================================

[Trigger1]
Name=Start
Condition_Start_Type=Time
Condition_Start_Time=5
ConditionsCompleted=<Start>
Action_Taskforce1_Message=Taskforce1StartMessage
Action_Taskforce1_Intel=Taskforce1StartIntel
Action_Forecast=StartForecast

; Fires about 10 NM short of the picket line and launches the helicopter.
[Trigger2]
Name=Closing on the blockade - launch the air patrol
Condition_Approach_Type=UnitsInTheArea
Condition_Approach_PositionNM=2,0,26
Condition_Approach_AreaRadiusNM=8
Condition_Approach_AreaLabel=BlockadeAreaLabel
Condition_Approach_AreaDisplaySide=Blue
Condition_Approach_Units=Taskforce1Vessel1
ConditionsCompleted=<Approach>
Action_Taskforce1_Message=Taskforce1BlockadeMessage
Action_Taskforce1_Intel=Taskforce1BlockadeIntel
Action_SetEnabledStatus=True
Action_Units=Taskforce2Helicopter1

[Trigger3]
Name=Picket line destroyed - blockade broken
Condition_PicketDead_Type=UnitDestroyed
Condition_PicketDead_Units=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3,Taskforce2Vessel4
ConditionsCompleted=<PicketDead>
Action_Taskforce1_Message=Taskforce1BlockadeClearMessage
Action_VariableSet=01CBlockadeBroken,True

; Rendezvous. Hands the boat over and gives her the transit route.
; Action_UnitTransferToTaskforce is confirmed in vanilla with the values
; Neutral and Taskforce2; Taskforce1 is documented but not seen in
; vanilla, so it is the one inferred field in this file. If it fails the
; player simply cannot steer her - everything else still fires.
; Telegraph is set three redundant ways (docs-CLAUDE.md section 5 warns
; Action_UnitTelegraph is unverified) and the player can override all of
; them by hand anyway, because she is theirs from here.
[Trigger4]
Name=Rendezvous - Nyoka joins the task force
Condition_Contact_Type=UnitsInTheArea
Condition_Contact_PositionNM=0,0,11
Condition_Contact_AreaRadiusNM=3
Condition_Contact_AreaLabel=RendezvousAreaLabel
Condition_Contact_AreaDisplaySide=Blue
Condition_Contact_Units=Taskforce1Vessel1
ConditionsCompleted=<Contact>
Action_Taskforce1_Message=Taskforce1RendezvousMessage
Action_Taskforce1_Intel=Taskforce1RendezvousIntel
Action_Taskforce1_VoiceMessage=ObjectiveComplete
Action_Units=Taskforce1Submarine1
Action_UnitTelegraph=5
Action_UnitVelocityInKnots=16
Action_UnitWaypoints=1,0,19/SetTelegraph,5|5,0,25|9,0,27.5
Action_EnableTriggers=Trigger6
Action_ObjectivesCompleted=Rendezvous
Action_VariableSet=01CSubContact,True

; Same condition as Trigger4, split because Action_Units is per-trigger.
; It also arms the win trigger: Trigger4 already spends its one
; Action_EnableTriggers line on Trigger6, and a comma list on that action
; is not confirmed anywhere in vanilla, so the second enable lives here.
[Trigger5]
Name=Rendezvous - launch the interceptor pair and arm the win condition
Condition_Contact_Type=UnitsInTheArea
Condition_Contact_PositionNM=0,0,11
Condition_Contact_AreaRadiusNM=3
Condition_Contact_AreaDisplaySide=None
Condition_Contact_Units=Taskforce1Vessel1
ConditionsCompleted=<Contact>
Action_Taskforce1_Message=Taskforce1InterceptMessage
Action_EnableTriggers=Trigger7
Action_SetEnabledStatus=True
Action_Units=Taskforce2Vessel5,Taskforce2Vessel6

; Nyoka a third of the way up the channel. Enabled by Trigger4 so it
; cannot fire on the boat's stationary start position.
[Trigger6]
Name=Nyoka mid-channel - coastal squadron sorties
Disabled=True
Condition_MidChannel_Type=UnitsInTheArea
Condition_MidChannel_PositionNM=1,0,19
Condition_MidChannel_AreaRadiusNM=2.5
Condition_MidChannel_AreaDisplaySide=None
Condition_MidChannel_Units=Taskforce1Submarine1
ConditionsCompleted=<MidChannel>
Action_Taskforce1_Message=Taskforce1SquadronMessage
Action_Taskforce1_Intel=Taskforce1SquadronIntel
Action_SetEnabledStatus=True
Action_Units=Taskforce2Vessel7,Taskforce2Vessel8,Taskforce2Vessel9

; Win. Disabled until the boat is actually under escort, so reaching the
; shelf with a still-neutral submarine cannot end the mission early.
; No despawn or forced dive: the mission ends on the same frame, so the
; crash dive is narrative and nothing has to be destroyed to sell it.
[Trigger7]
Name=Nyoka reaches NavPoint Zulu - contract fulfilled
Disabled=True
Condition_Zulu_Type=UnitsInTheArea
Condition_Zulu_PositionNM=10,0,28
Condition_Zulu_AreaRadiusNM=4
Condition_Zulu_AreaLabel=ZuluAreaLabel
Condition_Zulu_AreaDisplaySide=Blue
Condition_Zulu_Units=Taskforce1Submarine1
ConditionsCompleted=<Zulu>
Action_Taskforce1_Message=Taskforce1VictoryMessage
Action_Taskforce1_VoiceMessage=MissionComplete
Action_EndMission=True
Action_Victory=Taskforce1
Action_ObjectivesCompleted=EscortSub,SubMustSurvive,TaskForceMustSurvive
Action_VariableSet=01CSubExtracted,True

[Trigger8]
Name=Nyoka destroyed - contract failed
Condition_SubDead_Type=UnitDestroyed
Condition_SubDead_Units=Taskforce1Submarine1
ConditionsCompleted=<SubDead>
Action_Taskforce1_Message=Taskforce1SubLostMessage
Action_Taskforce1_VoiceMessage=MissionFail
Action_EndMission=True
Action_Victory=Taskforce2
Action_ObjectivesFailed=SubMustSurvive,EscortSub
Action_ObjectivesCancel=Rendezvous,TaskForceMustSurvive
Action_VariableSet=01CSubLost,True

[Trigger9]
Name=Task force wiped out - defeat
Condition_NoHulls_Type=HasNoUnitsOfType
Condition_NoHulls_Taskforce=Taskforce1
Condition_NoHulls_UnitType=Vessel
ConditionsCompleted=<NoHulls>
Action_Taskforce1_Message=Taskforce1TaskForceLostMessage
Action_Taskforce1_VoiceMessage=MissionFail
Action_EndMission=True
Action_Victory=Taskforce2
Action_ObjectivesFailed=TaskForceMustSurvive,EscortSub
Action_ObjectivesCancel=Rendezvous,SubMustSurvive

[Taskforce1_Objectives]
Rendezvous=20,-20,Complete,Main
EscortSub=60,-60,Complete,Main
SubMustSurvive=0,-60,Complete,Main
TaskForceMustSurvive=10,-10,Complete

[CampaignVariables]
01CBlockadeBroken=False
01CSubContact=False
01CSubExtracted=False
01CSubLost=False


; --- PHASE 2 - the interceptor pair. Disabled=True until the player
; --- takes Nyoka under escort, then they come off the mainland shore at
; --- 38 kt and go straight for the submarine.
; ---
; --- Attack= is how the script's "make them prioritise the sub over the
; --- player's corvette" is implemented. Format from the community guide:
; ---   Attack=target,timeOfAttack,waypointNumber
; --- Time is seconds AFTER reaching the named waypoint. Ammunition and
; --- shot count are left off so they use their guns as normal.
; --- UNVERIFIED: no Pacific Strike mission uses Attack= at all, so this
; --- is guide-documented but not confirmed in vanilla. If it is ignored,
; --- the pair still runs the authored route straight past the submarine
; --- with weapons free, so the phase still plays - it just becomes an
; --- ordinary intercept instead of a scripted one.
[Taskforce2Vessel5]
Type=wp_pt_p6
VariantReference=Default
Disabled=True
UnlimitedFuel=False
MissionType=AntiSurface
WeaponStatus=Free
RadarsActive=True
CrewSkill=Trained
Morale=3
RelativePositionInNM=-8,0,11
Telegraph=4
Nation=libya
Heading=35
Waypoints=-4,0,13|0,0,17|2,0,22|6,0,26|Loop
Attack=Taskforce1Submarine1,15,wp_1


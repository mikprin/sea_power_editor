; =====================================================================
; HOSTILE - the regime's navy. Libyan-supplied Soviet pattern craft.
;
; Gun armed only, verified with tools-units.py arsenal:
;   wp_pt_p6      25mm 2M-3   x1600     (no torpedoes in this game)
;   wp_pt_stenka  AK230 30mm  x10000  + noisemakers
;   wp_pt_p4      14.5mm 2M-5 x1200
; So the script's "light torpedoes" is not available on these hulls -
; the threat to the submarine is massed autocannon at close range, which
; is what the briefing now says.
;
; PHASE 1 - the blockade. Four hulls in a stationary line abreast across
; the channel mouth at Z 24..25.5, spaced 4 NM, radars radiating.
; Deliberately NOT in a formation: a formation would station-keep them

; ---------- forecast ----------
StartForecast=CONTRACT WEATHER SUMMARY - ZANZIBAR CHANNEL\nVALID: 160600-161800Z JUL 85\nScattered cloud, sea state 2, light northeast monsoon dying off. Visibility unrestricted. Broad daylight, flat water and no place to hide. This one is loud by design.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - CONTRACT 01-C</size>\nRUSTED SPEAR\n<size=24>16 July 1985 - 1000 local</size>\nBody=[ATLAS]: Commander, we have a unique opportunity to expand our capabilities, and for once the client is not paying in cash.\n\nA faction of defecting officers from the local regime's navy has reached out to us. They have hijacked their own boat - an aging Project 641 diesel electric, hull S-311, renamed Nyoka by whoever is now in charge of her. They are trapped. The dictator has bottled them up in the channel behind a blockade of patrol boats. Punch a hole in that blockade, escort them to the deep water drop-off, and the whole crew flies the Phantom Wake flag.\n\nWe need that boat, Commander. Nobody sells us a submarine at a price we can pay.\n\n[E.C.H.O.]: BATHYMETRY ANALYSIS COMPLETE. CHANNEL AVERAGE DEPTH FOUR ZERO METRES. THE TARGET VESSEL CANNOT DIVE TO A SAFE DEPTH WITHOUT PUTTING HER KEEL IN THE SEABED. SHE WILL TRANSIT ON THE SURFACE AT NO BETTER THAN SIXTEEN KNOTS. TACTICAL ASSESSMENT - SHE IS A SITTING DUCK.\n\n[SIREN]: The regime buys its hulls and its flags through Tripoli, so expect Soviet pattern boats - P6 and Stenka classes, cheap and fast. No anti-ship missiles worth the name. But a swarm of autocannon at close range will open that pressure hull like a tin, and they know it.\n\nStealth is not on the table today. Draw their fire, Commander. Be the loudest thing in the channel.\nButtonText=Get underway\nPopupStyle=Intro

Taskforce1StartIntel=Contract 01-C - Break the picket line at the channel mouth, make contact with the defecting Project 641, escort her to NavPoint Zulu. The submarine must not be destroyed.

Taskforce1BlockadeMessage=Title=RADAR - PICKET LINE AHEAD\nBody=[E.C.H.O.]: SURFACE SEARCH CONTACT. FOUR HULLS IN LINE ABREAST ACROSS THE CHANNEL MOUTH, SPACING FOUR MILES, ALL STATIONARY WITH RADARS RADIATING. CLASSIFICATION - TWO STENKA, TWO P6. GUN ARMED ONLY.\n\nTHEY HAVE SEEN US. NO ATTEMPT TO MANOEUVRE. THEY INTEND TO HOLD THE LINE.\n\nADDITIONAL - AIR SEARCH CONTACT BEARING NORTH, ROTARY WING, INBOUND. AIRBORNE THREAT IN APPROXIMATELY ONE FIVE MINUTES.\n\n[ATLAS]: Guns first. Save the missiles for something that shoots back properly.\nButtonText=Engage\nPopupStyle=Notification

Taskforce1BlockadeIntel=Four gun-armed patrol craft holding a stationary picket line across the channel mouth. One regime helicopter inbound from the north.

Taskforce1BlockadeClearMessage=Title=BLOCKADE BROKEN\nBody=[E.C.H.O.]: PICKET LINE DESTROYED. NO SURFACE CONTACTS REMAINING ON THE BARRIER. THE CHANNEL MOUTH IS OPEN.\n\n[ATLAS]: That is the door. The boat is somewhere inside, hugging the west shore with her plant shut down. Go get her, and do not run her over on the way in.\nButtonText=Proceed inbound\nPopupStyle=Notification

Taskforce1RendezvousMessage=Title=RENDEZVOUS - NYOKA IN COMPANY\nBody=[SIREN]: Contact established. That is her - S-311, surfaced, conning tower crowded with men who have burned every bridge they had. They are asking, politely, whether we intend to keep our word.\n\n[ATLAS]: Tell them the contract is signed. Nyoka answers to you now, Commander. She is slow, she is loud, and she cannot dive in this water. Point her at NavPoint Zulu and put your hull between her and anything with a gun.\n\n[E.C.H.O.]: NYOKA WEAPONS SET TO HOLD. HER TORPEDOES ARE COMPANY PROPERTY AS OF THIS MOMENT AND WE ARE NOT SPENDING THEM ON PATROL BOATS.\nButtonText=Take her under escort\nPopupStyle=Notification

Taskforce1RendezvousIntel=Nyoka under Phantom Wake control. Surfaced transit only, maximum sixteen knots. Destination NavPoint Zulu, deep water at the south end of the Pemba Channel.

Taskforce1InterceptMessage=Title=CONTACT - FAST SURFACE CONTACTS FROM THE COAST\nBody=[E.C.H.O.]: MULTIPLE FAST SURFACE CONTACTS INBOUND FROM THE COAST. SPEED THREE FIVE KNOTS. INTERCEPT COURSE CALCULATED.\n\nTHEY ARE IGNORING OUR FLAGSHIP AND TARGETING THE SUBMARINE.\n\n[ATLAS]: Put your ship between them and the sub, Commander! If that pressure hull breaches, we lose our payday!\nButtonText=Acknowledge\nPopupStyle=Notification

Taskforce1SquadronMessage=Title=INTEL - COASTAL SQUADRON UNDER WAY\nBody=[SIREN]: The regime finally worked out what is happening in their own channel. A coastal patrol squadron just left the northern anchorage and they are coming down the Pemba side at speed.\n\nThey will reach the shelf about the time Nyoka does. There is no route around them and no time to take one.\n\n[ATLAS]: Then we do not go around. Hold the water in front of her and keep shooting.\nButtonText=Acknowledge\nPopupStyle=Notification

Taskforce1SquadronIntel=Coastal patrol squadron inbound from the north, three hulls, closing on the deep water shelf.

Taskforce1VictoryMessage=Title=<size=40><color=Lime>CONTRACT FULFILLED</color></size>\nBody=[SIREN]: The sub has reached the shelf. They are diving now. Sonar confirms they are passing one five zero metres and rigged for silent running.\n\nGood job, Commander. That crew will not forget who came through the blockade for them.\n\n[ATLAS]: Contract fulfilled. Let us clean up the remaining trash and get out of here. We have a submarine to inspect.\n\n[E.C.H.O.]: S-311 NYOKA ADDED TO COMPANY ROSTER. NOISY. OBSOLETE. OURS.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1SubLostMessage=Title=<size=40><color=Red>CONTRACT FAILED</color></size>\nBody=Nyoka is gone. Whatever was left of her crew went down with the pressure hull.\n\n[ATLAS]: We were paid in hardware, Commander, and the hardware is on the bottom of a forty metre channel. There is nothing to collect and nobody left to collect it from.\n\n[E.C.H.O.]: THOSE MEN HAD NO FLAG TO GO BACK TO. NEITHER DO WE.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=MISSION FAILED\nBody=Phantom Wake has no hulls left in the water in this sector.\n\nIf there is a next contract, somebody else is running it.\nButtonText=Exit mission\nPopupStyle=Outro

; ---------- objective text ----------
; The three from the script, plus task force survival. Kept deliberately
; short - "destroy the picket line" and "shoot down the helicopter" were
; both cut, because the mission already forces you to do the first and
; the second is optional flavour that does not need a scoreboard entry.
Objective_Rendezvous=Main: Break through the blockade and make contact with the defecting submarine
Objective_EscortSub=Main: Escort Nyoka to NavPoint Zulu
Objective_SubMustSurvive=Main: Nyoka must not be destroyed
Objective_TaskForceMustSurvive=Preserve the task force


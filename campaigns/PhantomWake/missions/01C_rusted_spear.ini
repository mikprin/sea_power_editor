VariantReference=Variant1
TaskForceModeAnchor=True
UnlimitedFuel=False
StationRole=Core
MissionType=NoMission
WeaponStatus=Free
RadarsActive=True
CrewSkill=Trained
SetSelected=True
RelativePositionInNM=10,0,36
Telegraph=3
Heading=195
Waypoints=6,0,28|2,0,22

; =====================================================================
; THE PRIZE - Project 641 Foxtrot, hull S-311, renamed Nyoka by the
; defectors. She is the fee for this contract.
;
; SHE IS AUTHORED AS Taskforce1Submarine1, NOT NeutralSubmarine1.
; That is what makes JoinTaskForce=True legal on her: the field is only
; documented for Taskforce...VesselN / SubmarineN / AircraftN /
; HelicopterN sections. Authoring her Neutral and transferring her to
; Taskforce1 mid-mission put her outside that set, so the boat had to be
; awarded through campaign.ini instead - and every vanilla example of
; TaskForceModeCompletionRewardedUnits is an AIRCRAFT, which is why the
; Foxtrot turned up under the Fixed Wing tab in Task Force Builder.
; JoinTaskForce on a properly named submarine section is the right lever.
;
; Side effect, accepted deliberately: she belongs to the player from
; second one rather than defecting on contact. In exchange the mission
; no longer depends on Action_UnitTransferToTaskforce=Taskforce1, which
; appears nowhere in vanilla, and can no longer be soft-locked by it
; failing. She sits at Telegraph=0 with no Waypoints and her crew "will
; not start engines until they see a Phantom Wake hull" - Trigger4 issues
; the route. The win trigger stays disabled until the rendezvous fires,
; so sending her out alone cannot skip the escort.
;
; CampaignTag is required for Task Force Mode persistence tracking, and
; the JoinTaskForce checklist calls for it explicitly.
;
; OverrideWeaponStatus=Hold per the script - she is not spending company
; torpedoes on patrol boats. Morale 5 so she never breaks and runs.
; IsValuableUnit=True makes friendly AI screen her.
;
; Telegraph table for wp_ss_foxtrot (tools-units.py show wp_ss_foxtrot):
;   T1=3  T2=5  T3=10  T4=13  T5=16 kt. Flank is 16 kt, not the 12 kt in
;   the script draft, so the briefing says sixteen.
; Variant66 is one of the six Libyan-flagged variants (Variant66-71),
; matching the regime's Tripoli supply line.
;
; Position (0,11): mid-channel, 9 NM behind the picket line, verified
; against the coastline read out of the campaign map render.
; =====================================================================
[Taskforce1Submarine1]
Type=wp_ss_foxtrot
VariantReference=Variant66
LoadoutVariant=Default
CampaignTag=wp_ss_foxtrot_Variant66
JoinTaskForce=True
CampaignRepair=True
TaskForceModeIgnoreUnit=True
UnlimitedFuel=False
IdentifySelf=Yes
MissionType=NoMission
WeaponStatus=Hold
OverrideWeaponStatus=Hold
RadarsActive=False
IsValuableUnit=True
CrewSkill=Trained
Morale=5
RelativePositionInNM=0,0,11
Telegraph=0
Nation=libya
Heading=350


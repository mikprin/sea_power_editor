; ---------- forecast ----------
StartForecast=ПОГОДНАЯ СВОДКА ПО КОНТРАКТУ - АРАВИЙСКОЕ МОРЕ, 12N 063E\nДЕЙСТВИТЕЛЬНА: 110200-111000Z АВГ 85\nГлубокая муссонная депрессия точно на маршруте перехода. Сплошная облачность, нижняя кромка ниже тысячи футов, сильный обложной дождь, встроенные грозы. Юго-западный, порывы до сорока пяти узлов. Волнение 7 баллов, толчея, длинная зыбь в борт. Визуальная дальность менее полумили. РЛС надводной обстановки забита помехами от волнения, пассивный гидроакустический комплекс в таком шуме бесполезен. К рассвету ослабление до 4 баллов.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - КОНТРАКТ 02-B</size>\nКОНВОЙ В ШТОРМ\n<size=24>11 августа 1985 - 03:40 местного</size>\nBody=<color=SandyBrown>АТЛАС</color>: Командир, я ненавижу такие контракты.\n\nУ Halcyon Freight Lines четыре гружёных балкера посреди муссонной депрессии и страховщик, который не подпишет переход без вооружённого эскорта рядом. Мы сжигаем собственное топливо, чтобы эти неповоротливые баржи не снесло на рифы. Волнение моря превышает все допустимые нормы нашего же наставления. Вскроем корпус - чинить будем за свой счёт.\n\n<color=Aqua>E.C.H.O.</color>: ПРЕДУПРЕЖДЕНИЕ. ШУМ ВОЛН БЛОКИРУЕТ ПАССИВНЫЙ СОНАР. НАДВОДНАЯ КАРТИНА ЗАБИТА ПОМЕХАМИ ДО ШЕСТИ МИЛЬ. МЫ СЛЕПЫ И ГЛУХИ.\n\n<color=SandyBrown>АТЛАС</color>: Снизьте скорость эскадры. Держитесь ближе к конвою и не теряйте их с планшета. Конвой идёт средним ходом, пятнадцать узлов, и никаких сигналов, которые вы услышите, они подавать не будут. Потеряем их в этом - провалим контракт, а никто даже не выстрелит.\n\nДоведите их до точки NavPoint Halcyon. Четыре судна вошли, четыре вышли. Вся работа.\nButtonText=Начать движение\nPopupStyle=Intro

StartIntel=Контракт 02-B - Провести четыре гружёных балкера конвоя Halcyon на север до точки NavPoint Halcyon. Все четыре должны дойти на плаву. Волнение 7 баллов, видимость менее полумили, гидроакустика неработоспособна.

Taskforce1BeaconMessage=Title=ПЕРЕХВАТ РАДИОСИГНАЛА - 156.8 МГЦ\nBody=<color=Aqua>E.C.H.O.</color>: ПЕРЕХВАТ РАДИОСИГНАЛА. ЧАСТОТА 156.8 МЕГАГЕРЦ. АНАЛИЗ... ЭТО АВАРИЙНЫЙ РАДИОБУЙ. КТО-ТО ТЕРПИТ БЕДСТВИЕ В ПЯТИ МИЛЯХ К ОСТУ.\n\nПЕЛЕНГ И ДАЛЬНОСТЬ ВЫДАНЫ НА ПЛАНШЕТ. РАЙОН ОБОЗНАЧЕН. ПРИМЕЧАНИЕ - У СПАСАТЕЛЬНОГО ПЛОТА НЕТ РАДИОЛОКАЦИОННОЙ ЗАМЕТНОСТИ, ЗАСЛУЖИВАЮЩЕЙ УПОМИНАНИЯ. В ТАКОМ ВОЛНЕНИИ Я НЕ НАЙДУ ИХ ЗА ВАС. ИСКАТЬ ПРИДЁТСЯ ГЛАЗАМИ.\n\nПОРЯДОК ПОИСКА. СИГНАЛЬЩИКИ БУДУТ НЕПРЕРЫВНО ДАВАТЬ ДАЛЬНОСТЬ ДО БЛИЖАЙШЕГО ПЛОТА. ЭТО ДАЛЬНОСТЬ БЕЗ ПЕЛЕНГА - ИДИТЕ ПРЯМЫМ ГАЛСОМ И СЛЕДИТЕ ЗА ЦИФРОЙ. ГДЕ ОНА ПЕРЕСТАЛА ПАДАТЬ И ПОШЛА ВВЕРХ, ПЛОТ НА ТРАВЕРЗЕ. ДВА ГАЛСА РАЗНЫМИ КУРСАМИ ДАЮТ ТОЧКУ. ВСЕ ПЛОТЫ ВНУТРИ ОБОЗНАЧЕННОГО КРУГА.\n\n<color=SandyBrown>АТЛАС</color>: Игнорируйте. Мы не служба спасения, мы наёмники. Нам никто не платит за то, чтобы подставлять борт такой волне ради чужих матросов.\n\n<color=Orchid>СИРЕНА</color>: Минутку, Атлас. По моим каналам передают, что в этом квадрате пару часов назад пропал танкер компании PetroChem Holdings. У них очень глубокие карманы, командир. Если мы вытащим их людей из воды, мы получим не только щедрую премию, но и репутацию в логистических кругах, которую за деньги не купишь.\n\n<color=SandyBrown>АТЛАС</color>: ...Ладно. Но если вы разобьёте мой фрегат о волну, пытаясь выловить плот при семи баллах, ремонт вычту из вашей доли.\nButtonText=Принято\nPopupStyle=Notification

BeaconIntel=Перехвачен аварийный радиобуй на 156.8 МГц, пять миль к осту от маршрута. Предположительно выжившие с танкера PetroChem Holdings, пропавшего в этом квадрате. Плоты практически не дают радиолокационной отметки, и модель у них появляется только на визуальной дистанции - отделите корабль и осматривайте обозначенный район глазами. Сигнальщики дают непрерывную дальность до ближайшего плота без пеленга: идите прямыми галсами, отмечайте, где дальность перестала уменьшаться, и пересеките два галса разными курсами. Конвой при этом нельзя оставлять без прикрытия.

Taskforce1RaftMessage=Title=ВИЗУАЛЬНЫЙ КОНТАКТ - СПАСАТЕЛЬНЫЙ ПЛОТ\nBody=<color=Aqua>E.C.H.O.</color>: ВИЗУАЛЬНЫЙ КОНТАКТ ПОДТВЕРЖДЁН. ОБНАРУЖЕН СПАСАТЕЛЬНЫЙ ПЛОТ. В НЕПОСРЕДСТВЕННОЙ БЛИЗОСТИ ОЦЕНОЧНО ЕЩЁ ПЛОТЫ, РАЗНЕСЕНЫ ЗЫБЬЮ. ЖИЗНЕННЫЕ ПОКАЗАТЕЛИ НЕСТАБИЛЬНЫ. ВЕРОЯТНО ПЕРЕОХЛАЖДЕНИЕ.\n\nМАРКИРОВКА СООТВЕТСТВУЕТ КОРПУСУ КОМПАНИИ PETROCHEM HOLDINGS. ТАНКЕРА БОЛЬШЕ НЕТ.\n\n<color=Orchid>СИРЕНА</color>: Подходите осторожно, командир. При такой зыби один неверный маневр - и ваш винт превратит их плот в щепки. Подходите малым ходом, гасите инерцию и дайте им подойти самим. И осмотритесь, прежде чем уходить - все вместе они не будут.\nButtonText=Принято\nPopupStyle=Notification

RaftIntel=Выжившие обнаружены. Подойти на сто метров и остановить машины, чтобы принять их на борт. После подъёма одного плота отсчёт дальности переключается на следующий ближайший - работайте по одному. Поднятые из воды люди засчитываются компании на разборе в любой момент миссии. Следите за винтами - плот наезда не переживёт.

Taskforce1RaftsAboardMessage=Title=ВЫЖИВШИЕ НА БОРТУ\nBody=<color=Aqua>E.C.H.O.</color>: ВСЕ ПЛОТЫ В РАЙОНЕ УЧТЕНЫ. ВЫЖИВШИЕ ВНИЗУ, ОКАЗЫВАЕТСЯ ПОМОЩЬ.\n\n<color=Orchid>СИРЕНА</color>: Это все, кто был у PetroChem в воде сегодня ночью, командир. Их дежурный уже проснулся и спрашивает, кто мы такие.\n\n<color=SandyBrown>АТЛАС</color>: Возвращайтесь к конвою. У нас всё ещё четыре баржи, которые надо отсюда вывести, а за доброе дело контракт не платит.\nButtonText=Вернуться к конвою\nPopupStyle=Notification

Taskforce1BeaconLostMessage=Title=БУЙ ЗАМОЛЧАЛ\nBody=<color=Aqua>E.C.H.O.</color>: БУЙ НА 156.8 ПРЕКРАТИЛ ПЕРЕДАЧУ. НЕСУЩЕЙ НЕТ. СОРОК ПЯТЬ МИНУТ НЕПРЕРЫВНОЙ ПЕРЕДАЧИ, ЗАТЕМ ТИШИНА. НАИБОЛЕЕ ВЕРОЯТНАЯ ПРИЧИНА - РАЗРЯД БАТАРЕИ.\n\nРАЙОН НЕ СМЕЩАЕТСЯ, ПЛОТЫ ДАЛЕКО НЕ УНОСИТ. ОНИ ВСЁ ЕЩЁ ТАМ. ПРОСТО ТЕПЕРЬ ВЫ ИЩЕТЕ БЕЗ СИГНАЛА.\n\n<color=SandyBrown>АТЛАС</color>: Каждая минута там - это минута, когда у конвоя на один корпус меньше, командир. Решать вам. Как и всегда.\n\n<color=Orchid>СИРЕНА</color>: Счёт нам за это не выставят в любом случае. И запомнят это тоже в любом случае.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1StragglerMessage=Title=КОНВОЙ - САУЗЕРН ГАННЕТ ОТСТАЁТ\nBody=<color=Aqua>E.C.H.O.</color>: САУЗЕРН ГАННЕТ ТЕРЯЕТ ХОД. ЭТО САМЫЙ МАЛЫЙ КОРПУС В КОЛОННЕ, И ЗЫБЬ БЬЁТ ЕГО СИЛЬНЕЕ ВСЕХ. КАПИТАН ДОКЛАДЫВАЕТ ВИБРАЦИЮ ВАЛА И СНИЗИЛ ХОД ДО САМОГО МАЛОГО.\n\nПРИ ТАКОМ ТЕМПЕ РАЗРЫВ С КОЛОННОЙ СОСТАВИТ НЕСКОЛЬКО МИЛЬ.\n\n<color=SandyBrown>АТЛАС</color>: Разумеется. Оставьте с ним кого-нибудь, командир - корпус, который его рулевой видит, это корпус, по которому он держится. Остальная колонна идёт дальше. Три судна ради одного мы не остановим.\nButtonText=Принято\nPopupStyle=Notification

Taskforce1StragglerFixedMessage=Title=КОНВОЙ - САУЗЕРН ГАННЕТ НА ХОДУ\nBody=<color=Aqua>E.C.H.O.</color>: САУЗЕРН ГАННЕТ ДОКЛАДЫВАЕТ, ЧТО ВАЛ В НОРМЕ. УВЕЛИЧИВАЕТ ХОД ДО ПОЛНОГО И БУДЕТ ДОГОНЯТЬ КОЛОННУ.\n\n<color=SandyBrown>АТЛАС</color>: Хорошо. Верните его в строй и держите там.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1WeatherMessage=Title=ПОГОДА - ВЫХОДИМ ИЗ ЯЧЕЙКИ\nBody=<color=Aqua>E.C.H.O.</color>: ДАВЛЕНИЕ РАСТЁТ. ВОЛНЕНИЕ ПАДАЕТ. МЫ ВЫХОДИМ ЧЕРЕЗ СЕВЕРНУЮ КРОМКУ ДЕПРЕССИИ.\n\nНАДВОДНАЯ КАРТИНА ВОССТАНАВЛИВАЕТСЯ. ВИДИМОСТЬ УЛУЧШАЕТСЯ. РАССВЕТ ПРИМЕРНО ЧЕРЕЗ ЧАС.\n\n<color=SandyBrown>АТЛАС</color>: Давно пора. Соберите конвой в строй, пока кто-нибудь не разглядел, как мы тут выглядим.\nButtonText=Продолжить\nPopupStyle=Notification

Taskforce1VictoryMessage=Title=<size=40><color=Lime>КОНТРАКТ ВЫПОЛНЕН</color></size>\nBody=<color=SandyBrown>АТЛАС</color>: Конвой вышел из зоны шторма. Четыре корпуса вошли, четыре вышли, ни одной вскрытой обшивки, включая нашу. Заказчик перевёл оплату.\n\n<color=Orchid>СИРЕНА</color>: Страховщик Halcyon запросил наши реквизиты - это вежливая форма намерения нанять нас снова.\n\n<color=SandyBrown>АТЛАС</color>: Хорошо. Курс на базу, командир, и пусть кто-нибудь поставит кофе.\nButtonText=Покинуть миссию\nPopupStyle=Outro

Taskforce1VictoryRescueMessage=Title=<size=40><color=Lime>КОНТРАКТ ВЫПОЛНЕН</color></size>\nBody=<color=SandyBrown>АТЛАС</color>: Конвой вышел из зоны шторма. Четыре корпуса вошли, четыре вышли. Заказчик перевёл оплату.\n\n<color=Orchid>СИРЕНА</color>: И PetroChem Holdings только что перевела нам бонус за своих людей. Их капитан лежит у вас в лазарете и обещает скидку в их доках, и он не шутит - больше ему нам дать нечего, и он это знает.\n\nКомандир, нам за это сегодня не платили. Мы сделали это всё равно, и на этом побережье долгая память на истории обоих сортов.\n\n<color=SandyBrown>АТЛАС</color>: Главное, что хорошим парням хорошо платят. Курс на базу.\nButtonText=Покинуть миссию\nPopupStyle=Outro

Taskforce1ConvoyLostMessage=Title=<size=40><color=Red>КОНТРАКТ РАСТОРГНУТ</color></size>\nBody=<color=SandyBrown>АТЛАС</color>: Мы потеряли судно из конвоя.\n\nHalcyon не платит за эскорт корпусу, который ушёл на дно под этим самым эскортом, а их страховщик ближайшие два года будет выяснять, чем именно вооружённое охранение занималось в этот момент.\n\nКонтракт аннулирован. Оплаты нет.\nButtonText=Покинуть миссию\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=У Phantom Wake не осталось кораблей на плаву в этом секторе.\n\nЕсли и будет следующий контракт, вести его будет кто-то другой.\nButtonText=Покинуть миссию\nPopupStyle=Outro


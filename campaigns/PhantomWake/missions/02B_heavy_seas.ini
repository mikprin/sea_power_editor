; =====================================================================
; THE CLIENT - HALCYON CONVOY
;
; Four loaded merchants in a loose column on a due north track, from
; Z=-9 up to the NavPoint at Z=+9. Neutral rather than Taskforce1 for
; two reasons: it matches MV Vagabond in 01_rusted_sea, and it keeps
; the "task force wiped out" check (HasNoUnitsOfType Taskforce1 Vessel,
; Trigger13) honest - four merchants on the player's side would keep
; that condition false forever.
;
; No formation section. Each hull carries its own parallel waypoint
; track at its own X offset, which survives Southern Gannet being
; re-tasked twice by Trigger7 and Trigger8; a formation would not.
;
; Telegraph=3 is ahead standard, about 15 kt, against a 16.5 kt hull
; maximum on the bulkers. 15.8 NM from the tail of the column to the
; edge of the exit circle is about 63 minutes of straight sailing.

; =====================================================================
; TRIGGERS
;
; Timeline, all times absolute seconds from mission start:
;      5   intro, forecast
;    300   beacon intercept, rafts spawn, datum circle drawn
;    900   Southern Gannet loses her shaft
;   1740   Southern Gannet gets it back
;   3000   beacon battery dies - flavour only, nothing fails
;   ~2300  convoy clears the storm cell (positional, not timed)
;   ~3900  tail of the convoy reaches NavPoint Halcyon, mission ends
;
; There is no hidden deadline on the rescue any more. The only clock is
; the convoy itself: it sails at fifteen knots to the exit circle with
; or without an escort, and the mission ends when it arrives. A hull
; detached at the intercept has about eight miles to run and then has to
; work a 1.5 NM datum by eye, all of it while Southern Gannet is dropping
; out of the column behind him. One force, two places, and the cost of
; the rescue is coverage rather than an invisible countdown.
; =====================================================================

[Trigger1]
Name=Start
Condition_Start_Type=Time
Condition_Start_Time=5
ConditionsCompleted=<Start>
Action_Taskforce1_Message=Taskforce1StartMessage
Action_Taskforce1_Intel=StartIntel
Action_Forecast=StartForecast

; Spawns the rafts and un-hides the rescue objective in the same beat.
; Nothing before this point mentions survivors - not the campaign entry,
; not the intro popup, not the objective list, not a map symbol. The
; secondary line is meant to arrive as a surprise five minutes in.
[Trigger2]
Name=Distress beacon intercepted
Condition_Beacon_Type=Time
Condition_Beacon_Time=300
ConditionsCompleted=<Beacon>
Action_Taskforce1_Message=Taskforce1BeaconMessage
Action_Taskforce1_Intel=BeaconIntel
Action_Taskforce1_VoiceMessage=NewTaskReceived
Action_SetEnabledStatus=True
Action_Units=NeutralVessel6,NeutralVessel7,NeutralVessel8
Action_ObjectivesUnHide=RescueSurvivors
Action_EnableTriggers=Trigger3
Action_VariableSet=02BBeaconHeard,True

; Map furniture only. A Generic condition with a position, a radius and
; an AreaLabel and no Units is how vanilla draws a labelled circle on
; the tactical map with no logic attached (08A Pathfinders Trigger6).
; It is Disabled=True so the circle does not exist on the plot until
; Trigger2 enables it - same mechanism 01B_safe_heaven uses to keep its
; alert-sweep barriers off the map until the client is aboard. This
; trigger has no actions at all and is not supposed to do anything.
[Trigger3]
Name=Beacon datum - search area marker
Disabled=True
Condition_Datum_Type=Generic
Condition_Datum_PositionNM=5,0,-7
Condition_Datum_AreaRadiusNM=1.5
Condition_Datum_AreaLabel=SearchDatumAreaLabel
Condition_Datum_AreaDisplaySide=Blue
ConditionsCompleted=<Datum>

; The rescue gate. UnitDetected rather than a circle, because the rafts
; are Undetectable=True on radar - the only way this condition can go
; true is a real visual acquisition by whatever the player sent, ship
; or helicopter, and it does not care which section name that unit has.
; Precedent for _Taskforce=Neutral on a neutral unit: 01A_sweeping_net
; Trigger7.
[Trigger4]
Name=Life raft sighted
Condition_RaftSeen_Type=UnitDetected
Condition_RaftSeen_Taskforce=Neutral
Condition_RaftSeen_Units=NeutralVessel6,NeutralVessel7,NeutralVessel8
Condition_RaftSeen_MinimumUnits=1
ConditionsCompleted=<RaftSeen>
Action_Taskforce1_Message=Taskforce1RaftMessage
Action_Taskforce1_Intel=RaftIntel
Action_Taskforce1_VoiceMessage=ObjectiveComplete
Action_ObjectivesCompleted=RescueSurvivors
Action_ObjectivesUnHide=SurvivorsAboard
Action_DisableTriggers=Trigger5
Action_VariableSet=02BSurvivorsFound,True

; PLAYTEST FIX 3 - THIS USED TO FAIL THE OBJECTIVE. IT NO LONGER DOES.
; First build ended the rescue window hard at 3300 s: RescueSurvivors
; was marked Failed and SurvivorsAboard was cancelled outright. A
; playtest that went on to find and recover all three rafts after the
; deadline therefore got the campaign points from the engine's own CSAR
; accounting and no objective credit at all, which is the worst of both
; readings - the player did the thing and the mission said he had not.
;
; The beacon going quiet is now an escalation and nothing else. It takes
; the signal away and leaves the rafts exactly where they are, so the
; search gets harder rather than pointless. Both rescue objectives stay
; live for the rest of the mission and can still be completed at any
; time before the convoy reaches the NavPoint.
;
; That leaves the mission with exactly one clock on the rescue, and it
; is a clock the player can see: the convoy is sailing to the exit
; circle whether or not anybody is escorting it, and Trigger10/Trigger11
; end the mission when it gets there. Detaching a hull costs coverage,
; and coverage is the price - not an invisible countdown.
;
; Still disabled by Trigger4, so a player who found the rafts early is
; never told the beacon died.
[Trigger5]
Name=Beacon goes quiet - searching without a signal
Condition_Deadline_Type=Time
Condition_Deadline_Time=3000
ConditionsCompleted=<Deadline>
Action_Taskforce1_Message=Taskforce1BeaconLostMessage
Action_Taskforce1_VoiceMessage=NewIntelReceived
Action_VariableSet=02BBeaconSilent,True

; STILL SPECULATIVE - the assumption is that a raft picked up by a ship
; is removed from the world in a way UnitDestroyed can see. The first
; playtest could not settle it, because Trigger5 had already cancelled
; this objective before the rafts were recovered; with that cancel gone
; (see PLAYTEST FIX 3) the next run will answer it either way.
;
; If it is wrong, this trigger simply never fires, SurvivorsAboard stays
; un-completed, and nothing else in the mission is affected - the
; primary rescue objective was already completed by Trigger4 and the
; CSAR points are awarded by the engine at debrief regardless. Playtest
; confirmed that half: seventeen souls came back as 3 campaign points.
; It is a bonus line, priced as one.
;
; Known false positive: running a raft down also destroys it. Both
; outcomes look identical to the condition, which is why the objective
; is worth 15 points and not 50.
[Trigger6]
Name=Datum cleared - all rafts recovered
Condition_RaftsGone_Type=UnitDestroyed
Condition_RaftsGone_Units=NeutralVessel6,NeutralVessel7,NeutralVessel8
Condition_RaftsGone_MinimumUnits=3
ConditionsCompleted=<RaftsGone>
Action_Taskforce1_Message=Taskforce1RaftsAboardMessage
Action_Taskforce1_VoiceMessage=ObjectiveComplete
Action_ObjectivesCompleted=SurvivorsAboard
Action_VariableSet=02BAllSurvivorsAboard,True

; Straggler, part one. At T+900 Southern Gannet is around Z=-7.0, so the
; first waypoint is set just ahead of her at Z=-6.9 and carries the
; telegraph change; she reaches it in well under a minute and drops to
; about 5 kt. The second waypoint keeps her on the original track so the
; re-task cannot steer her out of the mission.
[Trigger7]
Name=Southern Gannet loses her shaft
Condition_Breakdown_Type=Time
Condition_Breakdown_Time=900
ConditionsCompleted=<Breakdown>
Action_Taskforce1_Message=Taskforce1StragglerMessage
Action_Units=NeutralVessel4
Action_UnitWaypoints=0,0,-6.9/SetTelegraph,1|0,0,12

; Straggler, part two. At T+1740 she is around Z=-5.9 after fourteen
; minutes at steerage way, roughly 3.5 NM astern of the column. Telegraph
; 5 is her 18 kt maximum against the column's 15, so she closes the gap
; over the remaining leg and the convoy arrives more or less together.
[Trigger8]
Name=Southern Gannet under way again
Condition_ShaftFixed_Type=Time
Condition_ShaftFixed_Time=1740
ConditionsCompleted=<ShaftFixed>
Action_Taskforce1_Message=Taskforce1StragglerFixedMessage
Action_Units=NeutralVessel4
Action_UnitWaypoints=0,0,-5.7/SetTelegraph,5|0,0,12

; Positional rather than timed so it lands on where the convoy actually
; is, not on where it was supposed to be. AreaDisplaySide=None - this is
; a weather beat, not a place the player needs to steer to.
[Trigger9]
Name=Clearing the storm cell
Condition_OutOfCell_Type=UnitsInTheArea
Condition_OutOfCell_PositionNM=0,0,3
Condition_OutOfCell_AreaRadiusNM=2.5
Condition_OutOfCell_AreaDisplaySide=None
Condition_OutOfCell_Units=NeutralVessel1
ConditionsCompleted=<OutOfCell>
Action_Taskforce1_Message=Taskforce1WeatherMessage
Action_SetSeaState=4
Action_SetRain=False
Action_SetThunderstorm=False
Action_SetClouds=Broken_3

; Victory. Gated on Southern Gannet because she is the tail of the
; column in every branch - she starts last, she is the one that breaks
; down, and she is the one that has to catch up. If she is inside the
; circle then everything ahead of her already is, and if she has been
; sunk then Trigger12 has already ended the mission.
;
; Trigger10 and Trigger11 are the same arrival with two different
; outros, split on whether the player went for the survivors. They are
; mutually exclusive by construction.
;
; VariableCheck reading a variable set earlier in the SAME mission is
; not something vanilla does - 09 Shadows off Palawan reads one written
; by a previous mission. If it turns out not to work, this trigger fires
; instead of Trigger11 and the player gets the plain outro. That is a
; softer failure than any other way of branching this.
[Trigger10]
Name=Convoy delivered - contract fulfilled
Condition_ConvoyOut_Type=UnitsInTheArea
Condition_ConvoyOut_PositionNM=0,0,9
Condition_ConvoyOut_AreaRadiusNM=4
Condition_ConvoyOut_AreaDisplaySide=None
Condition_ConvoyOut_Units=NeutralVessel4
Condition_Rescued_Type=VariableCheck
Condition_Rescued_Variable=02BSurvivorsFound
ConditionsCompleted=<ConvoyOut> AND NOT <Rescued>
Action_Taskforce1_Message=Taskforce1VictoryMessage
Action_Taskforce1_VoiceMessage=MissionComplete
Action_EndMission=True
Action_Victory=Taskforce1
Action_ObjectivesCompleted=DeliverConvoy,ConvoyIntact,TaskForceMustSurvive
Action_VariableSet=02BConvoyDelivered,True

[Trigger11]
Name=Convoy delivered with survivors aboard - contract fulfilled
Condition_ConvoyOutB_Type=UnitsInTheArea
Condition_ConvoyOutB_PositionNM=0,0,9
Condition_ConvoyOutB_AreaRadiusNM=4
Condition_ConvoyOutB_AreaLabel=ConvoyExitAreaLabel
Condition_ConvoyOutB_AreaDisplaySide=Blue
Condition_ConvoyOutB_Units=NeutralVessel4
Condition_RescuedB_Type=VariableCheck
Condition_RescuedB_Variable=02BSurvivorsFound
ConditionsCompleted=<ConvoyOutB> AND <RescuedB>
Action_Taskforce1_Message=Taskforce1VictoryRescueMessage
Action_Taskforce1_VoiceMessage=MissionComplete
Action_EndMission=True
Action_Victory=Taskforce1
Action_ObjectivesCompleted=DeliverConvoy,ConvoyIntact,TaskForceMustSurvive
Action_VariableSet=02BConvoyDelivered,True

; The only way to lose the convoy in a mission with no enemy is to do it
; yourself, which is the point - the sea state is high enough that a
; close escort station is a real decision.
[Trigger12]
Name=Convoy ship lost - contract terminated
Condition_ShipLost_Type=UnitDestroyed
Condition_ShipLost_Units=NeutralVessel1,NeutralVessel2,NeutralVessel3,NeutralVessel4
Condition_ShipLost_MinimumUnits=1
ConditionsCompleted=<ShipLost>
Action_Taskforce1_Message=Taskforce1ConvoyLostMessage
Action_Taskforce1_VoiceMessage=MissionFail
Action_EndMission=True
Action_Victory=Taskforce2
Action_ObjectivesFailed=ConvoyIntact,DeliverConvoy
Action_ObjectivesCancel=TaskForceMustSurvive,RescueSurvivors,SurvivorsAboard
Action_VariableSet=02BConvoyShipLost,True

[Trigger13]
Name=Task force wiped out - defeat
Condition_NoHulls_Type=HasNoUnitsOfType
Condition_NoHulls_Taskforce=Taskforce1
Condition_NoHulls_UnitType=Vessel
ConditionsCompleted=<NoHulls>
Action_Taskforce1_Message=Taskforce1TaskForceLostMessage
Action_EndMission=True
Action_Victory=Taskforce2
Action_ObjectivesFailed=TaskForceMustSurvive,DeliverConvoy
Action_ObjectivesCancel=ConvoyIntact,RescueSurvivors,SurvivorsAboard

[Taskforce1_Objectives]
DeliverConvoy=60,-60,Complete,Main
ConvoyIntact=20,-60,Complete,Main
TaskForceMustSurvive=10,-10,Complete
RescueSurvivors=25,0,Complete,Hidden
SurvivorsAboard=15,0,Complete,Hidden

[CampaignVariables]
02BBeaconHeard=False
02BSurvivorsFound=False
02BAllSurvivorsAboard=False
02BBeaconSilent=False
02BConvoyDelivered=False
02BConvoyShipLost=False

[BackgroundData]
NumberOfBackgroundCityFiles=2
BackgroundCityFile1_Path=\campaigns\britishisles_cities.ini
BackgroundCityFile2_Path=\campaigns\cities.ini
NumberOfBackgroundAirportFiles=1

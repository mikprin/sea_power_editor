; =====================================================================
; THE SURVIVORS - MT BARRA HEAD, PETROCHEM HOLDINGS
;
; all_life_raft* are real vessel units in share/vessels/. They are
; marked HideIn=MissionEditor, so the editor will never show them and
; they can only be placed by hand-editing this file - which is exactly
; what this campaign already does for everything else.
;
; Why they work for this:
;   - [SensorData] Undetectable=True. No radar return at all. The only
;     way to find one is VisualIdentificationRange=5.0 NM, and that is
;     a fair-weather figure - at night in rain it is far shorter. The
;     search has to be done by eye, which is what the script asked for.
;   - MaxForwardVelocity=0. They do not move, so no waypoints, and a
;     static search circle is honest rather than a lie about drift.
;   - [AI] Role=Deco,LifeRaft and CollectScoreValue is documented in the
;     unit file itself as "value for mission score when unit is
;     collected by another unit. In case of life rafts - per person."
;     So the engine already knows how to pick these up, and the campaign
;     already has CSARPointModifier=5 in campaign.ini to convert
;     recovered survivors into campaign points. No extra scripting is
;     needed for the reward - the script was right about that.
;
; TransportCapacity is 8 on all three, so twenty four souls if the
; player clears the datum. That is why E.C.H.O. never quotes a headcount
; for the whole datum: the number the player actually recovers is the
; number that goes in the debrief. Confirmed in playtest - seventeen
; souls recovered came back as 3 campaign points against
; CSARPointModifier=5 in campaign.ini, so the engine is doing exactly
; what the unit file's CollectScoreValue comment says it does.
;
; PLAYTEST FIX 1 - THE SEARCH WAS TOO BIG.
; First build scattered these across a 2.5 NM datum with spreads of 0.9
; and 1.6 NM. A fast boat got on scene early and still could not clear
; it inside the window. The reason is in the unit file: LODLevels=1 with
; LOD1Distance=2.5, so a raft has NO MESH AT ALL beyond 2.5 NM, and in
; night plus heavy rain the real spotting range is a fraction of that.
; Datum radius is now 1.5 NM and the spreads are 0.5 / 0.5 / 0.7, which
; puts every raft inside roughly a mile and a half of the centre.
;
; PLAYTEST FIX 2 - THE ONE MAN RAFT HAD NO MODEL.
; all_life_raft_single is the only one of the three whose [Models]
; section has no AssetBundle* keys at all - just a ResourcesFolder path
; to ships/one_man_raft/. The other two carry a full AssetBundleMesh /
; AssetBundleMaterial / AssetBundleMeshHullCollider set. Playtest
; reported one raft that could be collected but never rendered, so the
; single is swapped out for the closed canopy all_life_raft. That also
; keeps three visually distinct silhouettes on the datum - open raft,
; open raft, closed canopy - and raises the datum from 17 souls to 24.
;
; Disabled=True until Trigger2. They exist from the beacon intercept,
; not from mission start, so a player who never gets the radio call
; cannot stumble over them first and spoil the beat. RandomSpawn keeps
; the datum from being memorised across replays.
;
; They are Neutral vessels, which matters twice: they are NOT in the
; convoy loss check (Trigger12), and they are NOT on Taskforce1, so
; they cannot keep Trigger13's HasNoUnitsOfType from firing.
; =====================================================================
[NeutralVessel6]
Type=all_life_raft_open
VariantReference=Default
Disabled=True
UnlimitedFuel=False
MissionType=NoMission
WeaponStatus=Hold
OverrideWeaponStatus=Hold
RadarsActive=False
CrewSkill=Green
Morale=1
RelativePositionInNM=5.35,0,-6.62
RandomSpawnCenter=5.35,0,-6.62
RandomSpawnRange=0.1,0.5
Heading=45

[NeutralVessel7]

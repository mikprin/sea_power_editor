; =====================================================================
; ENVIRONMENT
;
; Open Arabian Sea, deep water, no land inside 200 NM in any direction -
; deliberately chosen so nothing in this mission can be solved or broken
; by terrain. 11 August 1985 is peak southwest monsoon, which is the one
; time and place in this campaign where sea state 7 is not a contrivance.
;
; Start 0340 local. First light is around 0600, so the whole passage is
; run in the dark and the storm easing at Trigger9 lands just as the sky
; starts to go grey. Weather= is the [Environment] spelling of the same
; thing Action_SetRain / Action_SetThunderstorm control at runtime
; (dev doc: MissionFileInformation.ini, "Special Weather").
;
; Fog is deliberately NOT set. The dev doc notes fog "really hurts
; clouds", and this mission asks the player to find a 3 m raft by eye -
; rain and night already cut visual range hard enough.
; =====================================================================
[Environment]
Date=1985,8,11
Time=3,40
ConvertTimeToLocal=False
SeaState=7
Clouds=Overcast
Weather=Rain,Thunderstorm
WindDirection=SW
MapCenterLatitude=12.5
MapCenterLongitude=63
LoadBackgroundData=False

; =====================================================================
; MISSION
;
; NOTE - THERE ARE NO TASKFORCE2 UNITS IN THIS FILE, ON PURPOSE.
; The script for this contract is explicit that the storm is the only
; opponent. EnemyTaskforce= is still declared because every trigger that
; ends the mission badly needs a side to hand the victory to, and that
; is the only thing the value is used for here.
;
; Everything that generates pressure is non-combat:
;   - a 16 NM passage the convoy sails at 15 kt whatever the player does
;   - a distress datum 5 NM off track with a hard beacon deadline
;   - a straggler that drops out of the column halfway across
; The player has to spend one hull on the rescue and still cover four
; merchants, and both clocks run at once.
; =====================================================================
[Mission]
Difficulty=0
PlayerTaskforce=Taskforce1
EnemyTaskforce=Taskforce2
NumberOfTaskforce1Vessels=2
NumberOfNeutralVessels=8
NumberOfTriggers=13

; =====================================================================
; PLAYER
;
; Same section layout as 02_pandoras_box:
;   Vessel1  TaskForceModeAnchor=True          - generator seed
;   Vessel2  TaskForceModePlaceholderUnit=True - removed at launch
;
; No trigger in this file has a positional condition on a player unit.
; That is deliberate and it is the whole reason the rescue works: the
; player may bring one hull or six, may detach any of them, and may do
; the search with a helicopter instead. Gating on Taskforce1Vessel1
; would silently break every one of those choices (CLAUDE.md section 14
; - triggers referencing a vessel slot the player did not fill).
; =====================================================================
[Taskforce1Vessel1]
Type=ir_pf_bayandor
VariantReference=Variant1
TaskForceModeAnchor=True
UnlimitedFuel=False
StationRole=Core
MissionType=NoMission
WeaponStatus=Tight
RadarsActive=True
CrewSkill=Trained
SetSelected=True
RelativePositionInNM=-2.5,0,-10
Telegraph=3
Heading=0
Waypoints=-2.5,0,0|-2.5,0,9

[Taskforce1Vessel2]
Type=wp_pt_stenka
VariantReference=Variant1
TaskForceModePlaceholderUnit=True
UnlimitedFuel=False

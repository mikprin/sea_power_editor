; ---------- forecast ----------
StartForecast=CONTRACT WEATHER SUMMARY - ARABIAN SEA, 12N 063E\nVALID: 110200-111000Z AUG 85\nSevere monsoon depression sitting directly on the transit lane. Overcast, base below one thousand feet, heavy continuous rain, embedded thunderstorms. Southwest gusting forty five knots. Sea state 7, confused, long swell on the beam. Visibility under half a mile by eye. Surface search radar degraded by sea clutter and passive sonar is worthless in this much noise. Easing to sea state 4 toward first light.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - CONTRACT 02-B</size>\nHEAVY SEAS\n<size=24>11 August 1985 - 0340 local</size>\nBody=<color=SandyBrown>ATLAS</color>: Commander. I hate contracts like this one.\n\nHalcyon Freight Lines has four loaded bulk carriers in the middle of a monsoon depression and an underwriter who will not cover the crossing without an armed escort riding shotgun. So we are burning our own fuel to make sure somebody else's barges do not get set down on a reef. The sea state is over every limit in our own operating manual. If we open a hull plate out here, we pay for the yard time ourselves.\n\n<color=Aqua>E.C.H.O.</color>: WARNING. SEA NOISE IS SATURATING THE PASSIVE SONAR. SURFACE SEARCH RETURNS ARE DEGRADED BY CLUTTER OUT TO SIX MILES. WE ARE BLIND AND WE ARE DEAF.\n\n<color=SandyBrown>ATLAS</color>: Take the speed off the squadron. Stay close to the convoy and keep them on the plot. The convoy makes turns for ahead standard, fifteen knots, and they will not be making any signals you can hear. Lose them in this and we have failed the contract without anybody firing a shot.\n\nWalk them out to NavPoint Halcyon. Four ships in, four ships out. That is the whole job.\nButtonText=Get underway\nPopupStyle=Intro

StartIntel=Contract 02-B - Escort four loaded bulk carriers of the Halcyon convoy north to NavPoint Halcyon. All four must arrive afloat. Sea state 7, visibility under half a mile, sonar unusable.

Taskforce1BeaconMessage=Title=RADIO INTERCEPT - 156.8 MHz\nBody=<color=Aqua>E.C.H.O.</color>: RADIO INTERCEPT. FREQUENCY ONE FIVE SIX POINT EIGHT MEGAHERTZ. ANALYSIS... THIS IS AN EMERGENCY POSITION BEACON. SOMEBODY IS IN DISTRESS FIVE MILES TO THE EAST.\n\nBEARING AND RANGE PLOTTED. DATUM MARKED ON YOUR CHART. NOTE - A LIFE RAFT HAS NO RADAR RETURN WORTH THE NAME. IN THIS SEA I CANNOT FIND THEM FOR YOU. THIS WILL HAVE TO BE DONE BY EYE.\n\nSEARCH PROCEDURE. YOUR LOOKOUTS WILL CALL RANGE TO THE NEAREST RAFT CONTINUOUSLY. THAT IS A RANGE WITHOUT A BEARING - RUN A STRAIGHT LEG AND WATCH THE NUMBER. WHERE IT STOPS FALLING AND BEGINS TO RISE, THE RAFT IS ABEAM. TWO LEGS ON DIFFERENT HEADINGS FIX IT. ALL RAFTS ARE INSIDE THE MARKED CIRCLE.\n\n<color=SandyBrown>ATLAS</color>: Ignore it. We are not a rescue service, we are mercenaries. Nobody is paying us to put our hulls beam on to a sea like this for somebody else's crew.\n\n<color=Orchid>SIREN</color>: One moment, Atlas. My channels are carrying a report that a PetroChem Holdings tanker went missing in this square about two hours ago. That company has very deep pockets, Commander. If we pull their people out of the water we do not just get a generous bonus - we get a reputation in the logistics trade that money cannot buy.\n\n<color=SandyBrown>ATLAS</color>: ...Fine. But if you smash my frigate up trying to fish a raft out of a sea state seven, the repair comes out of your share.\nButtonText=Understood\nPopupStyle=Notification

BeaconIntel=Emergency beacon intercepted on 156.8 MHz, five miles east of track. Believed to be survivors from a PetroChem Holdings tanker lost in this square. Rafts have effectively no radar signature and no mesh beyond visual range - detach a unit and search the marked datum by eye. Lookouts call a continuous range to the nearest raft with no bearing: run straight legs and note where the range bottoms out, then cross two legs on different headings. The convoy still has to be covered while you do it.

Taskforce1RaftMessage=Title=VISUAL CONTACT - LIFE RAFT\nBody=<color=Aqua>E.C.H.O.</color>: VISUAL CONTACT CONFIRMED. LIFE RAFT IN THE WATER. FURTHER RAFTS ASSESSED IN THE IMMEDIATE VICINITY, SCATTERED BY THE SWELL. LIFE SIGNS UNSTABLE. EXPOSURE CASUALTIES LIKELY.\n\nREGISTRY MARKINGS CONSISTENT WITH MT BARRA HEAD... CORRECTION. MARKINGS CONSISTENT WITH A PETROCHEM HOLDINGS HULL. THE TANKER IS GONE.\n\n<color=Orchid>SIREN</color>: Approach carefully, Commander. In this swell one bad manoeuvre and your screw turns their raft into splinters. Come alongside slow, take the way off, and let them come to you. Look for the others before you leave - they will not all be together.\nButtonText=Acknowledge\nPopupStyle=Notification

RaftIntel=Survivors located. Close to within a hundred metres and stop engines to take them aboard. Once one raft is aboard the range call switches to the next nearest, so work them one at a time. Recovered survivors are credited to the company at debrief whenever they are taken aboard. Watch your screws - a raft will not survive being run down.

Taskforce1RaftsAboardMessage=Title=SURVIVORS ABOARD\nBody=<color=Aqua>E.C.H.O.</color>: ALL RAFTS ON THE DATUM ACCOUNTED FOR. SURVIVORS ARE BELOW AND UNDER TREATMENT.\n\n<color=Orchid>SIREN</color>: That is every soul PetroChem had in the water tonight, Commander. Their duty officer is already awake and asking who we are.\n\n<color=SandyBrown>ATLAS</color>: Get back on the convoy. We still have four barges to walk out of this and the contract does not pay for the good deed.\nButtonText=Rejoin the convoy\nPopupStyle=Notification

Taskforce1BeaconLostMessage=Title=BEACON SILENT\nBody=<color=Aqua>E.C.H.O.</color>: THE BEACON ON ONE FIVE SIX POINT EIGHT HAS STOPPED TRANSMITTING. NO CARRIER. FORTY FIVE MINUTES OF CONTINUOUS TRANSMISSION, THEN NOTHING. BATTERY EXHAUSTION IS THE MOST LIKELY CAUSE.\n\nTHE DATUM DOES NOT MOVE AND THE RAFTS DO NOT DRIFT FAR. THEY ARE STILL THERE. YOU ARE SIMPLY SEARCHING WITHOUT A SIGNAL NOW.\n\n<color=SandyBrown>ATLAS</color>: Every minute you spend out there is a minute the convoy has one less hull on it, Commander. Your call. It always was.\n\n<color=Orchid>SIREN</color>: Nobody is billing us for this either way. Somebody will remember it either way too.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1StragglerMessage=Title=CONVOY - SOUTHERN GANNET FALLING ASTERN\nBody=<color=Aqua>E.C.H.O.</color>: SOUTHERN GANNET IS LOSING WAY. SHE IS THE SMALLEST HULL IN THE COLUMN AND SHE IS TAKING THE SWELL WORST. HER MASTER REPORTS SHAFT VIBRATION AND HAS REDUCED TO STEERAGE WAY.\n\nSHE WILL OPEN A GAP OF SEVERAL MILES ON THE REST OF THE CONVOY AT THIS RATE.\n\n<color=SandyBrown>ATLAS</color>: Of course she is. Put something back there with her, Commander - a hull she can see is a hull her helmsman steers by. The rest of the column keeps going. We are not stopping three ships for one.\nButtonText=Acknowledge\nPopupStyle=Notification

Taskforce1StragglerFixedMessage=Title=CONVOY - SOUTHERN GANNET UNDER WAY\nBody=<color=Aqua>E.C.H.O.</color>: SOUTHERN GANNET REPORTS THE SHAFT CLEARED. SHE IS INCREASING TO FULL AND WILL CLOSE THE COLUMN.\n\n<color=SandyBrown>ATLAS</color>: Good. Get her back in the column and keep her there.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1WeatherMessage=Title=WEATHER - CLEARING THE CELL\nBody=<color=Aqua>E.C.H.O.</color>: BAROMETER RISING. SEA STATE DROPPING. WE ARE COMING OUT OF THE NORTHERN EDGE OF THE DEPRESSION.\n\nSURFACE SEARCH RETURNS RECOVERING. VISIBILITY IMPROVING. FIRST LIGHT IN APPROXIMATELY ONE HOUR.\n\n<color=SandyBrown>ATLAS</color>: About time. Get the convoy re-formed before somebody sees what we look like out here.\nButtonText=Continue\nPopupStyle=Notification

Taskforce1VictoryMessage=Title=<size=40><color=Lime>CONTRACT FULFILLED</color></size>\nBody=<color=SandyBrown>ATLAS</color>: The convoy is clear of the storm cell. Four hulls in, four hulls out, no plate opened on anybody's ship including ours. The client has transferred payment.\n\n<color=Orchid>SIREN</color>: Halcyon's underwriter has also asked for our details, which is the polite way of saying they intend to hire us again.\n\n<color=SandyBrown>ATLAS</color>: Good. Course for base, Commander, and somebody get the coffee on.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1VictoryRescueMessage=Title=<size=40><color=Lime>CONTRACT FULFILLED</color></size>\nBody=<color=SandyBrown>ATLAS</color>: The convoy is clear of the storm cell. Four hulls in, four hulls out. The client has transferred payment.\n\n<color=Orchid>SIREN</color>: And PetroChem Holdings just wired us a bonus for their people. Their master is in your sick bay promising us a discount at their yard, and he means it - he has nothing else to give us and he knows it.\n\nCommander, we did not get paid to do that tonight. We did it anyway, and this coast has a long memory for both kinds of story.\n\n<color=SandyBrown>ATLAS</color>: The important thing is that the good guys get paid well. Course for base.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1ConvoyLostMessage=Title=<size=40><color=Red>CONTRACT TERMINATED</color></size>\nBody=<color=SandyBrown>ATLAS</color>: We have lost a ship out of the convoy.\n\nHalcyon does not pay an escort fee for a hull that goes to the bottom under escort, and their underwriter is going to spend the next two years asking exactly what the armed escort was doing at the time.\n\nContract voided. No payment.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=MISSION FAILED\nBody=Phantom Wake has no hulls left in the water in this sector.\n\nIf there is a next contract, somebody else is running it.\nButtonText=Exit mission\nPopupStyle=Outro


; Sensor-based, not a static circle - the pirate group is moving on its
; own authored route, so this fires whenever the player actually gets a
; detection on any of them, wherever that happens to be.
;
; _Taskforce names the side DOING the detecting, not the owner of the
; units being detected. Vanilla cross-side precedent:
; Molina/02 Guns of Port Louis Trigger7 (_Taskforce=Taskforce1 detecting
; Taskforce2Vessel4-6) and Molina/01 Wolves of the South Atlantic
; Trigger4 (UnitClassified, _Taskforce=Taskforce2 on Taskforce1 hulls,
; "once player detected"). So the detector here is Taskforce1.
[Trigger3]
Name=Pirate group detected
Condition_PiratesSpotted_Type=UnitDetected
Condition_PiratesSpotted_Taskforce=Taskforce1
Condition_PiratesSpotted_Units=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3,Taskforce2Vessel4
Condition_PiratesSpotted_MinimumUnits=1
ConditionsCompleted=<PiratesSpotted>
Action_Taskforce1_Message=Taskforce1AggroMessage

[Trigger4]
Name=Pirate skiffs destroyed - victory
Condition_SkiffsDead_Type=UnitDestroyed
Condition_SkiffsDead_Units=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3,Taskforce2Vessel4
ConditionsCompleted=<SkiffsDead>
Action_Taskforce1_Message=Taskforce1SkiffsDeadMessage
Action_EndMission=True
Action_Victory=Taskforce1
Action_ObjectivesCompleted=DestroySkiffs,TaskForceMustSurvive,ProtectCivilians
Action_VariableSet=01ASkiffsCleared,True

[Trigger5]
Name=Neutral fishing craft killed - contract terminated
Condition_CivDead_Type=UnitDestroyed
Condition_CivDead_Units=NeutralVessel1,NeutralVessel2,NeutralVessel3,NeutralVessel4,NeutralVessel5,NeutralVessel6,NeutralVessel7
Condition_CivDead_MinimumUnits=1
ConditionsCompleted=<CivDead>

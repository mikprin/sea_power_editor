; ---------- forecast ----------
StartForecast=CONTRACT WEATHER SUMMARY - PEMBA CHANNEL\nVALID: 020600-021800Z JUL 85\nClear skies, sea state 1, light northerly. Visibility unrestricted. No excuse for a bad shot, and no excuse for a wrong one either.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - CONTRACT 01-A</size>\nSWEEPING NET\n<size=24>2 July 1985</size>\nBody=Listen up, Commander.\n\nIf we want to upgrade this rusted fleet, we need steady capital. A regional fishing conglomerate is losing its harvest and its crews to a localised pirate ring working the channel. The local coast guard is either too underfunded or too corrupt to deal with it, so they came to us.\n\nFlat bounty to clear the sector. No political strings, no secret cargo, no client riding along. Just a straightforward sweep. Get in, find the hostiles hiding among the fishing fleet, and send them to the bottom.\n\nHeavy ordnance is not covered by this bounty. A Harpoon costs more than the whole payout - use your deck guns and close the range.\nButtonText=Get underway\nPopupStyle=Intro

StartIntel=Contract 01-A - Sweep the marked search sector, identify hostiles hiding among the fishing fleet, and destroy them. Do not engage neutral craft.

Taskforce1SearchAreaMessage=Title=DATUM ENTERED\nBody=RADAR TOPOGRAPHY: CLEAR. SEA STATE: 1. MULTIPLE SURFACE CONTACTS IN THE SEARCH SECTOR.\n\nTACTICAL ANALYSIS: SEVERAL CONTACTS ARE STATIONARY, LOITERING AMONG THE FISHING CLUSTER RATHER THAN WORKING NETS. MASKING BEHAVIOUR CONSISTENT WITH ARMED SKIFFS.\n\nVISUAL IDENTIFICATION REQUIRED BEFORE WEAPONS RELEASE. RADAR ALONE WILL NOT TELL YOU WHICH CONTACT IS A FISHERMAN.\nButtonText=Acknowledge\nPopupStyle=Notification

Taskforce1AggroMessage=Title=CONTACT - SMALL CRAFT GROUP\nBody=Positive identification on the small craft group patrolling north of the search sector. Weapons visible, holding formation.\n\nThey will not wait for you to close the range. Watch your fire - the water around them is still full of fishermen who have nothing to do with this.\nButtonText=Engage\nPopupStyle=Message

Taskforce1SkiffsDeadMessage=Title=<size=40><color=Lime>CONTRACT FULFILLED</color></size>\nBody=Targets neutralised. The conglomerate just wired the funds. Good hunting, Commander.\n\nThat was almost too easy for what they're paying. Take the win.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1CiviliansHitMessage=Title=<size=40><color=Red>CONTRACT TERMINATED</color></size>\nBody=We just put rounds into a boat full of fishermen.\n\nThe conglomerate is not paying a company that sinks the fleet it hired us to protect. Contract voided, no payment, and word of this will travel up and down this coast.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=MISSION FAILED\nBody=Phantom Wake has no hulls left in the water in this sector.\n\nIf there is a next contract, somebody else is running it.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1MysteryContactMessage=Title=SONAR - UNIDENTIFIED SUBSURFACE CONTACT\nBody=PASSIVE SONAR CONTACT, SUBSURFACE. ACOUSTIC SIGNATURE DOES NOT MATCH ANY REGIONAL NAVY ON FILE.\n\nACTIVE SONAR AND TOWED ARRAY BOTH IN USE. THIS IS NOT A FISHING BOAT LISTENING FOR SOMETHING. SOMEBODY IS LISTENING TO US.\n\nCOMMANDER, THIS CONTACT IS NOT PART OF THE CONTRACT. RECOMMEND CAUTION.\nButtonText=Acknowledge\nPopupStyle=Notification

MysteryContactIntel=Unidentified diesel submarine, non-standard sensor fit, no transponder response. Not tasked by this contract - flagged for the record.

Taskforce1MysteryContactDownMessage=Title=CONTACT NEUTRALISED\nBody=Whatever that boat was, it is not listening to anyone anymore.\n\nCommand, that thing wasn't on any manifest we've ever seen. Whoever built her didn't want her found. Somebody's going to want to know we found her anyway.\nButtonText=Continue\nPopupStyle=Message


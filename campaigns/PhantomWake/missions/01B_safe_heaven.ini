; REMOVED: the old Trigger5 was a UnitClassified backstop, "Taskforce2
; has classified Taskforce1Vessel1 - contract terminated". Vanilla only
; ever uses that condition the other way round, and the most likely
; reading of a bad run is that it resolved true almost immediately and
; killed the mission before the player had done anything. It is gone.
; Detection is now the marked radar barriers and nothing else, which is
; the half of the model that is visible to the player anyway.

; Fire discipline. There is no "weapon fired" condition, so this fires
; on the only outcome that matters - a dead government patrol boat.
[Trigger5]
Name=Coast Guard vessel sunk - contract terminated
Condition_CGDead_Type=UnitDestroyed
Condition_CGDead_Units=Taskforce2Vessel1,Taskforce2Vessel2,Taskforce2Vessel3,Taskforce2Vessel4,Taskforce2Vessel5,Taskforce2Vessel6
Condition_CGDead_MinimumUnits=1
ConditionsCompleted=<CGDead>
Action_Taskforce1_Message=Taskforce1WeaponsMessage
Action_Taskforce1_VoiceMessage=MissionFail
Action_EndMission=True
Action_Victory=Taskforce2
Action_ObjectivesFailed=NoShotsFired,ExtractVIP
Action_ObjectivesCancel=RemainUndetected,ProtectClient,TaskForceMustSurvive
Action_VariableSet=01BShotsFired,True

[Trigger6]
Name=Client vessel lost
Condition_ClientDead_Type=UnitDestroyed
Condition_ClientDead_Units=NeutralVessel1
ConditionsCompleted=<ClientDead>
Action_Taskforce1_Message=Taskforce1ClientLostMessage
Action_Taskforce1_VoiceMessage=MissionFail
Action_EndMission=True
Action_Victory=Taskforce2
Action_ObjectivesFailed=ProtectClient,ExtractVIP
Action_ObjectivesCancel=RemainUndetected,NoShotsFired,TaskForceMustSurvive
Action_VariableSet=01BClientLost,True

; Client identified. This is the search half of the mission: the yacht
; is one stern trawler among the local fishing craft, and nothing tells
; the player which contact is hers until a sensor actually resolves it.
;
; UnitDetected on a neutral unit, same shape as 01A Trigger7 (the
; Syndicate submarine subplot) - _Taskforce=Neutral names the side that
; owns the unit being detected, not the detector. NeutralVessel1 has
; IdentifySelf=Yes, so the transponder does the classifying for us.
;
; <NearBox> is a backstop: if the detection condition somehow never
; resolves, sailing into the 3 NM last-reported-position circle reveals
; her anyway, so the contract can never dead-end on a sensor edge case.
; Whichever fires first, the transfer circle is on the plot from then on.
[Trigger7]
Name=Stargazer identified - VIP confirmed
Condition_Identified_Type=UnitDetected
Condition_Identified_Taskforce=Neutral
Condition_Identified_Units=NeutralVessel1
Condition_NearBox_Type=UnitsInTheArea
Condition_NearBox_PositionNM=15.19,0,-5.76
Condition_NearBox_AreaRadiusNM=3.0
Condition_NearBox_AreaDisplaySide=None
Condition_NearBox_Units=Taskforce1Vessel1
ConditionsCompleted=<Identified> OR <NearBox>
Action_Taskforce1_Message=Taskforce1ContactMessage
Action_Taskforce1_Intel=ContactIntel
Action_Taskforce1_VoiceMessage=ObjectiveComplete

; The transfer. No clock at all any more - the old build spawned the
; alert element as a stopwatch and gated the pickup on its arrival, and
; the timing never read as fair from the bridge. Reaching 0.1 NM of a
; stationary trawler IS the task; the client is across the instant the
; player gets there.
;
; 0.1 NM is 185 m, so this is a genuine lay-alongside and cannot be
; satisfied by a fast pass at range. The circle is drawn to the player
; (AreaDisplaySide=Blue) - at that size it is a dot until zoomed in, but
; it removes any guesswork about where "close enough" is.
;
; The alert element still spawns here, and the alert sweep still arms
; (Trigger11, same condition), but now they are pure withdrawal pressure
; rather than a timer: something to outrun, not something to wait out.
; One trigger, one Action_Units list (docs/CLAUDE.md section 5) - both
; Osa hulls are the only unit-targeting action here, so that is fine.
[Trigger8]
Name=Alongside at 0.1 NM - client aboard
Condition_Alongside_Type=UnitsInTheArea
Condition_Alongside_PositionNM=15.19,0,-5.76
Condition_Alongside_AreaRadiusNM=0.1
Condition_Alongside_AreaLabel=TransferAreaLabel
Condition_Alongside_AreaDisplaySide=Blue
Condition_Alongside_Units=Taskforce1Vessel1
ConditionsCompleted=<Alongside>
Action_Taskforce1_Message=Taskforce1TransferDoneMessage
Action_Taskforce1_Intel=AlertIntel
Action_Taskforce1_VoiceMessage=ObjectiveComplete
Action_SetEnabledStatus=True
Action_Units=Taskforce2Vessel3,Taskforce2Vessel4
Action_EnableTriggers=Trigger9
Action_VariableSet=01BVIPAboard,True

[Trigger9]
Name=Extraction reached - contract fulfilled
Disabled=True
Condition_Extract_Type=UnitsInTheArea
Condition_Extract_PositionNM=10.0,0,-24.0
Condition_Extract_AreaRadiusNM=4
Condition_Extract_AreaLabel=ExtractionAreaLabel
Condition_Extract_AreaDisplaySide=Blue
Condition_Extract_Units=Taskforce1Vessel1
ConditionsCompleted=<Extract>
Action_Taskforce1_Message=Taskforce1VictoryMessage
Action_Taskforce1_VoiceMessage=MissionComplete
Action_EndMission=True
Action_Victory=Taskforce1
Action_ObjectivesCompleted=ExtractVIP,RemainUndetected,NoShotsFired,ProtectClient,TaskForceMustSurvive
Action_VariableSet=01BVIPExtracted,True

[Trigger10]
Name=Task force wiped out - defeat
Condition_NoHulls_Type=HasNoUnitsOfType
Condition_NoHulls_Taskforce=Taskforce1
Condition_NoHulls_UnitType=Vessel
ConditionsCompleted=<NoHulls>
Action_Taskforce1_Message=Taskforce1TaskForceLostMessage
Action_EndMission=True
Action_Victory=Taskforce2
Action_ObjectivesFailed=TaskForceMustSurvive,ExtractVIP
Action_ObjectivesCancel=RemainUndetected,NoShotsFired,ProtectClient

; Same condition as Trigger8, split only because Trigger8 already spends
; its one Action_EnableTriggers line on Trigger9 and a comma list on that
; action is not confirmed anywhere in vanilla (same reasoning as
; 01C_rusted_spear Trigger5). This arms the alert sweep barrier so the
; withdrawal route is not the approach route in reverse.
[Trigger11]
Name=Client aboard - arm the alert sweep
Condition_AlongsideB_Type=UnitsInTheArea
Condition_AlongsideB_PositionNM=15.19,0,-5.76
Condition_AlongsideB_AreaRadiusNM=0.1
Condition_AlongsideB_AreaDisplaySide=None
Condition_AlongsideB_Units=Taskforce1Vessel1
ConditionsCompleted=<AlongsideB>
Action_EnableTriggers=Trigger4

; REMOVED: the dawn deadline. There was a 0400 warning and a hard
; mission end at 7200 s. Take as long as you like now - the pressure is
; supposed to come from the alert element and the radar barriers, not
; from a clock the player cannot see.

[Taskforce1_Objectives]
ExtractVIP=60,-60,Complete,Main
RemainUndetected=20,-40,Complete,Main
NoShotsFired=10,-30,Complete
ProtectClient=0,-40,Complete
TaskForceMustSurvive=10,-10,Complete


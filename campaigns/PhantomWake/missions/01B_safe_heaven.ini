; Transfer begins. One trigger, one Action_Units list (docs/CLAUDE.md
; section 5) - the clock and the alert element are all spawned by the
; same Action_SetEnabledStatus, which is exactly what is wanted here.
; The circle is 0.8 NM rather than the 0.5 it was, so getting the
; transfer to start does not depend on parking to the metre.
[Trigger7]
Name=Alongside the Stargazer - start the transfer clock
Condition_Alongside_Type=UnitsInTheArea
Condition_Alongside_PositionNM=15.19,0,-5.76
Condition_Alongside_AreaRadiusNM=0.8
Condition_Alongside_AreaDisplaySide=None
Condition_Alongside_Units=Taskforce1Vessel1
ConditionsCompleted=<Alongside>
Action_Taskforce1_Message=Taskforce1TransferMessage
Action_Taskforce1_Intel=AlertIntel
Action_SetEnabledStatus=True
Action_Units=Taskforce2Vessel3,Taskforce2Vessel4
Action_EnableTriggers=Trigger4

; Transfer complete. The clock is the alert element itself - a surface
; unit, so no altitude ambiguity, and one the player can watch closing
; on the plot. It spawns 6.4 NM out on a straight run-in already on the
; correct heading, and this gate sits 1.3 NM along that leg. The game's
; own ETA for the full 6.4 NM leg is 12 minutes, accel included, so the
; gate trips about two and a half minutes after the transfer starts.
;
; <StillAlongside> is the player still parked in the 0.8 NM circle,
; which is what enforces the "stop the ship" rule - there is no speed
; condition in the engine.
;
; The gate is deliberately WIDE - 1.5 NM centred on the alert element's
; first waypoint, 2.5 NM up its run-in. The boat is inside it from about
; 1.9 minutes after spawn until about 7.5 minutes, so the two conditions
; only have to overlap somewhere in a five and a half minute window
; rather than in the same instant. The first build used a 0.8 NM gate
; and the clock could be spent while the player was off station.
;
; The route also loops back through that first waypoint, so a player who
; comes back late gets the gate again instead of a locked contract.
[Trigger8]
Name=Transfer complete - client aboard
Condition_AlertGate_Type=UnitsInTheArea
Condition_AlertGate_PositionNM=9.56,0,-14.05
Condition_AlertGate_AreaRadiusNM=1.5
Condition_AlertGate_AreaDisplaySide=None
Condition_AlertGate_Units=Taskforce2Vessel3,Taskforce2Vessel4
Condition_AlertGate_MinimumUnits=1
Condition_StillAlongsideB_Type=UnitsInTheArea
Condition_StillAlongsideB_PositionNM=15.19,0,-5.76
Condition_StillAlongsideB_AreaRadiusNM=0.8
Condition_StillAlongsideB_AreaDisplaySide=None
Condition_StillAlongsideB_Units=Taskforce1Vessel1
ConditionsCompleted=<AlertGate> AND <StillAlongsideB>
Action_Taskforce1_Message=Taskforce1TransferDoneMessage
Action_Taskforce1_VoiceMessage=ObjectiveComplete
Action_EnableTriggers=Trigger9
Action_VariableSet=01BVIPAboard,True

[Trigger9]
Name=Extraction reached - contract fulfilled
Disabled=True
Condition_Extract_Type=UnitsInTheArea
Condition_Extract_PositionNM=10.0,0,-24.0
Condition_Extract_AreaRadiusNM=4

; ---------- forecast ----------
StartForecast=CONTRACT WEATHER SUMMARY - MASCARENE BASIN\nVALID: 092100-100600Z JUL 85\nNo moon. Broken cloud, sea state 1, light southeast trades. Visibility poor by eye, unrestricted by radar. Dark works for both sides tonight.

; ---------- popup and intel messages ----------
Taskforce1StartMessage=Title=<size=24>PHANTOM WAKE - CONTRACT 01-B</size>\nSAFE HAVEN\n<size=24>9 July 1985 - 2240 local</size>\nBody=<color=SandyBrown>ATLAS</color>: Listen up, Commander. Lucrative side contract, and an easy one if nobody loses their nerve.\n\nA high net worth individual chartered an expedition yacht, the Stargazer, and suffered a very convenient total engine failure just inside territorial waters west of the island. The local Coast Guard is sweeping the area. Our client would rather not explain to them why he is carrying three briefcases of unmarked bearer bonds. Get in, pick him up, get out.\n\n<color=Orchid>SIREN</color>: The authorities are on high alert. Armed patrol boats running search patterns, surface radars up, searchlights manned. If they paint you, they intercept, and the payout dies with the contract. If you shoot at them, we are international criminals by breakfast. Weapons hold, Commander. All night.\n\n<color=Aqua>E.C.H.O.</color>: RECOMMENDATION - DEACTIVATE ACTIVE SENSORS. RIG FOR SILENT RUNNING. TRACK PATROL EMISSIONS ON ESM AND STEER THE UNLIT LANES BETWEEN THEIR RADAR HORIZONS. THE LIT SECTORS ARE MARKED ON YOUR PLOT.\nButtonText=Get underway\nPopupStyle=Intro

StartIntel=Contract 01-B - Reach the yacht Stargazer, hold station alongside until the client is aboard, then withdraw to NavPoint Sanctuary. Do not enter marked radar coverage. Do not fire.

Taskforce1BeltMessage=Title=ESM - MULTIPLE SURFACE SEARCH EMITTERS\nBody=<color=Aqua>E.C.H.O.</color>: ESM CONTACT. TWO SURFACE SEARCH SETS BEARING EAST THROUGH SOUTH, INTERMITTENT, CONSISTENT WITH SMALL PATROL CRAFT UNDER 30 TONS.\n\nEMITTER GEOMETRY PLOTTED. LIT SECTORS ARE THE MARKED CIRCLES. THE SEAMS BETWEEN THEM ARE APPROXIMATELY TWO AND A HALF MILES WIDE. STEER THE MIDDLE OF A SEAM, NOT THE EDGE.\n\nRECOMMEND TELEGRAPH ONE THIRD OR LESS. WAKE IS VISIBLE AT NIGHT FROM CLOSER THAN YOU WOULD LIKE.\nButtonText=Acknowledge\nPopupStyle=Notification

Taskforce1DetectedMessage=Title=<size=40><color=Red>CONTRACT TERMINATED</color></size>\nBody=<color=Orchid>SIREN</color>: They have us. Solid radar lock, and a challenge on channel sixteen with our bearing in it.\n\n<color=SandyBrown>ATLAS</color>: That is it. The client is not getting off that boat tonight and we are not getting paid. Break off, run dark, and hope their duty officer is too lazy to file the report.\n\nContract voided. No payment.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1WeaponsMessage=Title=<size=40><color=Red>CONTRACT TERMINATED</color></size>\nBody=<color=SandyBrown>ATLAS</color>: We just sank a government patrol boat over a briefcase of bonds.\n\nThe client will deny he ever met us. The authorities will not. Every harbour from here to Mombasa is closed to Phantom Wake as of tonight, and the bounty on our hulls is now bigger than the fee.\n\nContract voided. No payment.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1ClientLostMessage=Title=<size=40><color=Red>CLIENT LOST</color></size>\nBody=The Stargazer is gone, and so is the man we were paid to collect.\n\n<color=SandyBrown>ATLAS</color>: Nobody pays a salvage fee for a client on the bottom. Get us out of these waters before somebody starts asking who was alongside her.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1TransferMessage=Title=ALONGSIDE - TRANSFER IN PROGRESS\nBody=<color=Aqua>E.C.H.O.</color>: VIP SECURED ON DECK. TRANSFER IN PROGRESS. STANDBY. TWO MINUTES, MAYBE MORE.\n\nHOLD STATION. DO NOT LEAVE THE TRANSFER RADIUS - THE BOAT CANNOT BE WORKED ALONGSIDE ABOVE TWO KNOTS.\n\nWARNING - ESM CONTACT, NEW EMITTER SOUTHWEST, CLOSING. TWO HULLS, HIGH SPEED, SURFACE SEARCH RADAR RADIATING CONTINUOUSLY. ALERT ELEMENT. THEY ARE COMING TO LOOK AT THIS YACHT.\nButtonText=Hold station\nPopupStyle=Notification

AlertIntel=Coast Guard alert element under way from the southwest with radar radiating. Alert sweep sectors now plotted - new lit water between you and NavPoint Sanctuary.

Taskforce1TransferDoneMessage=Title=PACKAGE SECURE\nBody=<color=SandyBrown>ATLAS</color>: Package is secure and counting his briefcases in your wardroom. Start the engines, keep it quiet, and head for the extraction zone.\n\n<color=Orchid>SIREN</color>: The alert element is still inbound and their sweep has lit new water south of you. The seams have moved. Read your plot before you push the telegraph.\nButtonText=Withdraw\nPopupStyle=Notification

Taskforce1VictoryMessage=Title=<size=40><color=Lime>CONTRACT FULFILLED</color></size>\nBody=<color=SandyBrown>ATLAS</color>: Clear of territorial water, nothing behind us but a confused duty officer and a yacht with a very convenient engine fault.\n\nThe client transferred the fee before he finished his second drink. He also said, and I quote, that he may have further work for people who can be somewhere without ever having been there.\n\n<color=Aqua>E.C.H.O.</color>: NO CLASSIFICATION EVENT LOGGED AGAINST THIS TASK FORCE. WE WERE NOT HERE.\nButtonText=Exit mission\nPopupStyle=Outro

Taskforce1TaskForceLostMessage=Title=MISSION FAILED\nBody=Phantom Wake has no hulls left in the water in this sector.\n\nIf there is a next contract, somebody else is running it.\nButtonText=Exit mission\nPopupStyle=Outro


; REMOVED: the old Trigger5 was a UnitClassified backstop, "Taskforce2
; has classified Taskforce1Vessel1 - contract terminated". Vanilla only
; ever uses that condition the other way round, and the most likely
; reading of a bad run is that it resolved true almost immediately and
; killed the mission before the player had done anything. It is gone.
; Detection is now the marked radar barriers and nothing else, which is
; the half of the model that is visible to the player anyway.

; Fire discipline. There is no "weapon fired" condition, so this fires
; on the only outcome that matters - a dead government patrol boat.
[Trigger5]
Name=Coast Guard vessel sunk - contract terminated
Condition_CGDead_Type=UnitDestroyed

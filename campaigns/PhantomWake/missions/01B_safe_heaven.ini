Condition_Sweep4_AreaRadiusNM=2.5
Condition_Sweep4_AreaDisplaySide=Blue
Condition_Sweep4_Units=Taskforce1Vessel1
ConditionsCompleted=<Sweep1> OR <Sweep2> OR <Sweep3> OR <Sweep4>

; Two stopwatches have lived here and both are gone. The first was an
; airliner: its arrival condition never resolved, because the trigger
; inspector reported the area as "Height: 0 ft" while the aircraft sat
; at 1,466 ft - aircraft do not appear to satisfy a surface area check.
; The second was the alert element itself, a surface unit gating the
; pickup on its run-in; that one worked mechanically but read as an
; arbitrary wait from the bridge. There is no transfer clock at all now.
; Reaching 0.1 NM of the trawler completes the pickup outright
; (Trigger8), and the alert element is only there to make the withdrawal
; expensive.


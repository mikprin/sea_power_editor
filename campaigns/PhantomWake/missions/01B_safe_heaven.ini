; =====================================================================
; TRIGGERS
;
; Detection model. The engine has no "distance between two units"
; condition (docs/CLAUDE.md section 3), so patrol radar coverage is
; modelled as a barrier of static circles - the same chain-of-circles
; pattern used for barrier lines, but inverted - centres 7.5 NM apart
; with a 2.5 NM radius leaves deliberate 2.5 NM seams open between them.
; Entering a lit circle is the ROE violation.
;
; Every lobe is drawn to the player (AreaDisplaySide=Blue) and shares
; one label. That is the whole stealth mechanic: it is a visible
; navigation puzzle, not a hidden dice roll, and it is deterministic.
;
; Barrier 1 (Trigger3) runs north-east to south-west across the
; approach lane, seams at 11.65,0.87 and 7.35,-5.27.
; Barrier 2 (Trigger4) is the alert sweep across the withdrawal lane to
; NavPoint Sanctuary in the south, disabled until the transfer starts,
; seams at 11.34,-15.46 and 16.82,-20.58 plus a long way round to the
; west that costs 15 NM against the dawn clock.
; The direct line from the yacht to the extraction circle clips lobe
; Sweep3 by half a mile, so the withdrawal has to be steered, not
; ordered. Same for the two lanes around the south-west tail of
; barrier 1.
; The yacht sits in a clean pocket - the nearest lobe of either barrier
; is 6.7 NM away, so a player holding station cannot be caught by
; geometry while stuck at Telegraph 0.
; =====================================================================

[Trigger1]
Name=Start
Condition_Start_Type=Time
Condition_Start_Time=5
ConditionsCompleted=<Start>
Action_Taskforce1_Message=Taskforce1StartMessage
Action_Taskforce1_Intel=StartIntel
